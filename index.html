<script>
(function(){
  "use strict";

  /* ============ Storage helpers ============================================================
     Cloud database: Supabase (Postgres). Fill in your project's URL + anon key below and
     every device that opens this site shares the same live data. Falls back automatically to
     native SQLite (packaged Android app) → IndexedDB → localStorage for offline access, and as
     the only storage layer if Supabase isn't configured or is briefly unreachable. All values
     are kept as JSON blobs under a small key/value table — this keeps every existing read/write
     in the app unchanged regardless of which engine is active.

     NOTE on multi-device use: this still stores config/orders as one JSON blob per key, so if
     two devices save at the exact same moment, the later write wins and can overwrite the
     other's change. Fine for a single active till; ask if you want this split into proper
     relational tables (orders as real rows) for safe concurrent multi-device editing. */
  const supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  async function cloudGet(key){
    const { data, error } = await supabaseClient.from("kv").select("value").eq("key", key).maybeSingle();
    if(error) throw error;
    return data ? data.value : undefined;
  }
  async function cloudSet(key, value){
    const { error } = await supabaseClient.from("kv").upsert({key, value, updated_at: new Date().toISOString()});
    if(error) throw error;
  }

  const STORAGE_PREFIX = "kaapipos:";
  const SQLITE_DB_NAME = "kaapipos";
  const IDB_DB_NAME = "kaapipos-db";
  const IDB_VERSION = 1;
  const IDB_STORE_NAME = "kv";

  function nativeSqlite(){
    return (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
      && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorSQLite) || null;
  }

  let sqliteReadyPromise = null;
  function ensureSqliteReady(){
    if(sqliteReadyPromise) return sqliteReadyPromise;
    sqliteReadyPromise = (async () => {
      const SQLite = nativeSqlite();
      try{
        const isConn = await SQLite.isConnection({database:SQLITE_DB_NAME, readonly:false});
        if(!(isConn && isConn.result)){
          await SQLite.createConnection({database:SQLITE_DB_NAME, version:1, encrypted:false, mode:"no-encryption", readonly:false});
        }
      }catch(e){ /* connection may already exist across a hot-reload — safe to ignore */ }
      await SQLite.open({database:SQLITE_DB_NAME, readonly:false});
      await SQLite.execute({
        database:SQLITE_DB_NAME, readonly:false, transaction:true,
        statements:"CREATE TABLE IF NOT EXISTS kv (key TEXT PRIMARY KEY NOT NULL, value TEXT NOT NULL);"
      });
      return SQLite;
    })();
    return sqliteReadyPromise;
  }
  async function sqliteGet(key){
    const SQLite = await ensureSqliteReady();
    const res = await SQLite.query({database:SQLITE_DB_NAME, statement:"SELECT value FROM kv WHERE key = ?;", values:[key]});
    const rows = (res && res.values) || [];
    if(rows.length === 0) return undefined;
    return JSON.parse(rows[0].value);
  }
  async function sqliteSet(key, value){
    const SQLite = await ensureSqliteReady();
    await SQLite.run({
      database:SQLITE_DB_NAME, readonly:false,
      statement:"INSERT INTO kv (key, value) VALUES (?, ?) ON CONFLICT(key) DO UPDATE SET value = excluded.value;",
      values:[key, JSON.stringify(value)]
    });
  }

  let dbPromise = null;
  function openDb(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve)=>{
      if(!("indexedDB" in window)){ resolve(null); return; }
      let req;
      try{ req = indexedDB.open(IDB_DB_NAME, IDB_VERSION); }
      catch(e){ resolve(null); return; }
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE_NAME)) db.createObjectStore(IDB_STORE_NAME);
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> resolve(null);
      req.onblocked = ()=> resolve(null);
    });
    return dbPromise;
  }
  function idbGet(db, key){
    return new Promise((resolve)=>{
      try{
        const tx = db.transaction(IDB_STORE_NAME, "readonly");
        const req = tx.objectStore(IDB_STORE_NAME).get(key);
        req.onsuccess = ()=> resolve(req.result);
        req.onerror = ()=> resolve(undefined);
      }catch(e){ resolve(undefined); }
    });
  }
  function idbSet(db, key, value){
    return new Promise((resolve, reject)=>{
      try{
        const tx = db.transaction(IDB_STORE_NAME, "readwrite");
        tx.objectStore(IDB_STORE_NAME).put(value, key);
        tx.oncomplete = ()=> resolve(true);
        tx.onerror = ()=> reject(tx.error);
        tx.onabort = ()=> reject(tx.error);
      }catch(e){ reject(e); }
    });
  }

  async function localGet(key, fallback){
    if(nativeSqlite()){
      try{
        const val = await sqliteGet(key);
        if(val !== undefined) return val;
      }catch(e){
        console.error("sqlite get failed", key, e);
      }
    }
    const db = await openDb();
    if(db){
      const val = await idbGet(db, key);
      if(val !== undefined) return val;
      try{
        const raw = localStorage.getItem(STORAGE_PREFIX + key);
        if(raw !== null && raw !== undefined){
          const migrated = JSON.parse(raw);
          await idbSet(db, key, migrated).catch(()=>{});
          return migrated;
        }
      }catch(e){ /* ignore */ }
      return fallback;
    }
    try{
      const raw = localStorage.getItem(STORAGE_PREFIX + key);
      if(raw === null || raw === undefined) return fallback;
      return JSON.parse(raw);
    }catch(e){
      return fallback;
    }
  }
  async function localSet(key, value){
    if(nativeSqlite()){
      try{ await sqliteSet(key, value); return true; }
      catch(e){ console.error("sqlite set failed", key, e); return false; }
    }
    const db = await openDb();
    if(db){
      try{ await idbSet(db, key, value); return true; }
      catch(e){ console.error("indexeddb set failed", key, e); }
    }
    try{
      localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
      return true;
    }catch(e){
      console.error("storage set failed", key, e);
      return false;
    }
  }

  async function storeGet(key, fallback){
    if(supabaseClient){
      try{
        const val = await cloudGet(key);
        if(val !== undefined){
          localSet(key, val); // keep the local cache warm for offline access
          return val;
        }
      }catch(e){
        console.error("supabase get failed, using local cache", key, e);
      }
    }
    return localGet(key, fallback);
  }
  async function storeSet(key, value){
    let cloudFailed = false;
    if(supabaseClient){
      try{
        await cloudSet(key, value);
      }catch(e){
        cloudFailed = true;
        console.error("supabase set failed", key, e);
      }
    }
    const localOk = await localSet(key, value);
    if(cloudFailed){
      showToast("Offline — saved on this device, will need to resync");
    }else if(!localOk){
      showToast("Couldn't save — device storage full or blocked");
    }
  }

  /* ============ Overlay navigation stack (Android/browser back-button support) ============
     Every full-screen overlay, bottom sheet and modal pushes a history entry when it opens.
     Pressing the hardware/gesture back button (or an in-app back/close control) then unwinds
     the stack one layer at a time instead of exiting the whole app. */
  const layerStack = [];

  function pushOverlay(type, onClose){
    layerStack.push({type, close:onClose});
    history.pushState({kaapiDepth:layerStack.length}, "");
  }
  function replaceTopOverlay(type, onClose){
    if(layerStack.length){
      layerStack[layerStack.length-1] = {type, close:onClose};
    } else {
      layerStack.push({type, close:onClose});
    }
    history.replaceState({kaapiDepth:layerStack.length}, "");
  }
  function closeTopOverlay(){
    if(layerStack.length>0) history.back();
  }
  function closeOverlaysCount(n){
    if(n>0) history.go(-n);
  }
  window.addEventListener("popstate", function(e){
    const targetDepth = (e.state && typeof e.state.kaapiDepth === "number") ? e.state.kaapiDepth : 0;
    while(layerStack.length > targetDepth){
      const top = layerStack.pop();
      if(top && typeof top.close === "function") top.close();
    }
  });
  history.replaceState({kaapiDepth:0}, "");

  /* ============ Utilities ============ */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function money(n){
    n = Number(n)||0;
    return "₹" + (Number.isInteger(n) ? n : n.toFixed(2));
  }
  function todayStr(d){
    d = d || new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtTime(ts){
    const d = new Date(ts);
    let h = d.getHours(), m = String(d.getMinutes()).padStart(2,"0");
    const ap = h>=12?"pm":"am"; h = h%12; if(h===0) h=12;
    return h+":"+m+" "+ap;
  }
  function fmtDateTime(ts){
    const d = new Date(ts);
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return d.getDate()+" "+months[d.getMonth()]+", "+fmtTime(ts);
  }
  function fmtElapsed(startTs){
    let diff = Math.max(0, Date.now() - startTs);
    let mins = Math.floor(diff/60000);
    let h = Math.floor(mins/60), m = mins%60;
    return h>0 ? (h+"h "+m+"m") : (m+"m");
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function showToast(msg){
    const root = document.getElementById("toastRoot");
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(()=>el.remove(), 2200);
  }

    return state.orders.find(o => o.tableId === tableId && o.status === "open");

  function orderTotal(order){
    return order.items.reduce((s,l)=> s + l.price*l.qty, 0);
  }

    const c = state.config.categories.find(c=>c.id===id);
    return c ? c.name : "Uncategorized";
  }

    return state.config.items.filter(i => i.categoryId === catId);
  }

  async function persistOrders(){ await storeSet("cafe-orders", state.orders); }
  async function persistConfig(){ await storeSet("cafe-config", state.config); }

  /* ============ Init ============ */
  async function init(){
    // Ask the browser/WebView to treat this site's storage as persistent so Android
    // never silently evicts orders/reports under storage pressure (it's allowed to
    // clear "best-effort" storage on low disk space otherwise). Safe no-op if the
    // API isn't available or the request is declined.
    try{
      if(navigator.storage && navigator.storage.persist){
        await navigator.storage.persist();
      }
    }catch(e){ /* ignore — falls back to best-effort storage */ }

    let cfg = await storeGet("cafe-config", null);
    if(!cfg){ cfg = seedConfig(); await storeSet("cafe-config", cfg); }
    let needsSave = false;
    if(!cfg.settings){ cfg.settings = {cafeName:"Kaapi Cafe", address:"", phone:"", footerNote:"Thank you! Visit again"}; needsSave = true; }
    if(!cfg.nextInvoiceNo){ cfg.nextInvoiceNo = 1; needsSave = true; }
    if(needsSave) await storeSet("cafe-config", cfg);
    state.config = cfg;
    state.orders = await storeGet("cafe-orders", []);

    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("app").style.display = "flex";

    bindStaticEvents();
    render();

    timerInterval = setInterval(updateLiveTimers, 1000);
    startAutoReload();
  }

  /* ============ Auto reload (multi-device sync) ============
     Other devices (another phone at the counter, a tablet in the kitchen, etc.)
     can change tables/orders in Supabase at any time. Poll periodically and pull
     in fresh data — but only when it's safe: skip while the tab is hidden/backgrounded,
     and skip while any overlay, sheet, or modal is open so we never yank a bill out
     from under someone mid-order or mid-edit on this device. */
  const AUTO_RELOAD_INTERVAL_MS = 15000;
  let autoReloadTimer = null;
  function startAutoReload(){
    if(autoReloadTimer) clearInterval(autoReloadTimer);
    autoReloadTimer = setInterval(syncFromCloud, AUTO_RELOAD_INTERVAL_MS);
  }
  async function syncFromCloud(){
    if(document.hidden) return;
    if(layerStack.length > 0) return;
    try{
      const [cfg, orders] = await Promise.all([
        storeGet("cafe-config", state.config),
        storeGet("cafe-orders", state.orders)
      ]);
      state.config = cfg;
      state.orders = orders;
      render();
    }catch(e){
      console.error("auto-reload sync failed", e);
    }
  }

  function updateLiveTimers(){
    document.querySelectorAll("[data-elapsed-start]").forEach(el=>{
      const start = Number(el.getAttribute("data-elapsed-start"));
      el.textContent = fmtElapsed(start);
    });
  }

  /* ============ Render root ============ */
  function render(){
    document.querySelectorAll(".navbtn").forEach(b=>{
      b.classList.toggle("active", b.dataset.tab === state.tab);
    });
    const names = {tables:"Tables", menu:"Menu", reports:"Reports"};
    document.getElementById("tabName").textContent = names[state.tab];
    document.getElementById("headerMenuBtn").style.display = (state.tab === "reports") ? "flex" : "none";

    const view = document.getElementById("view");
    if(state.tab === "tables") view.innerHTML = renderTablesTab();
    else if(state.tab === "menu") view.innerHTML = renderMenuTab();
    else if(state.tab === "reports") view.innerHTML = renderReportsTab();

    renderModal();
  }

  /* ============ TABLES TAB ============ */
  function renderTablesTab(){
    const tables = state.config.tables;
    if(tables.length === 0){
      return emptyState("🍽️","No tables yet","Add your first table in the Menu tab under Tables, then come back here to start billing.");
    }
    const cards = tables.map(t=>{
      const order = getOpenOrder(t.id);
      const occ = !!order;
      const total = occ ? orderTotal(order) : 0;
      return `
        <button class="table-card ${occ?"occupied":""}" data-open-table="${t.id}">
          <div>
            <div class="tname">${escapeHtml(t.name)}</div>
            <div class="tstatus"><span class="dot"></span> ${occ?"Occupied":"Free"}</div>
          </div>
          <div class="tmeta">
            ${occ ? `<span class="telapsed" data-elapsed-start="${order.createdAt}">${fmtElapsed(order.createdAt)}</span>` : `<span class="telapsed">—</span>`}
            ${occ ? `<span class="ttotal">${money(total)}</span>` : `<span></span>`}
          </div>
        </button>`;
    }).join("");
    return `<div class="tables-grid">${cards}</div>`;
  }

  /* ============ REPORTS TAB ============ */
  function rangeBounds(){
    const anchor = new Date(state.reportAnchor + "T00:00:00");
    let start, end;
    if(state.reportRange === "day"){
      start = new Date(anchor); end = new Date(anchor); end.setHours(23,59,59,999);
    } else if(state.reportRange === "week"){
      const day = anchor.getDay();
      start = new Date(anchor); start.setDate(anchor.getDate()-day);
      end = new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59,999);
    } else {
      start = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
      end = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0, 23,59,59,999);
    }
    return {start:start.getTime(), end:end.getTime()};
  }

  function renderReportsTab(){
    const {start,end} = rangeBounds();
    const paid = state.orders.filter(o=>o.status==="paid" && o.paidAt>=start && o.paidAt<=end)
                              .sort((a,b)=>b.paidAt-a.paidAt);
    const total = paid.reduce((s,o)=>s+o.total,0);
    const cash = paid.reduce((s,o)=> s + (o.payment ? (o.payment.method==="cash" ? o.payment.total|| o.total : (o.payment.cash||0)) : 0), 0);
    const upi = paid.reduce((s,o)=> s + (o.payment ? (o.payment.method==="upi" ? (o.payment.total||o.total) : (o.payment.upi||0)) : 0), 0);

        }
        return `
          <div class="order-row" data-toggle-order="${o.id}">
            <div class="otop">
              <div>
                <div class="oleft">${escapeHtml(o.tableName)} · ${money(o.total)}</div>
                <div class="otime">${fmtTime(o.paidAt)}</div>
              </div>
              <span class="badge ${badgeClass}">${o.payment.method}</span>
            </div>
            ${detail}
          </div>`;
      }).join("");
    }

    return rangeButtons + stats + list;
  }

  /* ============ Empty state helper ============ */
  function emptyState(icon, title, body){
    return `<div class="empty-state"><div class="big">${icon}</div><div style="font-weight:700; font-size:15px;">${title}</div><p>${body}</p></div>`;
  }

  /* ============ BILLING OVERLAY ============ */
  function openBilling(tableId){
    state.activeTableId = tableId;
    state.billingCategoryFilter = "all";
    document.getElementById("billingOverlay").classList.add("open");
    renderBilling();
    pushOverlay("billing", doCloseBilling);
  }
  function doCloseBilling(){
    document.getElementById("billingOverlay").classList.remove("open");
    state.sheet = null;
    renderSheet();
    render();
  }

  function renderBilling(){
    const table = state.config.tables.find(t=>t.id===state.activeTableId);
    if(!table){ closeTopOverlay(); return; }
    const order = getOpenOrder(table.id);
    document.getElementById("billingTitle").textContent = table.name;
    document.getElementById("billingSub").textContent = order ? "Order open · " + fmtElapsed(order.createdAt) : "Empty order";
    const count = order ? order.items.reduce((s,l)=>s+l.qty,0) : 0;
    const countBadge = document.getElementById("billingCartCount");
    countBadge.style.display = count>0 ? "flex" : "none";
    countBadge.textContent = count;

    const cats = state.config.categories;
    const chips = `<div class="chip-row">
        <button class="chip ${state.billingCategoryFilter==='all'?'active':''}" data-billing-filter="all">All</button>
        ${cats.map(c=>`<button class="chip ${state.billingCategoryFilter===c.id?'active':''}" data-billing-filter="${c.id}">${escapeHtml(c.name)}</button>`).join("")}
      </div>`;

    let items = state.billingCategoryFilter==="all" ? state.config.items : itemsInCategory(state.billingCategoryFilter);
    let grid;
    if(state.config.items.length===0){
      grid = emptyState("🍪","No menu items yet","Add items in the Menu tab before billing.");
    } else if(items.length===0){
      grid = emptyState("🔍","Nothing in this category","Try a different category above.");
    } else {
      grid = `<div class="item-grid">` + items.map(it=>{
        const line = order ? order.items.find(l=>l.itemId===it.id) : null;
        const qty = line ? line.qty : 0;
        return `
          <button class="item-card" data-add-cart="${it.id}">
            ${qty>0?`<span class="qtybadge">${qty}</span>`:""}
            <div class="iname">${escapeHtml(it.name)}</div>
            <div class="iprice">${money(it.price)}</div>
          </button>`;
      }).join("") + `</div>`;
    }

    document.getElementById("billingBody").innerHTML = chips + grid;
    renderCartBar();
  }

  function renderCartBar(){
    // remove existing bar
    const existing = document.getElementById("cartBarEl");
    if(existing) existing.remove();
    const order = getOpenOrder(state.activeTableId);
    if(!order || order.items.length===0) return;
    const total = orderTotal(order);
    const count = order.items.reduce((s,l)=>s+l.qty,0);
    const bar = document.createElement("div");
    bar.id = "cartBarEl";
    bar.className = "cartbar";
    bar.innerHTML = `
      <div>
        <div class="cinfo">${count} item${count===1?"":"s"} in cart</div>
        <div class="ctotal">${money(total)}</div>
      </div>
      <button class="cta" id="viewCartBtn">View cart</button>`;
    document.getElementById("billingOverlay").appendChild(bar);
  }

  function addToCart(itemId){
    const table = state.config.tables.find(t=>t.id===state.activeTableId);
    const item = state.config.items.find(i=>i.id===itemId);
    if(!table || !item) return;
    let order = getOpenOrder(table.id);
    if(!order){
      order = {id:uid(), tableId:table.id, tableName:table.name, items:[], status:"open", createdAt:Date.now()};
      state.orders.push(order);
    }
    let line = order.items.find(l=>l.itemId===itemId);
    if(line) line.qty += 1;
    else order.items.push({itemId:item.id, name:item.name, price:item.price, qty:1});
    persistOrders();
    renderBilling();
  }

  function changeCartQty(itemId, delta){
    const order = getOpenOrder(state.activeTableId);
    if(!order) return;
    let line = order.items.find(l=>l.itemId===itemId);
    if(!line) return;
    line.qty += delta;
    if(line.qty <= 0){
      order.items = order.items.filter(l=>l.itemId!==itemId);
    }
    if(order.items.length===0){
      state.orders = state.orders.filter(o=>o.id!==order.id);
      state.sheet = null;
      renderSheet();
      // The cart sheet auto-closed programmatically here (not via the back button/backdrop),
      // so pop its entry off the nav stack too -- otherwise the next back-press just consumes
      // this now-stale "sheet" layer instead of actually leaving the billing screen.
      if(layerStack.length && layerStack[layerStack.length-1].type === "sheet"){
        closeTopOverlay();
      }
    }
    persistOrders();
    renderBilling();
    if(state.sheet === "cart") renderSheet();
  }

  function openCartSheet(){
    state.sheet = "cart";
    renderSheet();
    pushOverlay("sheet", doCloseCartSheet);
  }
  function doCloseCartSheet(){
    state.sheet = null;
    renderSheet();
  }

  function renderSheet(){
    const root = document.getElementById("sheetRoot");
    if(state.sheet !== "cart"){ root.innerHTML=""; return; }
    const order = getOpenOrder(state.activeTableId);
    if(!order || order.items.length===0){ root.innerHTML=""; state.sheet=null; return; }
    const total = orderTotal(order);
    const lines = order.items.map(l=>`
      <div class="cart-line">
        <div style="flex:1;">
          <div class="clname">${escapeHtml(l.name)}</div>
          <div class="clprice">${money(l.price)} each</div>
        </div>
        <div class="cart-lineprice">${money(l.price*l.qty)}</div>
        <div class="stepper">
          <button data-cart-dec="${l.itemId}">−</button>
          <span>${l.qty}</span>
          <button data-cart-inc="${l.itemId}">+</button>
        </div>
      </div>`).join("");
    root.innerHTML = `
      <div class="sheet-backdrop" id="sheetBackdrop">
        <div class="sheet">
          <div class="sheet-handle"></div>
          <div class="sheet-head"><h3>Order — ${escapeHtml(order.tableName)}</h3><button class="icon-btn" id="closeSheet">✕</button></div>
          <div class="sheet-body">${lines}</div>
          <div class="subtotal-row"><span>Subtotal</span><span class="val">${money(total)}</span></div>
          <div class="sheet-footer">
            <button class="btn btn-outline btn-block" id="holdOrderBtn">Hold order</button>
            <button class="btn btn-amber btn-block" id="checkoutBtn">Payment</button>
          </div>
        </div>
      </div>`;
  }

  /* ============ PRINTING (KOT + Bill, 2" / 58mm thermal) ============ */
  function buildKOTHtml(order){
    const lines = order.items.map(l=>`<div class="kot-line"><span class="q">${l.qty} x</span><span>${escapeHtml(l.name)}</span></div>`).join("");
    return `
      <div class="receipt">
        <div class="r-center r-bold r-big">KITCHEN ORDER</div>
        <div class="r-hr"></div>
        <div class="r-row"><span class="r-bold">${escapeHtml(order.tableName)}</span><span class="small">${fmtDateTime(Date.now())}</span></div>
        <div class="r-hr"></div>
        ${lines}
        <div class="r-hr"></div>
      </div>`;
  }

  function buildBillHtml(order){
    const cfg = state.config.settings || {};
    const itemRows = order.items.map(l=>{
      const amt = l.price*l.qty;
      return `<div class="bill-item"><span class="bi-name">${escapeHtml(l.name)}</span><span class="bi-qty">${l.qty}</span><span class="bi-amt">${money(amt)}</span></div>`;
    }).join("");
    let payBlock;
    if(order.payment.method === "mixed"){
      payBlock = `<div class="r-row"><span>Cash</span><span>${money(order.payment.cash)}</span></div><div class="r-row"><span>UPI</span><span>${money(order.payment.upi)}</span></div>`;
    } else {
      payBlock = `<div class="r-row"><span>Paid via</span><span>${order.payment.method.toUpperCase()}</span></div>`;
    }
    return `
      <div class="receipt">
        <div class="r-center r-bold r-big">${escapeHtml(cfg.cafeName || "Kaapi Cafe")}</div>
        ${cfg.address ? `<div class="r-center small">${escapeHtml(cfg.address)}</div>` : ""}
        ${cfg.phone ? `<div class="r-center small">${escapeHtml(cfg.phone)}</div>` : ""}
        <div class="r-hr"></div>
        <div class="r-row small"><span>Bill #${order.invoiceNo || ""}</span><span>${escapeHtml(order.tableName)}</span></div>
        <div class="r-row small"><span>${fmtDateTime(order.paidAt)}</span><span></span></div>
        <div class="r-hr"></div>
        <div class="bill-head"><span class="bi-name">Item</span><span class="bi-qty">Qty</span><span class="bi-amt">Amt</span></div>
        ${itemRows}
        <div class="r-hr"></div>
        <div class="r-row r-bold"><span>Total</span><span>${money(order.total)}</span></div>
        <div class="r-hr"></div>
        ${payBlock}
        <div class="r-hr"></div>
        <div class="r-center small">${escapeHtml(cfg.footerNote || "Thank you! Visit again")}</div>
      </div>`;
  }

  // Packaged into the Android app, `window.print()` has no effect: a plain Capacitor/Android
  // WebView does not implement the JS print API on its own (that's a Chrome/desktop-browser
  // feature) -- it needs an explicit native hookup to android.print.PrintManager. The KaapiPrint
  // plugin (added to the Android project) provides that hookup; on the web/PWA build, or if the
  // plugin isn't present for any reason, this falls back to the normal window.print() dialog.
  const RECEIPT_PRINT_CSS = `
    body{margin:0;}
    .receipt{font-family:'Courier New',Courier,monospace; font-size:11px; color:#000; width:100%; line-height:1.45;}
    .receipt .r-center{text-align:center;}
    .receipt .r-bold{font-weight:700;}
    .receipt .r-big{font-size:13.5px;}
    .receipt .r-row{display:flex; justify-content:space-between; gap:6px;}
    .receipt .small{font-size:10px;}
    .receipt .r-hr{border-top:1px dashed #000; margin:5px 0;}
    .receipt .kot-line{display:flex; gap:8px; font-size:12.5px; padding:2px 0;}
    .receipt .kot-line .q{font-weight:700; min-width:30px; flex-shrink:0;}
    .receipt .bill-head,.receipt .bill-item{display:flex; font-size:10.5px; padding:1px 0;}
    .receipt .bill-head{font-weight:700; border-bottom:1px solid #000; margin-bottom:3px;}
    .receipt .bi-name{flex:2; overflow-wrap:anywhere;}
    .receipt .bi-qty{flex:0.6; text-align:center;}
    .receipt .bi-amt{flex:1; text-align:right;}
    @page{ size:58mm auto; margin:2mm; }`;

  function nativePrintPlugin(){
    return (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
      && window.Capacitor.Plugins && window.Capacitor.Plugins.KaapiPrint) || null;
  }

  async function printHtmlContent(receiptHtml, jobName){
    const KaapiPrint = nativePrintPlugin();
    if(KaapiPrint){
      try{
        const fullHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${RECEIPT_PRINT_CSS}</style></head><body>${receiptHtml}</body></html>`;
        await KaapiPrint.printHtml({html: fullHtml, jobName});
      }catch(e){
        console.error("native print failed", e);
        showToast("Print failed — check printer connection");
      }
      return;
    }
    // Web/PWA build (or native plugin unavailable): standard browser print dialog.
    document.getElementById("printArea").innerHTML = receiptHtml;
    setTimeout(()=>window.print(), 50);
  }

  function printKOT(order){
    if(!order || order.items.length===0){ showToast("Cart is empty"); return; }
    printHtmlContent(buildKOTHtml(order), "KOT - " + order.tableName);
  }

  function printBill(order){
    printHtmlContent(buildBillHtml(order), "Bill - " + order.tableName);
  }

  /* ============ PAYMENT OVERLAY ============ */
  function openPayment(){
    const order = getOpenOrder(state.activeTableId);
    if(!order || order.items.length===0){ showToast("Cart is empty"); return; }
    state.sheet = null; renderSheet();
    state.paymentMethod = null;
    state.splitCash = ""; state.splitUpi = "";
    document.getElementById("paymentOverlay").classList.add("open");
    renderPayment();
    if(layerStack.length && layerStack[layerStack.length-1].type === "sheet"){
      replaceTopOverlay("payment", doClosePayment);
    } else {
      pushOverlay("payment", doClosePayment);
    }
  }
  function doClosePayment(){
    document.getElementById("paymentOverlay").classList.remove("open");
  }

  function renderPayment(){
    const order = getOpenOrder(state.activeTableId);
    if(!order){ closeTopOverlay(); return; }
    const total = orderTotal(order);
    document.getElementById("paymentSub").textContent = order.tableName;

    const methods = ["cash","upi","mixed"].map(m=>{
      const icon = m==="cash"?"💵":m==="upi"?"📱":"🔀";
      const label = m==="cash"?"Cash":m==="upi"?"UPI":"Split";
      return `<button class="pay-method ${state.paymentMethod===m?"active":""}" data-pay-method="${m}">
        <div class="picon">${icon}</div><div class="plabel">${label}</div>
      </button>`;
    }).join("");

    let splitHtml = "";
    let confirmDisabled = !state.paymentMethod;
    if(state.paymentMethod === "mixed"){
      const cashVal = parseFloat(state.splitCash)||0;
      const upiVal = parseFloat(state.splitUpi)||0;
      const remaining = +(total - cashVal - upiVal).toFixed(2);
      splitHtml = `
        <div class="split-inputs">
          <div class="split-field">
            <label>Cash amount</label>
            <input type="number" inputmode="decimal" id="splitCashInput" placeholder="0" value="${state.splitCash}">
          </div>
          <div class="split-field">
            <label>UPI amount</label>
            <input type="number" inputmode="decimal" id="splitUpiInput" placeholder="0" value="${state.splitUpi}">
          </div>
        </div>
        <div class="remaining-note ${remaining===0?"ok":"bad"}">
          ${remaining===0 ? "Amounts match the total ✓" : (remaining>0 ? `${money(remaining)} remaining` : `${money(Math.abs(remaining))} over the total`)}
        </div>`;
      confirmDisabled = remaining !== 0;
    }

    document.getElementById("paymentBody").innerHTML = `
      <div class="pay-total">
        <div class="label">Amount due</div>
        <div class="bigtotal">${money(total)}</div>
      </div>
      <div class="pay-methods">${methods}</div>
      ${splitHtml}
      <button class="btn btn-amber btn-block" id="confirmPaymentBtn" ${confirmDisabled?"disabled":""}>Confirm payment</button>
    `;
  }

  function confirmPayment(){
    const order = getOpenOrder(state.activeTableId);
    if(!order) return;
    const total = orderTotal(order);
    let payment;
    if(state.paymentMethod === "cash") payment = {method:"cash", cash:total, upi:0, total};
    else if(state.paymentMethod === "upi") payment = {method:"upi", cash:0, upi:total, total};
    else payment = {method:"mixed", cash:parseFloat(state.splitCash)||0, upi:parseFloat(state.splitUpi)||0, total};

    order.status = "paid";
    order.total = total;
    order.payment = payment;
    order.paidAt = Date.now();
    order.invoiceNo = state.config.nextInvoiceNo || 1;
    state.config.nextInvoiceNo = (state.config.nextInvoiceNo || 1) + 1;
    persistOrders();
    persistConfig();
    renderPaymentSuccess(order);
  }

  function renderPaymentSuccess(order){
    document.getElementById("paymentSub").textContent = order.tableName;
    document.getElementById("paymentBody").innerHTML = `
      <div style="text-align:center; padding:34px 10px 10px;">
        <div style="font-size:46px;">✅</div>
        <div style="font-weight:700; font-size:17px; margin-top:10px;">Payment recorded</div>
        <div style="color:var(--text-dim); margin-top:4px; font-size:14px;">${money(order.total)} · ${order.payment.method.toUpperCase()}</div>
      </div>
      <button class="btn btn-outline btn-block" id="printBillBtn" style="margin-bottom:10px;">🧾 Print bill</button>
      <button class="btn btn-amber btn-block" id="paymentDoneBtn">Done</button>`;
    state.completedOrder = order;
  }

  /* ============ MODAL (add/edit category/item/table) ============ */
  function openModal(type, data){
    state.modal = {type, data: data || {}};
    renderModal();
    pushOverlay("modal", doCloseModal);
  }
  function doCloseModal(){ state.modal = null; renderModal(); }

  function renderModal(){
    const root = document.getElementById("modalRoot");
    if(!state.modal){ root.innerHTML = ""; return; }
    const {type, data} = state.modal;
    let title, fields, showDelete=false;

    if(type === "category"){
      title = data.id ? "Edit category" : "Add category";
      fields = `<div class="field"><label>Category name</label><input type="text" id="mCatName" value="${escapeHtml(data.name||"")}" placeholder="e.g. Beverages"></div>`;
    } else if(type === "item"){
      title = data.id ? "Edit item" : "Add item";
      const opts = state.config.categories.map(c=>`<option value="${c.id}" ${data.categoryId===c.id?"selected":""}>${escapeHtml(c.name)}</option>`).join("");
      fields = `
        <div class="field"><label>Item name</label><input type="text" id="mItemName" value="${escapeHtml(data.name||"")}" placeholder="e.g. Cold Coffee"></div>
        <div class="field"><label>Price (₹)</label><input type="number" inputmode="decimal" id="mItemPrice" value="${data.price!==undefined?data.price:""}" placeholder="e.g. 60"></div>
        <div class="field"><label>Category</label><select id="mItemCat">${opts}</select></div>`;
    } else if(type === "table"){
      title = data.id ? "Edit table" : "Add table";
      fields = `<div class="field"><label>Table name</label><input type="text" id="mTableName" value="${escapeHtml(data.name||"")}" placeholder="e.g. Table 7"></div>`;
    } else if(type === "editBill"){
      title = "Edit saved bill";
      const newTotal = data.items.reduce((s,l)=>s+l.price*l.qty,0);
      const lines = data.items.length ? data.items.map(l=>`
        <div class="cart-line">
          <div style="flex:1;">
            <div class="clname">${escapeHtml(l.name)}</div>
            <div class="clprice">${money(l.price)} each</div>
          </div>
          <div class="cart-lineprice">${money(l.price*l.qty)}</div>
          <div class="stepper">
            <button type="button" data-ebill-dec="${l.itemId}">−</button>
            <span>${l.qty}</span>
            <button type="button" data-ebill-inc="${l.itemId}">+</button>
          </div>
        </div>`).join("") : `<div style="padding:14px 0; color:var(--text-dim); font-size:14px;">No items left — add one below.</div>`;
      const itemOpts = state.config.items.map(i=>`<option value="${i.id}">${escapeHtml(i.name)} — ${money(i.price)}</option>`).join("");
      fields = `
        <div class="field">
          <label>Items</label>
          <div id="ebillLines">${lines}</div>
        </div>
        <div class="field">
          <label>Add item</label>
          <div style="display:flex; gap:8px;">
            <select id="ebillAddSelect" style="flex:1;">${itemOpts}</select>
            <button type="button" class="btn btn-outline" id="ebillAddBtn">Add</button>
          </div>
        </div>
        <div class="r-row r-bold" style="margin-top:6px;"><span>New total</span><span id="ebillNewTotal">${money(newTotal)}</span></div>
        <div style="color:var(--text-dim); font-size:12px; margin-top:4px;">Payment amount will be updated to match the new total.</div>`;
    } else if(type === "changePayment"){
      title = "Change payment mode";
      const methods = ["cash","upi","mixed"].map(m=>{
        const icon = m==="cash"?"💵":m==="upi"?"📱":"🔀";
        const label = m==="cash"?"Cash":m==="upi"?"UPI":"Split";
        return `<button type="button" class="pay-method ${data.method===m?"active":""}" data-pay-method-modal="${m}">
          <div class="picon">${icon}</div><div class="plabel">${label}</div>
        </button>`;
      }).join("");
      let splitHtml = "";
      if(data.method === "mixed"){
        const cashVal = parseFloat(data.cash)||0;
        const upiVal = parseFloat(data.upi)||0;
        const remaining = +(data.total - cashVal - upiVal).toFixed(2);
        splitHtml = `
          <div class="split-inputs">
            <div class="split-field"><label>Cash amount</label><input type="number" inputmode="decimal" id="mSplitCash" value="${data.cash}"></div>
            <div class="split-field"><label>UPI amount</label><input type="number" inputmode="decimal" id="mSplitUpi" value="${data.upi}"></div>
          </div>
          <div class="remaining-note ${remaining===0?"ok":"bad"}">
            ${remaining===0 ? "Amounts match the total ✓" : (remaining>0 ? `${money(remaining)} remaining` : `${money(Math.abs(remaining))} over the total`)}
          </div>`;
      }
      fields = `
        <div class="field"><label>Amount due</label><div class="bigtotal" style="font-size:20px;">${money(data.total)}</div></div>
        <div class="pay-methods">${methods}</div>
        ${splitHtml}`;
    } else if(type === "confirmDeleteOrder"){
      title = "Delete this sale?";
      fields = `<div style="color:var(--text-dim); font-size:14px; line-height:1.5;">
        This will permanently remove the ${money(data.total)} sale for <strong>${escapeHtml(data.tableName)}</strong> from your reports. This can't be undone.
      </div>`;
      showDelete = true;
    }

    root.innerHTML = `
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal">
          <h3>${title}</h3>
          ${fields}
          <div class="modal-actions">
            <button class="btn btn-outline" id="modalCancel">Cancel</button>
            <button class="btn ${showDelete?"btn-danger":"btn-amber"}" id="modalSave">${showDelete?"Delete":"Save"}</button>
          </div>
        </div>
      </div>`;
    setTimeout(()=>{
      const firstInput = root.querySelector("input");
      if(firstInput) firstInput.focus();
    }, 50);
  }

  function saveModal(){
    const {type, data} = state.modal;
    if(type === "category"){
      const name = document.getElementById("mCatName").value.trim();
      if(!name){ showToast("Enter a category name"); return; }
      if(data.id){
        const c = state.config.categories.find(c=>c.id===data.id);
        c.name = name;
      } else {
        state.config.categories.push({id:uid(), name});
      }
    } else if(type === "item"){
      const name = document.getElementById("mItemName").value.trim();
      const price = parseFloat(document.getElementById("mItemPrice").value);
      const categoryId = document.getElementById("mItemCat").value;
      if(!name){ showToast("Enter an item name"); return; }
      if(isNaN(price) || price < 0){ showToast("Enter a valid price"); return; }
      if(data.id){
        const it = state.config.items.find(i=>i.id===data.id);
        it.name = name; it.price = price; it.categoryId = categoryId;
      } else {
        state.config.items.push({id:uid(), name, price, categoryId});
      }
    } else if(type === "table"){
      const name = document.getElementById("mTableName").value.trim();
      if(!name){ showToast("Enter a table name"); return; }
      if(data.id){
        const t = state.config.tables.find(t=>t.id===data.id);
        t.name = name;
      } else {
        state.config.tables.push({id:uid(), name});
      }
    } else if(type === "editBill"){
      if(data.items.length === 0){ showToast("Bill must have at least one item"); return; }
      const order = state.orders.find(o=>o.id===data.orderId);
      if(!order){ showToast("Couldn't find that bill"); closeTopOverlay(); return; }
      const newTotal = data.items.reduce((s,l)=>s+l.price*l.qty,0);
      order.items = data.items.map(l=>({...l}));
      order.total = newTotal;
      if(order.payment){
        if(order.payment.method === "cash"){ order.payment.cash = newTotal; order.payment.total = newTotal; }
        else if(order.payment.method === "upi"){ order.payment.upi = newTotal; order.payment.total = newTotal; }
        else {
          // Mixed/split payment: previously this only updated payment.total, leaving the
          // cash/upi split at its pre-edit amounts -- so editing a split-paid bill made
          // cash+upi silently stop matching the new total (wrong cash-drawer reconciliation
          // in Reports and on any reprinted bill). Rescale cash/upi to keep the original
          // split ratio while guaranteeing cash+upi === newTotal exactly.
          const oldTotal = order.payment.total || (order.payment.cash + order.payment.upi) || 0;
          const cashShare = oldTotal > 0 ? order.payment.cash / oldTotal : 0.5;
          const newCash = Math.round(newTotal * cashShare * 100) / 100;
          order.payment.cash = newCash;
          order.payment.upi = +(newTotal - newCash).toFixed(2);
          order.payment.total = newTotal;
        }
      }
      order.editedAt = Date.now();
      persistOrders();
      render();
      closeTopOverlay();
      showToast("Bill updated");
      return;
    } else if(type === "changePayment"){
      const order = state.orders.find(o=>o.id===data.orderId);
      if(!order){ showToast("Couldn't find that bill"); closeTopOverlay(); return; }
      if(!data.method){ showToast("Choose a payment mode"); return; }
      let payment;
      if(data.method === "cash") payment = {method:"cash", cash:order.total, upi:0, total:order.total};
      else if(data.method === "upi") payment = {method:"upi", cash:0, upi:order.total, total:order.total};
      else {
        const cashVal = parseFloat(data.cash)||0;
        const upiVal = parseFloat(data.upi)||0;
        const remaining = +(order.total - cashVal - upiVal).toFixed(2);
        if(remaining !== 0){ showToast("Cash + UPI must equal the total"); return; }
        payment = {method:"mixed", cash:cashVal, upi:upiVal, total:order.total};
      }
      order.payment = payment;
      order.editedAt = Date.now();
      persistOrders();
      render();
      closeTopOverlay();
      showToast("Payment mode updated");
      return;
    } else if(type === "confirmDeleteOrder"){
      state.orders = state.orders.filter(o=>o.id!==data.orderId);
      if(state.expandedOrderId === data.orderId) state.expandedOrderId = null;
      persistOrders();
      render();
      closeTopOverlay();
      showToast("Sale deleted");
      return;
    }
    persistConfig();
    render();
    closeTopOverlay();
  }

  function deleteCategory(id){
    if(itemsInCategory(id).length > 0){
      showToast("Move or delete its items first");
      return;
    }
    state.config.categories = state.config.categories.filter(c=>c.id!==id);
    persistConfig(); render();
  }
  function deleteItem(id){
    state.config.items = state.config.items.filter(i=>i.id!==id);
    persistConfig(); render();
  }
  function deleteTable(id){
    if(getOpenOrder(id)){ showToast("Table has an open order"); return; }
    state.config.tables = state.config.tables.filter(t=>t.id!==id);
    persistConfig(); render();
  }

  /* ============ Event binding ============ */
  function bindStaticEvents(){
    document.querySelectorAll(".navbtn").forEach(b=>{
      b.addEventListener("click", ()=>{ state.tab = b.dataset.tab; render(); });
    });
    document.getElementById("headerMenuBtn").addEventListener("click", ()=>{ state.tab = "menu"; render(); });

    document.getElementById("view").addEventListener("click", onViewClick);

    document.getElementById("billingBack").addEventListener("click", closeTopOverlay);
    document.getElementById("billingBody").addEventListener("click", onBillingClick);
    document.getElementById("billingCartIcon").addEventListener("click", openCartSheet);
    document.getElementById("billingKotBtn").addEventListener("click", ()=>{ printKOT(getOpenOrder(state.activeTableId)); });
    document.getElementById("billingOverlay").addEventListener("click", (e)=>{
      if(e.target && e.target.id === "viewCartBtn"){ openCartSheet(); }
    });

    document.getElementById("paymentBack").addEventListener("click", closeTopOverlay);
    document.getElementById("paymentBody").addEventListener("click", onPaymentClick);
    document.getElementById("paymentBody").addEventListener("input", onPaymentInput);

    document.getElementById("sheetRoot").addEventListener("click", onSheetClick);
    document.getElementById("modalRoot").addEventListener("click", onModalClick);
    document.getElementById("modalRoot").addEventListener("input", onModalInput);
  }

  function onModalInput(e){
    if(!state.modal || state.modal.type !== "changePayment") return;
    const data = state.modal.data;
    if(e.target.id === "mSplitCash"){ data.cash = e.target.value; renderModalKeepFocus("mSplitCash"); }
    if(e.target.id === "mSplitUpi"){ data.upi = e.target.value; renderModalKeepFocus("mSplitUpi"); }
  }
  function renderModalKeepFocus(id){
    renderModal();
    const el = document.getElementById(id);
    if(el){ el.focus(); const v = el.value; el.value=""; el.value=v; }
  }

  function onViewClick(e){
    const printOrderBtnEarly = e.target.closest("[data-print-order]");
    if(printOrderBtnEarly){
      const ord = state.orders.find(o=>o.id===printOrderBtnEarly.dataset.printOrder);
      if(ord) printBill(ord);
      return;
    }

    const editBillBtnEarly = e.target.closest("[data-edit-bill-order]");
    if(editBillBtnEarly){
      const ord = state.orders.find(o=>o.id===editBillBtnEarly.dataset.editBillOrder);
      if(ord) openModal("editBill", {orderId: ord.id, items: ord.items.map(l=>({...l}))});
      return;
    }

    const changePaymentBtnEarly = e.target.closest("[data-change-payment-order]");
    if(changePaymentBtnEarly){
      const ord = state.orders.find(o=>o.id===changePaymentBtnEarly.dataset.changePaymentOrder);
      if(ord) openModal("changePayment", {orderId: ord.id, method: ord.payment.method, cash: ord.payment.cash||0, upi: ord.payment.upi||0, total: ord.total});
      return;
    }

    const deleteOrderBtnEarly = e.target.closest("[data-delete-order]");
    if(deleteOrderBtnEarly){
      const ord = state.orders.find(o=>o.id===deleteOrderBtnEarly.dataset.deleteOrder);
      if(ord) openModal("confirmDeleteOrder", {orderId: ord.id, tableName: ord.tableName, total: ord.total});
      return;
    }

    const openTable = e.target.closest("[data-open-table]");
    if(openTable){ openBilling(openTable.dataset.openTable); return; }

    const menuSub = e.target.closest("[data-menusub]");
    if(menuSub){ state.menuSub = menuSub.dataset.menusub; render(); return; }

    const rangeBtn = e.target.closest("[data-report-range]");
    if(rangeBtn){ state.reportRange = rangeBtn.dataset.reportRange; render(); return; }

    const toggleOrder = e.target.closest("[data-toggle-order]");
    if(toggleOrder){
      const id = toggleOrder.dataset.toggleOrder;
      state.expandedOrderId = state.expandedOrderId === id ? null : id;
      render(); return;
    }

    if(e.target.closest("[data-add-category]")) return openModal("category", {});
    const editCat = e.target.closest("[data-edit-category]");
    if(editCat) return openModal("category", state.config.categories.find(c=>c.id===editCat.dataset.editCategory));
    const delCat = e.target.closest("[data-delete-category]");
    if(delCat) return deleteCategory(delCat.dataset.deleteCategory);

    if(e.target.closest("[data-add-item]")) return openModal("item", {categoryId: state.config.categories[0] ? state.config.categories[0].id : ""});
    const editItem = e.target.closest("[data-edit-item]");
    if(editItem) return openModal("item", state.config.items.find(i=>i.id===editItem.dataset.editItem));
    const delItem = e.target.closest("[data-delete-item]");
    if(delItem) return deleteItem(delItem.dataset.deleteItem);

    if(e.target.closest("[data-add-table]")) return openModal("table", {});
    const editTable = e.target.closest("[data-edit-table]");
    if(editTable) return openModal("table", state.config.tables.find(t=>t.id===editTable.dataset.editTable));
    const delTable = e.target.closest("[data-delete-table]");
    if(delTable && !delTable.disabled) return deleteTable(delTable.dataset.deleteTable);

    const dateInput = e.target.id === "reportDateInput" ? e.target : null;
    if(dateInput){ /* handled by change listener below */ }

    if(e.target.closest("[data-save-settings]")){
      state.config.settings = {
        cafeName: document.getElementById("sCafeName").value.trim() || "Kaapi Cafe",
        address: document.getElementById("sAddress").value.trim(),
        phone: document.getElementById("sPhone").value.trim(),
        footerNote: document.getElementById("sFooter").value.trim() || "Thank you! Visit again"
      };
      persistConfig();
      showToast("Details saved");
      return;
    }
  }

  document.addEventListener("change", (e)=>{
    if(e.target && e.target.id === "reportDateInput"){
      state.reportAnchor = e.target.value;
      render();
    }
  });

  function onBillingClick(e){
    const filter = e.target.closest("[data-billing-filter]");
    if(filter){ state.billingCategoryFilter = filter.dataset.billingFilter; renderBilling(); return; }
    const addCart = e.target.closest("[data-add-cart]");
    if(addCart){ addToCart(addCart.dataset.addCart); return; }
  }

  function onSheetClick(e){
    if(e.target.id === "sheetBackdrop" || e.target.id === "closeSheet"){
      closeTopOverlay(); return;
    }
    const inc = e.target.closest("[data-cart-inc]");
    if(inc){ changeCartQty(inc.dataset.cartInc, 1); return; }
    const dec = e.target.closest("[data-cart-dec]");
    if(dec){ changeCartQty(dec.dataset.cartDec, -1); return; }
    if(e.target.id === "holdOrderBtn"){ showToast("Order held"); closeOverlaysCount(layerStack.length); return; }
    if(e.target.id === "checkoutBtn"){ openPayment(); return; }
  }

  function onPaymentClick(e){
    const m = e.target.closest("[data-pay-method]");
    if(m){ state.paymentMethod = m.dataset.payMethod; renderPayment(); return; }
    if(e.target.id === "confirmPaymentBtn" && !e.target.disabled){ confirmPayment(); return; }
    if(e.target.id === "printBillBtn"){ printBill(state.completedOrder); return; }
    if(e.target.id === "paymentDoneBtn"){ showToast("Table freed"); closeOverlaysCount(layerStack.length); return; }
  }
  function onPaymentInput(e){
    if(e.target.id === "splitCashInput"){ state.splitCash = e.target.value; renderPaymentKeepFocus("splitCashInput"); }
    if(e.target.id === "splitUpiInput"){ state.splitUpi = e.target.value; renderPaymentKeepFocus("splitUpiInput"); }
  }
  function renderPaymentKeepFocus(id){
    renderPayment();
    const el = document.getElementById(id);
    if(el){ el.focus(); const v = el.value; el.value=""; el.value=v; }
  }

  function onModalClick(e){
    if(e.target.id === "modalBackdrop" || e.target.id === "modalCancel"){ closeTopOverlay(); return; }
    if(e.target.id === "modalSave"){ saveModal(); return; }

    if(state.modal && state.modal.type === "changePayment"){
      const m = e.target.closest("[data-pay-method-modal]");
      if(m){
        const data = state.modal.data;
        data.method = m.dataset.payMethodModal;
        if(data.method === "cash"){ data.cash = data.total; data.upi = 0; }
        else if(data.method === "upi"){ data.upi = data.total; data.cash = 0; }
        else if(data.method === "mixed" && !parseFloat(data.cash) && !parseFloat(data.upi)){ data.cash = data.total; data.upi = 0; }
        renderModal();
        return;
      }
    }

    if(state.modal && state.modal.type === "editBill"){
      const inc = e.target.closest("[data-ebill-inc]");
      if(inc){
        const itemId = inc.dataset.ebillInc;
        const line = state.modal.data.items.find(l=>l.itemId===itemId);
        if(line) line.qty += 1;
        renderModal();
        return;
      }
      const dec = e.target.closest("[data-ebill-dec]");
      if(dec){
        const itemId = dec.dataset.ebillDec;
        const line = state.modal.data.items.find(l=>l.itemId===itemId);
        if(line){
          line.qty -= 1;
          if(line.qty <= 0) state.modal.data.items = state.modal.data.items.filter(l=>l.itemId!==itemId);
        }
        renderModal();
        return;
      }
      if(e.target.id === "ebillAddBtn"){
        const select = document.getElementById("ebillAddSelect");
        const itemId = select.value;
        const item = state.config.items.find(i=>i.id===itemId);
        if(!item) return;
        const line = state.modal.data.items.find(l=>l.itemId===itemId);
        if(line) line.qty += 1;
        else state.modal.data.items.push({itemId:item.id, name:item.name, price:item.price, qty:1});
        renderModal();
        return;
      }
    }
  }

  init();

  if("serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }

  // ---- Auto PWA install prompt (mobile only) ----
  (function(){
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(!isMobile) return;

    const isStandalone = window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone === true;
    if(isStandalone) return;

    const DISMISS_KEY = "kaapiInstallPromptDismissedAt";
    const lastDismiss = Number(localStorage.getItem(DISMISS_KEY) || 0);
    const daysSinceDismiss = (Date.now() - lastDismiss) / 86400000;
    if(lastDismiss && daysSinceDismiss < 7) return;

    let deferredPrompt = null;
    const isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);

    function showBanner({onInstall, iosHint}){
      const banner = document.createElement("div");
      banner.id = "pwaInstallBanner";
      banner.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;"
        + "background:#171110;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:14px;"
        + "padding:12px 14px;display:flex;align-items:center;gap:10px;"
        + "box-shadow:0 8px 24px rgba(0,0,0,.35);font-family:inherit;font-size:14px;";

      const icon = document.createElement("img");
      icon.src = "icon-192.png";
      icon.alt = "";
      icon.style.cssText = "width:36px;height:36px;border-radius:8px;flex-shrink:0;";

      const text = document.createElement("div");
      text.style.cssText = "flex:1;line-height:1.3;";
      text.innerHTML = iosHint
        ? "Install Froolla: tap <strong>Share</strong> then <strong>Add to Home Screen</strong>."
        : "Install Froolla for quick, full-screen access.";

      const closeBtn = document.createElement("button");
      closeBtn.textContent = "✕";
      closeBtn.style.cssText = "background:none;border:none;color:#fff;opacity:.7;font-size:16px;"
        + "padding:4px 6px;cursor:pointer;flex-shrink:0;";
      closeBtn.onclick = () => {
        localStorage.setItem(DISMISS_KEY, String(Date.now()));
        banner.remove();
      };

      banner.appendChild(icon);
      banner.appendChild(text);

      if(!iosHint){
        const installBtn = document.createElement("button");
        installBtn.textContent = "Install";
        installBtn.style.cssText = "background:#fff;color:#171110;border:none;border-radius:10px;"
          + "padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;flex-shrink:0;";
        installBtn.onclick = async () => {
          banner.remove();
          if(!onInstall) return;
          await onInstall();
        };
        banner.appendChild(installBtn);
      }

      banner.appendChild(closeBtn);
      document.body.appendChild(banner);
    }

    if(isIOS){
      // iOS has no install API — show an instructional banner shortly after load.
      window.addEventListener("load", () => {
        setTimeout(() => showBanner({ iosHint: true }), 1500);
      });
      return;
    }

    // Android/Chrome: capture the native prompt and trigger it automatically.
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(async () => {
        if(!deferredPrompt) return;
        try{
          await deferredPrompt.prompt();
          const choice = await deferredPrompt.userChoice;
          if(choice.outcome !== "accepted"){
            localStorage.setItem(DISMISS_KEY, String(Date.now()));
          }
        }catch(err){
          // Auto-prompt blocked by browser (no gesture) — fall back to a tappable banner.
          showBanner({ onInstall: async () => {
            if(!deferredPrompt) return;
            await deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
          }});
        }
        deferredPrompt = null;
      }, 1500);
    });

    window.addEventListener("appinstalled", () => {
      localStorage.removeItem(DISMISS_KEY);
    });
  })();
})();
</script>
</body>
</html>
