<style>
  :root{
    --bg:#171110;
    --surface:#241a17;
    --surface-2:#2c211d;
    --border:#3c2d27;
    --text:#f3e9e0;
    --text-dim:#b2a196;
    --text-faint:#7d6f66;
    --amber:#e8a33d;
    --amber-dark:#c9852a;
    --amber-ink:#241a08;
    --teal:#5fa08c;
    --teal-dark:#3f7364;
    --rust:#c4573b;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  h1,h2,h3,.display,.money,.tabbtn,.navlabel,.bigtotal{
    font-family:'Space Grotesk',-apple-system,sans-serif;
  }
  button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit; cursor:pointer;}
  input,select{font-family:inherit; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; font-size:16px; width:100%;}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--amber); outline-offset:1px;}
  ::selection{background:var(--amber); color:var(--amber-ink);}

  #app{position:fixed; inset:0; display:flex; flex-direction:column; height:100%;}

  /* ---------- Topbar ---------- */
  .topbar{
    padding:calc(14px + var(--safe-top)) 18px 14px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg,var(--surface),var(--bg));
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .brand h1{font-size:18px; margin:0; font-weight:700; letter-spacing:0.2px;}
  .brand .sub{font-size:11px; color:var(--text-faint); margin-top:1px;}
  .topbar .tabname{font-size:13px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.08em;}
  .header-menu-btn{width:26px; height:26px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); font-size:13px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0;}
  .header-menu-btn:active{transform:scale(0.92);}
  .sync-status{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-dim); flex-shrink:0;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:#999; flex-shrink:0; transition:background .2s ease;}
  .sync-dot.sync-synced, .sync-dot.sync-idle{background:#2ecc71;}
  .sync-dot.sync-syncing{background:#f5a623; animation:syncPulse 1s ease-in-out infinite;}
  .sync-dot.sync-error, .sync-dot.sync-offline{background:#e74c3c;}
  .sync-dot.sync-unconfigured{background:#999;}
  @keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .sync-label{white-space:nowrap; max-width:74px; overflow:hidden; text-overflow:ellipsis;}
  .sync-btn{width:22px; height:22px; border-radius:7px; background:var(--surface-2); border:1px solid var(--border); font-size:11px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0;}
  .sync-btn:active{transform:scale(0.9);}
  .sync-btn:disabled{opacity:.5;}
  .sync-btn.spinning{animation:syncSpin .8s linear infinite;}
  @keyframes syncSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  /* ---------- Main view ---------- */
  #view{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px calc(96px + var(--safe-bottom));}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; background:var(--surface); border-top:1px solid var(--border);
    padding:8px 8px calc(8px + var(--safe-bottom));
    z-index:40;
  }
  .navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; border-radius:12px; color:var(--text-faint); transition:color .15s;}
  .navbtn.active{color:var(--amber);}
  .navbtn .icon{font-size:20px; line-height:1;}
  .navlabel{font-size:11px; font-weight:600;}

  /* ---------- Section headers ---------- */
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .section-head h2{font-size:20px; margin:0; font-weight:700;}
  .btn{padding:11px 16px; border-radius:var(--radius-sm); font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px;}
  .btn-amber{background:var(--amber); color:var(--amber-ink);}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn-ghost{color:var(--text-dim);}
  .btn-danger{background:rgba(196,87,59,0.15); color:#e79080;}
  .btn:active{transform:scale(0.97);}
  .btn-block{width:100%; justify-content:center; padding:15px;}
  .btn[disabled]{opacity:0.4; pointer-events:none;}

  /* ---------- Tables grid ---------- */
  .tables-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .table-card{
    position:relative; border-radius:var(--radius-lg); padding:16px 14px; min-height:112px;
    display:flex; flex-direction:column; justify-content:space-between;
    border:1.5px solid var(--teal-dark); background:var(--surface);
    text-align:left;
  }
  .table-card:active{transform:scale(0.97);}
  .table-card.occupied{border-color:var(--amber); background:linear-gradient(155deg,rgba(232,163,61,0.16),var(--surface));}
  .table-card .tname{font-size:17px; font-weight:700;}
  .table-card .tstatus{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--teal);}
  .table-card.occupied .tstatus{color:var(--amber);}
  .table-card .tmeta{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .table-card .telapsed{font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .table-card .ttotal{font-size:15px; font-weight:700; color:var(--amber);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--teal); display:inline-block;}
  .table-card.occupied .dot{background:var(--amber);}

  .empty-state{padding:40px 20px; text-align:center; color:var(--text-faint); border:1.5px dashed var(--border); border-radius:var(--radius-lg);}
  .empty-state .big{font-size:32px; margin-bottom:8px;}
  .empty-state p{margin:6px 0 16px; font-size:14px; line-height:1.5;}

  /* ---------- Segmented control ---------- */
  .segmented{display:flex; background:var(--surface-2); border-radius:12px; padding:4px; margin-bottom:16px; gap:4px;}
  .segmented button{flex:1; padding:9px 4px; border-radius:9px; font-size:13px; font-weight:600; color:var(--text-dim); text-align:center;}
  .segmented button.active{background:var(--amber); color:var(--amber-ink);}

  /* ---------- Lists (categories/items/tables mgmt) ---------- */
  .list-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 14px; margin-bottom:10px;}
  .list-row .rowmain{min-width:0; flex:1;}
  .list-row .rtitle{font-weight:600; font-size:15px;}
  .list-row .rsub{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .list-row .ractions{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); font-size:15px;}
  .icon-btn:active{transform:scale(0.92);}
  .cat-chip-header{font-size:12px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-faint); margin:18px 0 8px; font-weight:700;}
  .cat-chip-header:first-child{margin-top:0;}

  .fab-row{margin-top:18px;}

  /* ---------- Reports ---------- */
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px;}
  .stat-card .slabel{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); font-weight:700;}
  .stat-card .sval{font-size:22px; font-weight:700; margin-top:4px;}
  .stat-card.accent .sval{color:var(--amber);}
  .range-row{display:flex; gap:8px; margin-bottom:14px; align-items:center;}
  .range-row input[type=date]{flex:1;}
  .order-row{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 14px; margin-bottom:9px;}
  .order-row .otop{display:flex; justify-content:space-between; align-items:center;}
  .order-row .oleft{font-weight:600; font-size:14.5px;}
  .order-row .otime{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .badge{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:0.04em;}
  .badge-cash{background:rgba(95,160,140,0.18); color:var(--teal);}
  .badge-upi{background:rgba(232,163,61,0.18); color:var(--amber);}
  .badge-mixed{background:rgba(196,87,59,0.18); color:#e79080;}
  .order-detail{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:13px; color:var(--text-dim);}
  .order-detail .dline{display:flex; justify-content:space-between; padding:3px 0;}

  /* ---------- Overlays (billing/payment) ---------- */
  .overlay{position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column; transform:translateY(100%); transition:transform .22s ease;}
  .overlay.open{transform:translateY(0);}
  @media (prefers-reduced-motion:reduce){.overlay{transition:none;}}
  .ov-header{padding:calc(14px + var(--safe-top)) 16px 12px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0;}
  .ov-header .back{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .ov-header .titles{flex:1; min-width:0;}
  .ov-header h3{margin:0; font-size:16px; font-weight:700;}
  .ov-header .ovsub{font-size:12px; color:var(--text-faint); font-variant-numeric:tabular-nums; margin-top:1px;}
  .ov-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 12px;}

  /* category chips in billing */
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:4px; -webkit-overflow-scrolling:touch;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0; padding:9px 16px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border); font-size:13.5px; font-weight:600; color:var(--text-dim); white-space:nowrap;}
  .chip.active{background:var(--amber); color:var(--amber-ink); border-color:var(--amber);}

  /* category chips as a left-hand navbar next to the item grid (mobile + desktop) */
  #billingBody{ display:flex; align-items:flex-start; gap:12px; }
  .chip-row{
    flex-direction:column; align-items:stretch; overflow:visible;
    width:104px; flex-shrink:0; margin-bottom:0; padding-bottom:0;
    max-height:calc(100vh - 220px); overflow-y:auto;
    position:sticky; top:0; gap:6px;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    width:100%; text-align:left; white-space:normal;
    border-radius:var(--radius-sm); padding:10px 10px; font-size:12.5px;
  }
  #billingBody .item-grid,
  #billingBody > div.empty-state{ flex:1; min-width:0; }
  #billingBody .item-grid{ grid-template-columns:1fr; }

  .item-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .item-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px; text-align:left; position:relative; min-height:78px; display:flex; flex-direction:column; justify-content:space-between;}
  .item-card:active{transform:scale(0.96); border-color:var(--amber);}
  .item-card .iname{font-size:14px; font-weight:600; line-height:1.25;}
  .item-card .iprice{font-size:13.5px; color:var(--amber); font-weight:700; margin-top:6px;}
  .item-card .qtybadge{position:absolute; top:-7px; right:-7px; background:var(--amber); color:var(--amber-ink); font-size:12px; font-weight:800; min-width:22px; height:22px; border-radius:11px; display:flex; align-items:center; justify-content:center; padding:0 5px;}

  /* cart bar + sheet */
  .cartbar{position:fixed; left:0; right:0; bottom:0; background:var(--amber); color:var(--amber-ink); padding:14px 16px calc(14px + var(--safe-bottom)); display:flex; align-items:center; justify-content:space-between; z-index:110;}
  .cartbar .cinfo{font-size:13px; font-weight:700;}
  .cartbar .ctotal{font-size:17px; font-weight:800;}
  .cartbar .cta{background:var(--amber-ink); color:var(--amber); padding:11px 18px; border-radius:11px; font-weight:700; font-size:14px;}

  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:120; display:flex; align-items:flex-end;}
  .sheet{background:var(--surface); width:100%; border-radius:20px 20px 0 0; max-height:78vh; display:flex; flex-direction:column; padding-bottom:calc(10px + var(--safe-bottom));}
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:10px auto 4px;}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; padding:8px 18px 10px;}
  .sheet-head h3{margin:0; font-size:16px;}
  .sheet-body{overflow-y:auto; padding:0 16px;}
  .cart-line{display:flex; align-items:center; gap:10px; padding:11px 0; border-bottom:1px solid var(--border);}
  .cart-line .clname{flex:1; font-size:14px; font-weight:600;}
  .cart-line .clprice{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .stepper{display:flex; align-items:center; gap:0; background:var(--surface-2); border-radius:10px; overflow:hidden;}
  .stepper button{width:32px; height:32px; font-size:17px; font-weight:700; color:var(--amber);}
  .stepper span{min-width:24px; text-align:center; font-weight:700; font-size:14px;}
  .cart-lineprice{font-weight:700; font-size:14px; min-width:56px; text-align:right;}
  .sheet-footer{padding:12px 16px 4px; border-top:1px solid var(--border); display:flex; gap:10px;}
  .subtotal-row{display:flex; justify-content:space-between; padding:12px 16px 0; font-size:14px; color:var(--text-dim);}
  .subtotal-row .val{color:var(--text); font-weight:700;}

  /* payment screen */
  .pay-total{text-align:center; padding:28px 0 20px;}
  .pay-total .label{font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em; font-weight:700;}
  .pay-total .bigtotal{font-size:40px; font-weight:800; color:var(--amber); margin-top:6px;}
  .r-row{display:flex; justify-content:space-between; gap:6px;}
  .r-bold{font-weight:700;}
  .pay-total .r-row{font-size:14px; color:var(--text-dim); padding:4px 0;}
  .pay-total .r-row.r-bold{font-size:17px; color:var(--text); border-top:1px dashed var(--border); margin-top:6px; padding-top:10px;}
  .pay-methods{display:flex; gap:10px; margin-bottom:20px;}
  .pay-method{flex:1; padding:16px 8px; border-radius:var(--radius-md); border:1.5px solid var(--border); text-align:center; background:var(--surface);}
  .pay-method .picon{font-size:22px; margin-bottom:6px;}
  .pay-method .plabel{font-size:13px; font-weight:700;}
  .pay-method.active{border-color:var(--amber); background:rgba(232,163,61,0.1);}
  .split-inputs{display:flex; flex-direction:column; gap:12px; margin-bottom:16px;}
  .split-field label{font-size:12px; color:var(--text-dim); font-weight:600; margin-bottom:6px; display:block;}
  .remaining-note{text-align:center; font-size:13px; padding:10px; border-radius:10px; margin-bottom:14px; font-weight:600;}
  .remaining-note.ok{background:rgba(95,160,140,0.15); color:var(--teal);}
  .remaining-note.bad{background:rgba(196,87,59,0.15); color:#e79080;}

  /* generic modal for add/edit */
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:var(--surface); border-radius:var(--radius-lg); padding:20px; width:100%; max-width:400px; border:1px solid var(--border);}
  .modal h3{margin:0 0 16px; font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text-dim); font-weight:600; margin-bottom:6px;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-actions .btn{flex:1;}

  .toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; z-index:300; box-shadow:0 6px 20px rgba(0,0,0,0.4);}

  .loading-screen{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; z-index:500;}
  .loading-screen .mark{width:48px;height:48px;border-radius:14px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:24px;}

  /* ---------- Settings tab ---------- */
  .settings-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:14px;}
  .hint-text{font-size:12px; color:var(--text-faint); line-height:1.5; padding:0 2px 14px;}
  .print-btn-row{display:flex; gap:8px;}

  /* ---------- Print receipt (screen styles, hidden until print) ---------- */
  #printArea{display:none;}
  .receipt{font-family:'Courier New',Courier,monospace; font-size:13px; color:#000; width:100%; line-height:1.45;}
  .receipt .r-center{text-align:center;}
  .receipt .r-bold{font-weight:700;}
  .receipt .r-big{font-size:16px;}
  .receipt .r-row{display:flex; justify-content:space-between; gap:6px;}
  .receipt .small{font-size:11.5px;}
  .receipt .r-hr{border-top:1px dashed #000; margin:5px 0;}
  .receipt .kot-line{display:flex; gap:8px; font-size:15px; padding:2px 0;}
  .receipt .kot-line .q{font-weight:700; min-width:30px; flex-shrink:0;}
  .receipt .bill-head,.receipt .bill-item{display:flex; font-size:12.5px; padding:1px 0;}
  .receipt .bill-head{font-weight:700; border-bottom:1px solid #000; margin-bottom:3px;}
  .receipt .bi-name{flex:2; overflow-wrap:anywhere;}
  .receipt .bi-qty{flex:0.6; text-align:center;}
  .receipt .bi-amt{flex:1; text-align:right;}

  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block !important; position:absolute; left:0; top:0; width:100%; padding:0 2mm; }
    @page{ size:58mm auto; margin:2mm; }
  }

  /* =========================================================================
     DESKTOP / PC LAYOUT — fast-billing mode for mouse + keyboard + big screens
     CSS-only reflow. No markup, ids, classes or JS behaviour were changed —
     everything below just repositions/resizes the exact same elements.
     ========================================================================= */
  @media (min-width:900px){
    :root{ --topbar-h:66px; }

    /* ---- app shell: top header + left rail nav instead of bottom nav ---- */
    .topbar{ min-height:var(--topbar-h); padding:14px 28px; }
    .bottomnav{
      position:fixed; left:0; right:auto; top:var(--topbar-h); bottom:0;
      width:100px; flex-direction:column; justify-content:flex-start;
      gap:10px; padding:20px 10px; border-top:none; border-right:1px solid var(--border);
      z-index:40;
    }
    .navbtn{ flex:none; width:100%; padding:14px 6px; border-radius:12px; }
    .navbtn:hover{ background:var(--surface-2); color:var(--text); }
    .navbtn .icon{ font-size:22px; }

    #view{ margin-left:100px; padding:26px 34px calc(34px + var(--safe-bottom)); max-width:1600px; }

    /* ---- denser grids so more of the menu/tables/stats are visible at once ---- */
    .tables-grid{ grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
    .item-grid{ grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px; }
    .stat-grid{ grid-template-columns:repeat(4,1fr); }
    .table-card{ cursor:pointer; transition:transform .12s,box-shadow .12s,border-color .12s; }
    .item-card{ cursor:pointer; transition:border-color .12s,transform .08s; }
    .list-row{ transition:border-color .12s; }

    /* ---- billing / payment overlays behave like a proper POS screen ---- */
    .ov-header{ padding:16px 28px; }
    .ov-body{ padding:20px 28px 24px; }
    #billingOverlay .ov-body{ padding-right:372px; } /* reserve space for the docked cart */
    #paymentOverlay .ov-body{ max-width:560px; margin:0 auto; width:100%; }

    /* cart summary bar becomes a permanently-docked right-hand panel for one-click checkout */
    .cartbar{
      left:auto; right:0; top:var(--topbar-h); bottom:0; width:340px;
      flex-direction:column; align-items:stretch; justify-content:flex-end;
      gap:14px; padding:22px; border-left:2px solid var(--amber-dark);
    }
    .cartbar .cinfo{ font-size:14px; }
    .cartbar .ctotal{ font-size:26px; }
    .cartbar .cta{ width:100%; text-align:center; padding:15px; font-size:15px; }

    /* cart sheet opens as a full-height side panel next to the item grid, not a bottom sheet */
    .sheet-backdrop{ align-items:stretch; justify-content:flex-end; background:rgba(0,0,0,0.35); }
    .sheet{ width:400px; max-width:92vw; height:100%; border-radius:0; max-height:100%; border-left:1px solid var(--border); }

    /* wider item grid inside the billing sidebar layout on desktop */
    #billingBody{ gap:22px; }
    .chip-row{ width:172px; padding:0; }
    .chip{ padding:11px 14px; font-size:13.5px; }
    #billingBody .item-grid{ grid-template-columns:repeat(auto-fill,minmax(168px,1fr)); gap:12px; }

    /* modals sit centered as proper dialogs */
    .modal{ max-width:440px; }

    /* pointer affordances — only for devices that actually have a mouse */
    @media (hover:hover){
      .btn:hover{ filter:brightness(1.08); }
      .table-card:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.35); }
      .item-card:hover{ border-color:var(--amber); transform:translateY(-1px); }
      .list-row:hover{ border-color:var(--amber-dark); }
      .chip:hover:not(.active){ color:var(--text); }
      .icon-btn:hover{ background:var(--border); }
    }
  }

<script>
(function(){
  "use strict";

  /* ============ Storage helpers ============================================================
     Cloud database: Supabase (Postgres). Fill in your project's URL + anon key below and
     every device that opens this site shares the same live data. Falls back automatically to
     native SQLite (packaged Android app) → IndexedDB → localStorage for offline access, and as
     the only storage layer if Supabase isn't configured or is briefly unreachable. All values
     are kept as JSON blobs under a small key/value table — this keeps every existing read/write
     in the app unchanged regardless of which engine is active.

     What actually syncs to Supabase: menu, categories, and settings (all in "cafe-config")
     sync on every change via the generic storeGet/storeSet below. Orders are handled
     differently — see persistOrders/pushCompletedOrders/loadOrders further down: an
     in-progress table cart ("open" order) is only ever saved to this device's local storage,
     so building up a cart never touches the network. Only once an order is paid (or an
     already-saved sale is edited/deleted) does it get pushed to Supabase, at which point other
     devices will see it. This cuts sync traffic drastically for busy tills and matches how the
     app is actually used: 1-3 devices in one location, cart edits are private to the device
     that's building the bill, and only finished sales need to be shared.

     NOTE on multi-device use: config and completed-orders are still stored as one JSON blob
     each, so if two devices save at the exact same moment, the later write wins and can
     overwrite the other's change. Fine for 1-3 devices; ask if you want this split into proper
     relational tables (orders as real rows) for safe concurrent multi-device editing. */
  const supabaseClient = (SUPABASE_URL && SUPABASE_ANON_KEY && window.supabase)
    ? window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY)
    : null;

  async function cloudGet(key){
    const { data, error } = await supabaseClient.from("kv").select("value").eq("key", key).maybeSingle();
    if(error) throw error;
    return data ? data.value : undefined;
  }
  async function cloudSet(key, value){
    const { error } = await supabaseClient.from("kv").upsert({key, value, updated_at: new Date().toISOString()});
    if(error) throw error;
  }

  const STORAGE_PREFIX = "kaapipos:";
  const SQLITE_DB_NAME = "kaapipos";
  const IDB_DB_NAME = "kaapipos-db";
  const IDB_VERSION = 1;
  const IDB_STORE_NAME = "kv";

  function nativeSqlite(){
    return (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
      && window.Capacitor.Plugins && window.Capacitor.Plugins.CapacitorSQLite) || null;
  }

  let sqliteReadyPromise = null;
  function ensureSqliteReady(){
    if(sqliteReadyPromise) return sqliteReadyPromise;
    sqliteReadyPromise = (async () => {
      const SQLite = nativeSqlite();
      try{
        const isConn = await SQLite.isConnection({database:SQLITE_DB_NAME, readonly:false});
        if(!(isConn && isConn.result)){
          await SQLite.createConnection({database:SQLITE_DB_NAME, version:1, encrypted:false, mode:"no-encryption", readonly:false});
        }
      }catch(e){ /* connection may already exist across a hot-reload — safe to ignore */ }
      await SQLite.open({database:SQLITE_DB_NAME, readonly:false});
      await SQLite.execute({
        database:SQLITE_DB_NAME, readonly:false, transaction:true,
        statements:"CREATE TABLE IF NOT EXISTS kv (key TEXT PRIMARY KEY NOT NULL, value TEXT NOT NULL);"
      });
      return SQLite;
    })();
    return sqliteReadyPromise;
  }
  async function sqliteGet(key){
    const SQLite = await ensureSqliteReady();
    const res = await SQLite.query({database:SQLITE_DB_NAME, statement:"SELECT value FROM kv WHERE key = ?;", values:[key]});
    const rows = (res && res.values) || [];
    if(rows.length === 0) return undefined;
    return JSON.parse(rows[0].value);
  }
  async function sqliteSet(key, value){
    const SQLite = await ensureSqliteReady();
    await SQLite.run({
      database:SQLITE_DB_NAME, readonly:false,
      statement:"INSERT INTO kv (key, value) VALUES (?, ?) ON CONFLICT(key) DO UPDATE SET value = excluded.value;",
      values:[key, JSON.stringify(value)]
    });
  }

  let dbPromise = null;
  function openDb(){
    if(dbPromise) return dbPromise;
    dbPromise = new Promise((resolve)=>{
      if(!("indexedDB" in window)){ resolve(null); return; }
      let req;
      try{ req = indexedDB.open(IDB_DB_NAME, IDB_VERSION); }
      catch(e){ resolve(null); return; }
      req.onupgradeneeded = ()=>{
        const db = req.result;
        if(!db.objectStoreNames.contains(IDB_STORE_NAME)) db.createObjectStore(IDB_STORE_NAME);
      };
      req.onsuccess = ()=> resolve(req.result);
      req.onerror = ()=> resolve(null);
      req.onblocked = ()=> resolve(null);
    });
    return dbPromise;
  }
  function idbGet(db, key){
    return new Promise((resolve)=>{
      try{
        const tx = db.transaction(IDB_STORE_NAME, "readonly");
        const req = tx.objectStore(IDB_STORE_NAME).get(key);
        req.onsuccess = ()=> resolve(req.result);
        req.onerror = ()=> resolve(undefined);
      }catch(e){ resolve(undefined); }
    });
  }
  function idbSet(db, key, value){
    return new Promise((resolve, reject)=>{
      try{
        const tx = db.transaction(IDB_STORE_NAME, "readwrite");
        tx.objectStore(IDB_STORE_NAME).put(value, key);
        tx.oncomplete = ()=> resolve(true);
        tx.onerror = ()=> reject(tx.error);
        tx.onabort = ()=> reject(tx.error);
      }catch(e){ reject(e); }
    });
  }

  async function localGet(key, fallback){
    if(nativeSqlite()){
      try{
        const val = await sqliteGet(key);
        if(val !== undefined) return val;
      }catch(e){
        console.error("sqlite get failed", key, e);
      }
    }
    const db = await openDb();
    if(db){
      const val = await idbGet(db, key);
      if(val !== undefined) return val;
      try{
        const raw = localStorage.getItem(STORAGE_PREFIX + key);
        if(raw !== null && raw !== undefined){
          const migrated = JSON.parse(raw);
          await idbSet(db, key, migrated).catch(()=>{});
          return migrated;
        }
      }catch(e){ /* ignore */ }
      return fallback;
    }
    try{
      const raw = localStorage.getItem(STORAGE_PREFIX + key);
      if(raw === null || raw === undefined) return fallback;
      return JSON.parse(raw);
    }catch(e){
      return fallback;
    }
  }
  async function localSet(key, value){
    if(nativeSqlite()){
      try{ await sqliteSet(key, value); return true; }
      catch(e){ console.error("sqlite set failed", key, e); return false; }
    }
    const db = await openDb();
    if(db){
      try{ await idbSet(db, key, value); return true; }
      catch(e){ console.error("indexeddb set failed", key, e); }
    }
    try{
      localStorage.setItem(STORAGE_PREFIX + key, JSON.stringify(value));
      return true;
    }catch(e){
      console.error("storage set failed", key, e);
      return false;
    }
  }

  async function storeGet(key, fallback){
    if(supabaseClient){
      try{
        const val = await cloudGet(key);
        if(val !== undefined){
          localSet(key, val); // keep the local cache warm for offline access
          return val;
        }
      }catch(e){
        console.error("supabase get failed, using local cache", key, e);
      }
    }
    return localGet(key, fallback);
  }
  /* Tracks writes currently in flight to Supabase so the auto-refresh poll never reads back
     a stale snapshot while a just-made change (e.g. an item just added to a table's cart)
     hasn't finished saving yet — without this, syncFromCloud could overwrite fresh local
     state with the older cloud copy and make an occupied table look empty again.
     localWriteVersion additionally guards the case where a poll's own network request was
     ALREADY in flight (slow connection) when the change happened: pendingWriteCount alone
     only catches writes that started before the poll began, so the poll re-checks the
     version after its fetch resolves and discards the response if anything changed meanwhile. */
  let pendingWriteCount = 0;
  let localWriteVersion = 0;

  /* ============ Sync status indicator ============
     Surfaces whether config/sales are actually reaching Supabase, so a flaky wifi
     connection at the counter is visible instead of silently falling behind.
     States: unconfigured (no Supabase set up) | offline (browser has no network) |
     syncing | synced (last attempt succeeded) | error (last attempt failed). */
  let syncStatus = supabaseClient ? "idle" : "unconfigured";
  let lastSyncedAt = null;

  function setSyncStatus(next){
    syncStatus = next;
    if(next === "synced") lastSyncedAt = Date.now();
    renderSyncBadge();
  }

  function renderSyncBadge(){
    const dot = document.getElementById("syncDot");
    const label = document.getElementById("syncLabel");
    const btn = document.getElementById("syncBtn");
    if(!dot || !label) return;
    const text = {
      unconfigured: "No cloud sync",
      offline: "No internet",
      syncing: "Syncing…",
      error: "Sync error",
      idle: lastSyncedAt ? "Synced " + fmtAgo(lastSyncedAt) : "Not synced yet",
      synced: lastSyncedAt ? "Synced " + fmtAgo(lastSyncedAt) : "Synced"
    };
    dot.className = "sync-dot sync-" + syncStatus;
    label.textContent = text[syncStatus] || syncStatus;
    if(btn){
      btn.disabled = (syncStatus === "syncing" || syncStatus === "unconfigured");
      btn.classList.toggle("spinning", syncStatus === "syncing");
      btn.title = syncStatus === "unconfigured" ? "Cloud sync not set up" : "Sync now";
    }
  }

  async function manualSync(){
    if(!supabaseClient){ showToast("Cloud sync isn't set up on this device"); return; }
    setSyncStatus("syncing");
    try{
      // Push first (reconciles any sale that didn't make it to Supabase earlier), then pull
      // (brings in anything other devices saved) — a manual "resync both ways" in one tap.
      await pushCompletedOrders();
      await syncFromCloud();
      setSyncStatus("synced");
      showToast("Synced");
    }catch(e){
      console.error("manual sync failed", e);
      setSyncStatus(navigator.onLine === false ? "offline" : "error");
      showToast("Sync failed — will keep retrying automatically");
    }
  }

  window.addEventListener("online", () => { if(supabaseClient) manualSync(); });
  window.addEventListener("offline", () => setSyncStatus("offline"));

  async function storeSet(key, value){
    pendingWriteCount++;
    localWriteVersion++;
    let cloudFailed = false;
    try{
      if(supabaseClient){
        setSyncStatus("syncing");
        try{
          await cloudSet(key, value);
          setSyncStatus("synced");
        }catch(e){
          cloudFailed = true;
          console.error("supabase set failed", key, e);
          setSyncStatus(navigator.onLine === false ? "offline" : "error");
        }
      }
      const localOk = await localSet(key, value);
      if(cloudFailed){
        showToast("Offline — saved on this device, will need to resync");
      }else if(!localOk){
        showToast("Couldn't save — device storage full or blocked");
      }
    } finally {
      pendingWriteCount--;
    }
  }

  /* Deep, key-order-independent equality check. Postgres JSONB does not preserve object key
     order, so a value round-tripped through Supabase can come back with keys reordered even
     when nothing actually changed. A plain JSON.stringify comparison would then wrongly treat
     every poll as "changed". Used to skip re-rendering/re-saving when a sync fetch pulled back
     the exact same data that's already in memory. */
  function stableStringify(value){
    if(Array.isArray(value)) return "[" + value.map(stableStringify).join(",") + "]";
    if(value && typeof value === "object"){
      return "{" + Object.keys(value).sort().map(k => JSON.stringify(k) + ":" + stableStringify(value[k])).join(",") + "}";
    }
    return JSON.stringify(value);
  }
  function sameData(a, b){
    return stableStringify(a) === stableStringify(b);
  }

  /* ============ Overlay navigation stack (Android/browser back-button support) ============
     Every full-screen overlay, bottom sheet and modal pushes a history entry when it opens.
     Pressing the hardware/gesture back button (or an in-app back/close control) then unwinds
     the stack one layer at a time instead of exiting the whole app. */
  const layerStack = [];

  function pushOverlay(type, onClose){
    layerStack.push({type, close:onClose});
    history.pushState({kaapiDepth:layerStack.length}, "");
  }
  function replaceTopOverlay(type, onClose){
    if(layerStack.length){
      layerStack[layerStack.length-1] = {type, close:onClose};
    } else {
      layerStack.push({type, close:onClose});
    }
    history.replaceState({kaapiDepth:layerStack.length}, "");
  }
  function closeTopOverlay(){
    if(layerStack.length>0) history.back();
  }
  function closeOverlaysCount(n){
    if(n>0) history.go(-n);
  }
  window.addEventListener("popstate", function(e){
    const targetDepth = (e.state && typeof e.state.kaapiDepth === "number") ? e.state.kaapiDepth : 0;
    while(layerStack.length > targetDepth){
      const top = layerStack.pop();
      if(top && typeof top.close === "function") top.close();
    }
  });
  history.replaceState({kaapiDepth:0}, "");

  /* ============ Utilities ============ */
  function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }
  function money(n){
    n = Number(n)||0;
    return "₹" + (Number.isInteger(n) ? n : n.toFixed(2));
  }
  function todayStr(d){
    d = d || new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function fmtTime(ts){
    const d = new Date(ts);
    let h = d.getHours(), m = String(d.getMinutes()).padStart(2,"0");
    const ap = h>=12?"pm":"am"; h = h%12; if(h===0) h=12;
    return h+":"+m+" "+ap;
  }
  function fmtDateTime(ts){
    const d = new Date(ts);
    const months = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    return d.getDate()+" "+months[d.getMonth()]+", "+fmtTime(ts);
  }
  function fmtElapsed(startTs){
    let diff = Math.max(0, Date.now() - startTs);
    let mins = Math.floor(diff/60000);
    let h = Math.floor(mins/60), m = mins%60;
    return h>0 ? (h+"h "+m+"m") : (m+"m");
  }
  function fmtAgo(ts){
    if(Date.now() - ts < 60000) return "just now";
    return fmtElapsed(ts) + " ago";
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  }
  function showToast(msg){
    const root = document.getElementById("toastRoot");
    const el = document.createElement("div");
    el.className = "toast";
    el.textContent = msg;
    root.appendChild(el);
    setTimeout(()=>el.remove(), 2200);
  }

  /* ============ Default seed data ============ */
  function seedConfig(){
    const cBev = uid(), cSnk = uid(), cDes = uid();
    return {
      categories: [
        {id:cBev, name:"Beverages"},
        {id:cSnk, name:"Snacks"},
        {id:cDes, name:"Desserts"}
      ],
      items: [
        {id:uid(), name:"Masala Chai", price:20, categoryId:cBev},
        {id:uid(), name:"Filter Coffee", price:25, categoryId:cBev},
        {id:uid(), name:"Cold Coffee", price:60, categoryId:cBev},
        {id:uid(), name:"Fresh Lime Soda", price:40, categoryId:cBev},
        {id:uid(), name:"Veg Sandwich", price:70, categoryId:cSnk},
        {id:uid(), name:"French Fries", price:90, categoryId:cSnk},
        {id:uid(), name:"Samosa", price:25, categoryId:cSnk},
        {id:uid(), name:"Masala Maggi", price:60, categoryId:cSnk},
        {id:uid(), name:"Brownie", price:80, categoryId:cDes},
        {id:uid(), name:"Ice Cream", price:60, categoryId:cDes}
      ],
      tables: [1,2,3,4,5,6].map(n => ({id:uid(), name:"Table "+n})),
      settings: {cafeName:"Kaapi Cafe", address:"", phone:"", footerNote:"Thank you! Visit again", directPrint:false, printerName:null, printerId:null, discountEnabled:false},
      nextInvoiceNo: 1
    };
  }

  /* ============ App State ============ */
  const state = {
    config: null,
    orders: [],
    deletedOrderIds: [], // ids of completed sales deleted on this or another device — see tombstone note below
    tab: "tables",
    menuSub: "categories",
    activeTableId: null,
    billingCategoryFilter: "all",
    reportRange: "day",
    reportAnchor: todayStr(),
    expandedOrderId: null,
    modal: null,   // {type, data}
    sheet: null,   // 'cart'
    paymentMethod: null,
    splitCash: "",
    splitUpi: "",
    discountPercent: ""
  };

  let timerInterval = null;

  /* ============ Derived helpers ============ */
  function getOpenOrder(tableId){
    return state.orders.find(o => o.tableId === tableId && o.status === "open");
  }
  function orderTotal(order){
    return order.items.reduce((s,l)=> s + l.price*l.qty, 0);
  }
  // Discount is only ever applied at the payment step (percentage of subtotal).
  // Given a subtotal and a raw percent input, returns a clamped {percent, amount, total}.
  function computeDiscount(subtotal, rawPercent){
    let percent = parseFloat(rawPercent);
    if(isNaN(percent) || percent < 0) percent = 0;
    if(percent > 100) percent = 100;
    const amount = +(subtotal * percent / 100).toFixed(2);
    const total = +(subtotal - amount).toFixed(2);
    return {percent, amount, total};
  }
  function categoryName(id){
    const c = state.config.categories.find(c=>c.id===id);
    return c ? c.name : "Uncategorized";
  }
  function itemsInCategory(catId){
    return state.config.items.filter(i => i.categoryId === catId);
  }

  /* Orders are saved LOCALLY every time (so a page refresh never loses an in-progress
     table cart), but only pushed to Supabase once an order stops being "open" — i.e.
     once it's paid, or an already-saved sale is edited/deleted. This means adding/
     removing cart items never touches the network at all; only completed sales sync
     across devices. Menu, categories and settings are unaffected and keep syncing via
     persistConfig() below on every change, same as before. */
  async function persistOrders(){ await localSet("cafe-orders", state.orders); }

  /* Deleting a completed sale removes it from state.orders, but the push merge below unions
     this device's list with whatever's on Supabase — and a deleted sale's id would still be
     sitting in the cloud copy. With nothing marking it as "deleted on purpose", the merge
     can't tell that apart from "another device added this and I haven't seen it yet", so it
     got treated as a new sale and pushed straight back. That's why deletes kept resyncing the
     old bill. Fixed with a small tombstone list (deletedOrderIds): once an id is in here, no
     device will ever push or pull it back in, on this device or any other. */
  async function persistDeletedOrderIds(){ await storeSet("cafe-deleted-orders", state.deletedOrderIds); }
  function markOrderDeleted(id){
    if(!state.deletedOrderIds.includes(id)) state.deletedOrderIds = [...state.deletedOrderIds, id];
  }

  /* pushCompletedOrders used to fetch-merge-write in one shot. That has a lost-update race:
     if two saves happen close together — two tables closed back-to-back on this device, or
     this device and another device completing sales within the same moment — both reads can
     happen before either write lands, so both computed merges are missing the other's sale,
     and whichever write finishes last silently overwrites (erases) it from the cloud. That's
     what was making a saved sale disappear even though it saved fine locally.
     Fixed two ways:
       1) allPushesQueued serializes calls FROM THIS DEVICE, so two saves on the same device
          never run their fetch-merge-write cycles concurrently.
       2) After writing, re-fetch and confirm every order this device knows about is actually
          present in the cloud copy. If something we pushed is missing — another device's
          write raced ours in the gap between our fetch and our write — redo the merge and
          push again (a few attempts) instead of accepting a possibly-clobbered result. */
  let allPushesQueued = Promise.resolve();
  function pushCompletedOrders(retryCount){
    const run = allPushesQueued.then(() => doPushCompletedOrders(retryCount));
    allPushesQueued = run.catch(() => {});
    return run;
  }

  async function doPushCompletedOrders(retryCount){
    if(!supabaseClient) return;
    pendingWriteCount++;
    localWriteVersion++;
    setSyncStatus("syncing");
    try{
      const MAX_ATTEMPTS = 3;
      let reconciled = false;
      // Learn about any deletions other devices made that haven't reached this device yet,
      // so this push doesn't resurrect a sale someone else just deleted.
      try{
        const cloudDeleted = await cloudGet("cafe-deleted-orders");
        if(Array.isArray(cloudDeleted) && cloudDeleted.length){
          const merged = Array.from(new Set([...state.deletedOrderIds, ...cloudDeleted]));
          if(merged.length !== state.deletedOrderIds.length){
            state.deletedOrderIds = merged;
            await localSet("cafe-deleted-orders", state.deletedOrderIds);
            state.orders = state.orders.filter(o => !state.deletedOrderIds.includes(o.id));
          }
        }
      }catch(e){
        console.error("supabase deleted-orders pre-fetch failed, using local tombstones only", e);
      }
      for(let attempt = 1; attempt <= MAX_ATTEMPTS && !reconciled; attempt++){
        const myCompleted = state.orders.filter(o => o.status !== "open" && !state.deletedOrderIds.includes(o.id));
        // Merge with what's currently in the cloud instead of overwriting it outright. This
        // device's own list is authoritative for any order id it knows about (it's the freshest
        // edit), but another device may have completed a different sale moments ago that hasn't
        // reached this device yet — pushing this device's list as-is would silently wipe that
        // sale out. Pre-fetching and unioning by id prevents a saved sale from going missing.
        let toPush = myCompleted;
        try{
          const cloudCompleted = await cloudGet("cafe-orders");
          if(Array.isArray(cloudCompleted)){
            const mineById = new Map(myCompleted.map(o => [o.id, o]));
            const extraFromCloud = cloudCompleted.filter(o => !mineById.has(o.id) && !state.deletedOrderIds.includes(o.id));
            if(extraFromCloud.length) toPush = [...myCompleted, ...extraFromCloud];
          }
        }catch(e){
          console.error("supabase orders pre-fetch for merge failed, pushing local copy only", e);
        }
        await cloudSet("cafe-orders", toPush);
        try{
          const verify = await cloudGet("cafe-orders");
          const verifyIds = new Set(Array.isArray(verify) ? verify.map(o => o.id) : []);
          reconciled = toPush.every(o => verifyIds.has(o.id));
          if(!reconciled) console.error("supabase orders sync: concurrent write detected, retrying merge", attempt);
        }catch(e){
          // Can't verify right now (offline etc.) — treat the write above as our best effort.
          reconciled = true;
        }
      }
      if(reconciled){
        setSyncStatus("synced");
      }else{
        setSyncStatus("error");
        showToast("Sync conflict — please check Reports for missing sales");
      }
    }catch(e){
      console.error("supabase orders sync failed", e);
      setSyncStatus(navigator.onLine === false ? "offline" : "error");
      // Billing-critical: retry once after a short delay before giving up, since a saved
      // sale not reaching the cloud means other devices won't see it until the next poll
      // picks up a later change. Fine for a blip; only surfaces the "offline" toast if
      // the retry also fails.
      if(!retryCount){
        setTimeout(() => pushCompletedOrders(1), 3000);
      } else {
        showToast("Offline — sale saved on this device, will resync later");
      }
    } finally {
      pendingWriteCount--;
    }
  }

  async function persistConfig(){ await storeSet("cafe-config", state.config); }

  /* Loads orders at startup: open/in-progress carts come only from this device's local
     cache (they were never sent to Supabase), while completed orders come from Supabase
     when available so every device sees the same sales history. Anything in
     state.deletedOrderIds (loaded just before this runs, see init()) is filtered out so a
     deleted sale never reappears after a restart even if a stale copy is still on Supabase. */
  async function loadOrders(){
    const localOrders = await localGet("cafe-orders", []);
    const localOpenOrders = localOrders.filter(o => o.status === "open");
    let completedOrders = localOrders.filter(o => o.status !== "open");
    if(supabaseClient){
      try{
        const cloudOrders = await cloudGet("cafe-orders");
        if(Array.isArray(cloudOrders)) completedOrders = cloudOrders;
      }catch(e){
        console.error("supabase orders load failed, using local cache", e);
      }
    }
    completedOrders = completedOrders.filter(o => !state.deletedOrderIds.includes(o.id));
    const merged = [...localOpenOrders, ...completedOrders];
    await localSet("cafe-orders", merged);
    return merged;
  }

  /* ============ Init ============ */
  async function init(){
    // Ask the browser/WebView to treat this site's storage as persistent so Android
    // never silently evicts orders/reports under storage pressure (it's allowed to
    // clear "best-effort" storage on low disk space otherwise). Safe no-op if the
    // API isn't available or the request is declined.
    try{
      if(navigator.storage && navigator.storage.persist){
        await navigator.storage.persist();
      }
    }catch(e){ /* ignore — falls back to best-effort storage */ }

    let cfg = await storeGet("cafe-config", null);
    if(!cfg){ cfg = seedConfig(); await storeSet("cafe-config", cfg); }
    let needsSave = false;
    if(!cfg.settings){ cfg.settings = {cafeName:"Kaapi Cafe", address:"", phone:"", footerNote:"Thank you! Visit again", directPrint:false, printerName:null, printerId:null, discountEnabled:false}; needsSave = true; }
    if(cfg.settings.directPrint === undefined){ cfg.settings.directPrint = false; needsSave = true; }
    if(cfg.settings.discountEnabled === undefined){ cfg.settings.discountEnabled = false; needsSave = true; }
    if(!cfg.nextInvoiceNo){ cfg.nextInvoiceNo = 1; needsSave = true; }
    if(needsSave) await storeSet("cafe-config", cfg);
    state.config = cfg;
    state.deletedOrderIds = await storeGet("cafe-deleted-orders", []);
    state.orders = await loadOrders();

    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("app").style.display = "flex";

    bindStaticEvents();
    render();

    timerInterval = setInterval(updateLiveTimers, 1000);
    startAutoReload();
  }

  /* ============ Cloud sync (manual pull, automatic push) ============
     Pulling from Supabase (picking up another device's sales/menu changes) now only
     happens when the person taps the manual sync button — no 10s poll, no realtime
     auto-refresh, no pull-on-tab-focus. This was turned off on request: automatic
     background pulls were part of what made a deleted sale reappear (a poll landing
     right after a delete, before the deletion had a chance to reach Supabase, would
     pull the still-there cloud copy straight back in). The tombstone fix above closes
     that hole for pulls too, but removing automatic pulling was requested independently
     of the bug fix, so it stays off regardless.
     Pushing TO Supabase remains fully automatic: saving a bill, editing/deleting a sale,
     and changing menu/settings all still sync out immediately on their own, same as
     before — only the pull direction is now manual-only. */
  let realtimeChannel = null;

  function startAutoReload(){
    // Automatic pulling is intentionally disabled — see note above. Manual sync
    // (the 🔄 button, via manualSync()) is the only way this device pulls from
    // Supabase now.
  }
  /* Auto-refresh only ever needs to pull in things another device changed: the menu/settings
     (config) and completed sales (for Reports). The active cart on THIS device — any order
     still status "open" — is never replaced by a poll response, no matter what the cloud
     copy currently says. That's what was making items vanish: this device would push a new
     item to the cloud, then a poll (sometimes one already in flight before the add happened)
     would apply an older cloud snapshot on top and wipe it back out. Excluding open orders
     from what a poll can overwrite removes that race entirely, rather than just timing around it. */
  async function syncFromCloud(){
    if(document.hidden) return;
    if(layerStack.length > 0) return;
    if(pendingWriteCount > 0) return; // a local change is still saving — don't race it
    const versionAtStart = localWriteVersion;
    try{
      const cfg = await storeGet("cafe-config", state.config);
      const deletedIds = await storeGet("cafe-deleted-orders", state.deletedOrderIds);
      // Completed orders come straight from Supabase (never through storeGet/localSet for
      // this key) — storeGet would otherwise cache the cloud's completed-only list over the
      // local blob and wipe out this device's open cart the next time the page refreshes.
      let cloudCompletedOrders = state.orders.filter(o => o.status !== "open");
      if(supabaseClient){
        const cloud = await cloudGet("cafe-orders");
        if(Array.isArray(cloud)) cloudCompletedOrders = cloud;
        setSyncStatus("synced"); // round trip to Supabase succeeded, whether or not anything changed
      }
      // Never let a tombstoned id back in, whether it's stale data still on Supabase or this
      // device just hasn't learned about a deletion another device made yet.
      cloudCompletedOrders = cloudCompletedOrders.filter(o => !deletedIds.includes(o.id));
      // Something changed locally (a new save started, or the user opened an overlay again)
      // while this fetch was in flight. Applying this response now would silently undo that
      // newer change, so drop it — the next poll will pick up the correct state instead.
      if(localWriteVersion !== versionAtStart) return;
      if(pendingWriteCount > 0) return;
      if(layerStack.length > 0) return;

      // Only touch state/storage/DOM for the piece that actually changed. Every poll used to
      // reassign state.config, rebuild state.orders and re-render unconditionally — even when
      // the cloud returned byte-for-byte the same data — which meant a re-render (and a
      // local-cache rewrite) every 10s on every device for no reason. Comparing first means
      // "sync" only does work when there's a real update to apply.
      const configChanged = !sameData(cfg, state.config);
      const deletedChanged = !sameData(deletedIds, state.deletedOrderIds);
      const currentCompletedOrders = state.orders.filter(o => o.status !== "open");
      const ordersChanged = !sameData(cloudCompletedOrders, currentCompletedOrders);
      if(!configChanged && !ordersChanged && !deletedChanged) return;

      if(configChanged) state.config = cfg;
      if(deletedChanged) state.deletedOrderIds = deletedIds;
      if(ordersChanged || deletedChanged){
        const localOpenOrders = state.orders.filter(o => o.status === "open");
        state.orders = [...localOpenOrders, ...cloudCompletedOrders];
        await localSet("cafe-orders", state.orders); // keep local cache consistent for refreshes
      }
      render();
    }catch(e){
      console.error("auto-reload sync failed", e);
      if(supabaseClient) setSyncStatus(navigator.onLine === false ? "offline" : "error");
    }
  }

  function updateLiveTimers(){
    document.querySelectorAll("[data-elapsed-start]").forEach(el=>{
      const start = Number(el.getAttribute("data-elapsed-start"));
      el.textContent = fmtElapsed(start);
    });
    // Keep "Synced Xm ago" ticking without needing an actual sync to fire
    if((syncStatus === "idle" || syncStatus === "synced") && lastSyncedAt){
      const label = document.getElementById("syncLabel");
      if(label) label.textContent = "Synced " + fmtAgo(lastSyncedAt);
    }
  }

  /* ============ Render root ============ */
  function render(){
    document.querySelectorAll(".navbtn").forEach(b=>{
      b.classList.toggle("active", b.dataset.tab === state.tab);
    });
    const names = {tables:"Tables", menu:"Menu", reports:"Reports"};
    document.getElementById("tabName").textContent = names[state.tab];
    document.getElementById("headerMenuBtn").style.display = (state.tab === "reports") ? "flex" : "none";

    const view = document.getElementById("view");
    if(state.tab === "tables") view.innerHTML = renderTablesTab();
    else if(state.tab === "menu") view.innerHTML = renderMenuTab();
    else if(state.tab === "reports") view.innerHTML = renderReportsTab();

    renderModal();
  }

  /* ============ TABLES TAB ============ */
  function renderTablesTab(){
    const tables = state.config.tables;
    if(tables.length === 0){
      return emptyState("🍽️","No tables yet","Add your first table in the Menu tab under Tables, then come back here to start billing.");
    }
    const cards = tables.map(t=>{
      const order = getOpenOrder(t.id);
      const occ = !!order;
      const total = occ ? orderTotal(order) : 0;
      return `
        <button class="table-card ${occ?"occupied":""}" data-open-table="${t.id}">
          <div>
            <div class="tname">${escapeHtml(t.name)}</div>
            <div class="tstatus"><span class="dot"></span> ${occ?"Occupied":"Free"}</div>
          </div>
          <div class="tmeta">
            ${occ ? `<span class="telapsed" data-elapsed-start="${order.createdAt}">${fmtElapsed(order.createdAt)}</span>` : `<span class="telapsed">—</span>`}
            ${occ ? `<span class="ttotal">${money(total)}</span>` : `<span></span>`}
          </div>
        </button>`;
    }).join("");
    return `<div class="tables-grid">${cards}</div>`;
  }

  /* ============ MENU TAB ============ */

    const seg = `
      <div class="segmented">
        <button data-menusub="categories" class="${state.menuSub==="categories"?"active":""}">Categories</button>
        <button data-menusub="items" class="${state.menuSub==="items"?"active":""}">Items</button>
        <button data-menusub="tables" class="${state.menuSub==="tables"?"active":""}">Tables</button>
        <button data-menusub="settings" class="${state.menuSub==="settings"?"active":""}">Settings</button>
      </div>`;
    let body = "";
    if(state.menuSub === "categories") body = renderCategoriesList();
    else if(state.menuSub === "items") body = renderItemsList();
    else if(state.menuSub === "tables") body = renderTablesList();
    else body = renderSettingsTab();
    return seg + body;

  function renderCategoriesList(){
    const cats = state.config.categories;
    let rows = cats.length ? cats.map(c=>{
      const count = itemsInCategory(c.id).length;
      return `
        <div class="list-row">
          <div class="rowmain">
            <div class="rtitle">${escapeHtml(c.name)}</div>
            <div class="rsub">${count} item${count===1?"":"s"}</div>
          </div>
          <div class="ractions">
            <button class="icon-btn" data-edit-category="${c.id}">✏️</button>
            <button class="icon-btn" data-delete-category="${c.id}">🗑️</button>
          </div>
        </div>`;

  function renderItemsList(){
    if(state.config.categories.length===0){
      return emptyState("🏷️","Add a category first","Items need a category to belong to. Create one in the Categories tab.");
    }
    let html = "";
    state.config.categories.forEach(cat=>{
      const items = itemsInCategory(cat.id);
      if(items.length===0) return;
      html += `<div class="cat-chip-header">${escapeHtml(cat.name)}</div>`;
      items.forEach(it=>{
        html += `
          <div class="list-row">
            <div class="rowmain">
              <div class="rtitle">${escapeHtml(it.name)}</div>
              <div class="rsub">${money(it.price)}</div>
            </div>

              <button class="icon-btn" data-edit-item="${it.id}">✏️</button>

      return `
        <div class="list-row">
          <div class="rowmain">
            <div class="rtitle">${escapeHtml(t.name)}</div>
            <div class="rsub">${occ ? "Currently occupied" : "Free"}</div>
          </div>
          <div class="ractions">

  /* ============ REPORTS TAB ============ */
  function rangeBounds(){
    const anchor = new Date(state.reportAnchor + "T00:00:00");
    let start, end;
    if(state.reportRange === "day"){
      start = new Date(anchor); end = new Date(anchor); end.setHours(23,59,59,999);
    } else if(state.reportRange === "week"){
      const day = anchor.getDay();
      start = new Date(anchor); start.setDate(anchor.getDate()-day);
      end = new Date(start); end.setDate(start.getDate()+6); end.setHours(23,59,59,999);
    } else {
      start = new Date(anchor.getFullYear(), anchor.getMonth(), 1);
      end = new Date(anchor.getFullYear(), anchor.getMonth()+1, 0, 23,59,59,999);
    }
    return {start:start.getTime(), end:end.getTime()};
  }

  function renderReportsTab(){
    const {start,end} = rangeBounds();
    const paid = state.orders.filter(o=>o.status==="paid" && o.paidAt>=start && o.paidAt<=end)
                              .sort((a,b)=>b.paidAt-a.paidAt);
    const total = paid.reduce((s,o)=>s+o.total,0);
    const cash = paid.reduce((s,o)=> s + (o.payment ? (o.payment.method==="cash" ? o.payment.total|| o.total : (o.payment.cash||0)) : 0), 0);
    const upi = paid.reduce((s,o)=> s + (o.payment ? (o.payment.method==="upi" ? (o.payment.total||o.total) : (o.payment.upi||0)) : 0), 0);

    const rangeButtons = `
      <div class="segmented">
        <button data-report-range="day" class="${state.reportRange==="day"?"active":""}">Day</button>
        <button data-report-range="week" class="${state.reportRange==="week"?"active":""}">Week</button>
        <button data-report-range="month" class="${state.reportRange==="month"?"active":""}">Month</button>
      </div>
      <div class="range-row">
        <input type="date" id="reportDateInput" value="${state.reportAnchor}">
      </div>`;

    const stats = `
      <div class="stat-grid">
        <div class="stat-card accent"><div class="slabel">Total sales</div><div class="sval">${money(total)}</div></div>
        <div class="stat-card"><div class="slabel">Orders</div><div class="sval">${paid.length}</div></div>
        <div class="stat-card"><div class="slabel">Cash</div><div class="sval">${money(cash)}</div></div>
        <div class="stat-card"><div class="slabel">UPI</div><div class="sval">${money(upi)}</div></div>
      </div>`;

    let list;
    if(paid.length === 0){
      list = emptyState("📊","No sales in this range","Completed orders will show up here with a full breakdown.");
    } else {
      list = paid.map(o=>{
        const badgeClass = o.payment.method==="cash"?"badge-cash":o.payment.method==="upi"?"badge-upi":"badge-mixed";
        const expanded = state.expandedOrderId === o.id;
        let detail = "";
        if(expanded){
          const lines = o.items.map(l=>`<div class="dline"><span>${escapeHtml(l.name)} × ${l.qty}</span><span>${money(l.price*l.qty)}</span></div>`).join("");
          let discountLine = "";
          if(o.discount){
            discountLine = `<div class="dline"><span>Subtotal</span><span>${money(o.subtotal)}</span></div><div class="dline"><span>Discount (${o.discount.percent}%)</span><span>-${money(o.discount.amount)}</span></div>`;
          }
          let payLine = "";
          if(o.payment.method==="mixed"){
            payLine = `<div class="dline"><span>Cash</span><span>${money(o.payment.cash)}</span></div><div class="dline"><span>UPI</span><span>${money(o.payment.upi)}</span></div>`;
          }
          detail = `<div class="order-detail">${lines}${discountLine}${payLine}
            <button class="btn btn-outline btn-block" style="margin-top:10px;" data-print-order="${o.id}">🧾 Print bill again</button>
            <button class="btn btn-outline btn-block" style="margin-top:8px;" data-edit-bill-order="${o.id}">✏️ Edit bill</button>
            <button class="btn btn-outline btn-block" style="margin-top:8px;" data-change-payment-order="${o.id}">💳 Change payment mode</button>
            <button class="btn btn-danger btn-block" style="margin-top:8px;" data-delete-order="${o.id}">🗑️ Delete sale</button>
          </div>`;
        }
        return `
          <div class="order-row" data-toggle-order="${o.id}">
            <div class="otop">
              <div>
                <div class="oleft">${escapeHtml(o.tableName)} · ${money(o.total)}</div>
                <div class="otime">Bill #${o.invoiceNo || "—"} · ${fmtTime(o.paidAt)}</div>
              </div>
              <span class="badge ${badgeClass}">${o.payment.method}</span>
            </div>
            ${detail}
          </div>`;
      }).join("");
    }

    return rangeButtons + stats + list;
  }

  /* ============ Empty state helper ============ */
  function emptyState(icon, title, body){
    return `<div class="empty-state"><div class="big">${icon}</div><div style="font-weight:700; font-size:15px;">${title}</div><p>${body}</p></div>`;
  }

  /* ============ BILLING OVERLAY ============ */

    state.activeTableId = tableId;
    state.billingCategoryFilter = "all";
    document.getElementById("billingOverlay").classList.add("open");
    renderBilling();
    pushOverlay("billing", doCloseBilling);
  }
  function doCloseBilling(){
    document.getElementById("billingOverlay").classList.remove("open");
    state.sheet = null;
    renderSheet();
    render();
  }

  function renderBilling(){
    const table = state.config.tables.find(t=>t.id===state.activeTableId);
    if(!table){ closeTopOverlay(); return; }
    const order = getOpenOrder(table.id);
    document.getElementById("billingTitle").textContent = table.name;
    document.getElementById("billingSub").textContent = order ? "Order open · " + fmtElapsed(order.createdAt) : "Empty order";
    const count = order ? order.items.reduce((s,l)=>s+l.qty,0) : 0;
    const countBadge = document.getElementById("billingCartCount");
    countBadge.style.display = count>0 ? "flex" : "none";
    countBadge.textContent = count;

    const cats = state.config.categories;
    const chips = `<div class="chip-row">
        <button class="chip ${state.billingCategoryFilter==='all'?'active':''}" data-billing-filter="all">All</button>
        ${cats.map(c=>`<button class="chip ${state.billingCategoryFilter===c.id?'active':''}" data-billing-filter="${c.id}">${escapeHtml(c.name)}</button>`).join("")}
      </div>`;

    let items = state.billingCategoryFilter==="all" ? state.config.items : itemsInCategory(state.billingCategoryFilter);
    let grid;
    if(state.config.items.length===0){
      grid = emptyState("🍪","No menu items yet","Add items in the Menu tab before billing.");
    } else if(items.length===0){
      grid = emptyState("🔍","Nothing in this category","Try a different category above.");
    } else {
      grid = `<div class="item-grid">` + items.map(it=>{
        const line = order ? order.items.find(l=>l.itemId===it.id) : null;
        const qty = line ? line.qty : 0;
        return `
          <button class="item-card" data-add-cart="${it.id}">
            ${qty>0?`<span class="qtybadge">${qty}</span>`:""}
            <div class="iname">${escapeHtml(it.name)}</div>
            <div class="iprice">${money(it.price)}</div>
          </button>`;
      }).join("") + `</div>`;
    }

    document.getElementById("billingBody").innerHTML = chips + grid;
    renderCartBar();
  }

  function renderCartBar(){
    // remove existing bar
    const existing = document.getElementById("cartBarEl");
    if(existing) existing.remove();
    const order = getOpenOrder(state.activeTableId);
    if(!order || order.items.length===0) return;
    const total = orderTotal(order);
    const count = order.items.reduce((s,l)=>s+l.qty,0);
    const bar = document.createElement("div");
    bar.id = "cartBarEl";
    bar.className = "cartbar";
    bar.innerHTML = `
      <div>
        <div class="cinfo">${count} item${count===1?"":"s"} in cart</div>
        <div class="ctotal">${money(total)}</div>
      </div>
      <button class="cta" id="viewCartBtn">View cart</button>`;
    document.getElementById("billingOverlay").appendChild(bar);
  }

  function addToCart(itemId){
    const table = state.config.tables.find(t=>t.id===state.activeTableId);
    const item = state.config.items.find(i=>i.id===itemId);
    if(!table || !item) return;
    let order = getOpenOrder(table.id);
    if(!order){
      order = {id:uid(), tableId:table.id, tableName:table.name, items:[], status:"open", createdAt:Date.now()};
      state.orders.push(order);
    }
    let line = order.items.find(l=>l.itemId===itemId);
    if(line) line.qty += 1;
    else order.items.push({itemId:item.id, name:item.name, price:item.price, qty:1});
    persistOrders();
    renderBilling();
  }

  function changeCartQty(itemId, delta){
    const order = getOpenOrder(state.activeTableId);
    if(!order) return;
    let line = order.items.find(l=>l.itemId===itemId);
    if(!line) return;
    line.qty += delta;
    if(line.qty <= 0){
      order.items = order.items.filter(l=>l.itemId!==itemId);
    }
    if(order.items.length===0){
      state.orders = state.orders.filter(o=>o.id!==order.id);
      state.sheet = null;
      renderSheet();
      // The cart sheet auto-closed programmatically here (not via the back button/backdrop),
      // so pop its entry off the nav stack too -- otherwise the next back-press just consumes
      // this now-stale "sheet" layer instead of actually leaving the billing screen.
      if(layerStack.length && layerStack[layerStack.length-1].type === "sheet"){
        closeTopOverlay();
      }
    }
    persistOrders();
    renderBilling();
    if(state.sheet === "cart") renderSheet();
  }
