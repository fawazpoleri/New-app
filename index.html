  // Packaged into the Android app, `window.print()` has no effect: a plain Capacitor/Android
  // WebView does not implement the JS print API on its own (that's a Chrome/desktop-browser
  // feature) -- it needs an explicit native hookup to android.print.PrintManager. The KaapiPrint
  // plugin (added to the Android project) provides that hookup; on the web/PWA build, or if the
  // plugin isn't present for any reason, this falls back to the normal window.print() dialog.

  /* ---- Direct Bluetooth print (Web Bluetooth + ESC/POS), 2" / 58mm, 32-char width ---- */
  const ESCPOS_WIDTH = 32;
  const BT_PRINTER_SERVICE_UUIDS = [
    "000018f0-0000-1000-8000-00805f9b34fb",
    "0000ff00-0000-1000-8000-00805f9b34fb",
    "49535343-fe7d-4ae5-8fa9-9fafd205e455",
    "e7810a71-73ae-499d-8c15-faa9aef0c3f2"
  ];
  let btDevice = null;
  let btCharacteristic = null;

  function padRow(left, right, width){
    left = String(left); right = String(right);
    const space = width - left.length - right.length;
    if(space < 1) return (left + " " + right).slice(0, width);
    return left + " ".repeat(space) + right;
  }
  function centerRow(text, width){
    text = String(text);
    if(text.length >= width) return text.slice(0, width);
    return " ".repeat(Math.floor((width - text.length)/2)) + text;
  }
  function wrapRow(text, width){
    text = String(text);
    const out = [];
    for(let i=0;i<text.length;i+=width) out.push(text.slice(i,i+width));
    return out.length ? out : [""];
  }
  function moneyPlain(n){
    n = Number(n)||0;
    return "Rs " + (Number.isInteger(n) ? n : n.toFixed(2));
  }
  function escposEncode(lines){
    const ESC=0x1B, GS=0x1D;
    const bytes = [ESC,0x40]; // init
    const push = str => bytes.push(...Array.from(new TextEncoder().encode(str)));
    push(lines.join("\n") + "\n\n\n");
    bytes.push(GS,0x56,0x42,0x00); // partial cut (ignored by printers without a cutter)
    return new Uint8Array(bytes);
  }

  function buildKOTEscPos(order){
    const W = ESCPOS_WIDTH;
    const lines = [];
    lines.push(centerRow("KITCHEN ORDER", W));
    lines.push("-".repeat(W));
    lines.push(padRow(order.tableName, fmtDateTime(Date.now()), W));
    lines.push("-".repeat(W));
    order.items.forEach(l=>{
      wrapRow(`${String(l.qty)+"x"} ${l.name}`, W).forEach(row=>lines.push(row));
    });
    lines.push("-".repeat(W));
    return escposEncode(lines);
  }

  function buildBillEscPos(order){
    const cfg = state.config.settings || {};
    const W = ESCPOS_WIDTH;
    const lines = [];
    lines.push(centerRow(cfg.cafeName || "Kaapi Cafe", W));
    if(cfg.address) lines.push(centerRow(cfg.address, W));
    if(cfg.phone) lines.push(centerRow(cfg.phone, W));
    lines.push("-".repeat(W));
    lines.push(padRow("Bill #"+(order.invoiceNo||""), order.tableName, W));
    lines.push(fmtDateTime(order.paidAt));
    lines.push("-".repeat(W));
    order.items.forEach(l=>{
      wrapRow(l.name, W).forEach(row=>lines.push(row));
      lines.push(padRow(`  ${l.qty} x ${moneyPlain(l.price)}`, moneyPlain(l.price*l.qty), W));
    });
    lines.push("-".repeat(W));
    if(order.discount){
      lines.push(padRow("Subtotal", moneyPlain(order.subtotal), W));
      lines.push(padRow(`Discount (${order.discount.percent}%)`, "-"+moneyPlain(order.discount.amount), W));
    }
    lines.push(padRow("TOTAL", moneyPlain(order.total), W));
    lines.push("-".repeat(W));
    if(order.payment.method === "mixed"){
      lines.push(padRow("Cash", moneyPlain(order.payment.cash), W));
      lines.push(padRow("UPI", moneyPlain(order.payment.upi), W));
    } else {
      lines.push(padRow("Paid via", order.payment.method.toUpperCase(), W));
    }
    lines.push("-".repeat(W));
    lines.push(centerRow(cfg.footerNote || "Thank you! Visit again", W));
    return escposEncode(lines);
  }

  async function findWritableCharacteristic(server){
    const services = await server.getPrimaryServices();
    for(const service of services){
      const chars = await service.getCharacteristics();
      const writable = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
      if(writable) return writable;
    }
    return null;
  }

  async function connectBluetoothPrinter(){
    if(!navigator.bluetooth){
      showToast("Bluetooth printing isn't supported on this browser/device");
      return false;
    }
    try{
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: BT_PRINTER_SERVICE_UUIDS
      });
      const server = await device.gatt.connect();
      const characteristic = await findWritableCharacteristic(server);
      if(!characteristic) throw new Error("No writable characteristic found on this printer");
      btDevice = device;
      btCharacteristic = characteristic;
      device.addEventListener("gattserverdisconnected", ()=>{ btCharacteristic = null; });
      state.config.settings.printerName = device.name || "Bluetooth printer";
      state.config.settings.printerId = device.id;
      persistConfig();
      render();
      showToast("Printer connected: " + (device.name || ""));
      return true;
    }catch(e){
      if(e.name !== "NotFoundError") showToast("Couldn't connect to printer");
      return false;
    }
  }

  async function ensureBluetoothPrinter(){
    if(btCharacteristic) return true;
    // Try a silent reconnect to the last-paired printer (Chrome keeps prior grants per origin).
    if(navigator.bluetooth && navigator.bluetooth.getDevices && state.config.settings.printerId){
      try{
        const known = await navigator.bluetooth.getDevices();
        const match = known.find(d => d.id === state.config.settings.printerId);
        if(match){
          const server = await match.gatt.connect();
          const characteristic = await findWritableCharacteristic(server);
          if(characteristic){
            btDevice = match; btCharacteristic = characteristic;
            match.addEventListener("gattserverdisconnected", ()=>{ btCharacteristic = null; });
            return true;
          }
        }
      }catch(e){ /* fall through to explicit connect prompt */ }
    }
    return connectBluetoothPrinter();
  }

  async function sendToBluetoothPrinter(bytes){
    const ok = await ensureBluetoothPrinter();
    if(!ok || !btCharacteristic) return false;
    const CHUNK = 180; // keep well under typical BLE write payload limits
    try{
      for(let i=0;i<bytes.length;i+=CHUNK){
        const chunk = bytes.slice(i, i+CHUNK);
        if(btCharacteristic.properties.writeWithoutResponse) await btCharacteristic.writeValueWithoutResponse(chunk);
        else await btCharacteristic.writeValue(chunk);
      }
      return true;
    }catch(e){
      showToast("Print failed — check printer connection");
      btCharacteristic = null;
      return false;
    }
  }

  const RECEIPT_PRINT_CSS = `
    body{margin:0;}
    .receipt{font-family:'Courier New',Courier,monospace; font-size:13px; color:#000; width:100%; line-height:1.45;}
    .receipt .r-center{text-align:center;}
    .receipt .r-bold{font-weight:700;}
    .receipt .r-big{font-size:16px;}
    .receipt .r-row{display:flex; justify-content:space-between; gap:6px;}
    .receipt .small{font-size:11.5px;}
    .receipt .r-hr{border-top:1px dashed #000; margin:5px 0;}
    .receipt .kot-line{display:flex; gap:8px; font-size:15px; padding:2px 0;}
    .receipt .kot-line .q{font-weight:700; min-width:30px; flex-shrink:0;}
    .receipt .bill-head,.receipt .bill-item{display:flex; font-size:12.5px; padding:1px 0;}
    .receipt .bill-head{font-weight:700; border-bottom:1px solid #000; margin-bottom:3px;}
    .receipt .bi-name{flex:2; overflow-wrap:anywhere;}
    .receipt .bi-qty{flex:0.6; text-align:center;}
    .receipt .bi-amt{flex:1; text-align:right;}
    @page{ size:58mm auto; margin:2mm; }`;

  function nativePrintPlugin(){
    return (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()
      && window.Capacitor.Plugins && window.Capacitor.Plugins.KaapiPrint) || null;
  }

  async function printHtmlContent(receiptHtml, jobName, escposBytes){
    if(state.config.settings.directPrint && escposBytes){
      const ok = await sendToBluetoothPrinter(escposBytes);
      if(ok) return;
      // Direct print failed (not connected, unsupported, etc.) — fall back below.
    }
    const KaapiPrint = nativePrintPlugin();
    if(KaapiPrint){
      try{
        const fullHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><style>${RECEIPT_PRINT_CSS}</style></head><body>${receiptHtml}</body></html>`;
        await KaapiPrint.printHtml({html: fullHtml, jobName});
      }catch(e){
        console.error("native print failed", e);
        showToast("Print failed — check printer connection");
      }
      return;
    }
    // Web/PWA build (or native plugin unavailable): standard browser print dialog.
    document.getElementById("printArea").innerHTML = receiptHtml;
    setTimeout(()=>window.print(), 50);
  }

  function printKOT(order){
    if(!order || order.items.length===0){ showToast("Cart is empty"); return; }
    printHtmlContent(buildKOTHtml(order), "KOT - " + order.tableName, buildKOTEscPos(order));
  }

  function printBill(order){
    printHtmlContent(buildBillHtml(order), "Bill - " + order.tableName, buildBillEscPos(order));
  }

  /* ============ PAYMENT OVERLAY ============ */
  function openPayment(){
    const order = getOpenOrder(state.activeTableId);
    if(!order || order.items.length===0){ showToast("Cart is empty"); return; }
    state.sheet = null; renderSheet();
    state.paymentMethod = null;
    state.splitCash = ""; state.splitUpi = "";
    state.discountPercent = "";
    document.getElementById("paymentOverlay").classList.add("open");
    renderPayment();
    if(layerStack.length && layerStack[layerStack.length-1].type === "sheet"){
      replaceTopOverlay("payment", doClosePayment);
    } else {
      pushOverlay("payment", doClosePayment);
    }
  }
  function doClosePayment(){
    document.getElementById("paymentOverlay").classList.remove("open");
  }

  function renderPayment(){
    const order = getOpenOrder(state.activeTableId);
    if(!order){ closeTopOverlay(); return; }
    const subtotal = orderTotal(order);
    const discountOn = !!(state.config.settings && state.config.settings.discountEnabled);
    const disc = computeDiscount(subtotal, state.discountPercent);
    const total = discountOn ? disc.total : subtotal;
    document.getElementById("paymentSub").textContent = order.tableName;

    const methods = ["cash","upi","mixed"].map(m=>{
      const icon = m==="cash"?"💵":m==="upi"?"📱":"🔀";
      const label = m==="cash"?"Cash":m==="upi"?"UPI":"Split";
      return `<button class="pay-method ${state.paymentMethod===m?"active":""}" data-pay-method="${m}">
        <div class="picon">${icon}</div><div class="plabel">${label}</div>
      </button>`;
    }).join("");

    let splitHtml = "";
    let confirmDisabled = !state.paymentMethod;
    if(state.paymentMethod === "mixed"){
      const cashVal = parseFloat(state.splitCash)||0;
      const upiVal = parseFloat(state.splitUpi)||0;
      const remaining = +(total - cashVal - upiVal).toFixed(2);
      splitHtml = `
        <div class="split-inputs">
          <div class="split-field">
            <label>Cash amount</label>
            <input type="number" inputmode="decimal" id="splitCashInput" placeholder="0" value="${state.splitCash}">
          </div>
          <div class="split-field">
            <label>UPI amount</label>
            <input type="number" inputmode="decimal" id="splitUpiInput" placeholder="0" value="${state.splitUpi}">
          </div>
        </div>
        <div class="remaining-note ${remaining===0?"ok":"bad"}">
          ${remaining===0 ? "Amounts match the total ✓" : (remaining>0 ? `${money(remaining)} remaining` : `${money(Math.abs(remaining))} over the total`)}
        </div>`;
      confirmDisabled = remaining !== 0;
    }

    let discountHtml = "";
    let totalsHtml = `
      <div class="pay-total">
        <div class="label">Amount due</div>
        <div class="bigtotal">${money(total)}</div>
      </div>`;
    if(discountOn){
      discountHtml = `
        <div class="field" style="margin-top:0;">
          <label>Discount (%)</label>
          <input type="number" inputmode="decimal" min="0" max="100" id="discountInput" placeholder="0" value="${state.discountPercent}">
        </div>`;
      totalsHtml = `
        <div class="pay-total" style="text-align:left;">
          <div class="r-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>
          ${disc.amount>0 ? `<div class="r-row"><span>Discount (${disc.percent}%)</span><span>-${money(disc.amount)}</span></div>` : ""}
          <div class="r-row r-bold" style="margin-top:4px;"><span>Amount due</span><span>${money(total)}</span></div>
        </div>`;
    }

    document.getElementById("paymentBody").innerHTML = `
      ${totalsHtml}
      ${discountHtml}
      <div class="pay-methods">${methods}</div>
      ${splitHtml}
      <button class="btn btn-amber btn-block" id="confirmPaymentBtn" ${confirmDisabled?"disabled":""}>Confirm payment</button>
    `;
  }

  function confirmPayment(){
    const order = getOpenOrder(state.activeTableId);
    if(!order) return;
    const subtotal = orderTotal(order);
    const discountOn = !!(state.config.settings && state.config.settings.discountEnabled);
    const disc = computeDiscount(subtotal, state.discountPercent);
    const total = discountOn ? disc.total : subtotal;
    let payment;
    if(state.paymentMethod === "cash") payment = {method:"cash", cash:total, upi:0, total};
    else if(state.paymentMethod === "upi") payment = {method:"upi", cash:0, upi:total, total};
    else payment = {method:"mixed", cash:parseFloat(state.splitCash)||0, upi:parseFloat(state.splitUpi)||0, total};

    order.status = "paid";
    order.subtotal = subtotal;
    order.discount = (discountOn && disc.amount>0) ? {percent:disc.percent, amount:disc.amount} : null;
    order.total = total;
    order.payment = payment;
    order.paidAt = Date.now();
    order.invoiceNo = state.config.nextInvoiceNo || 1;
    state.config.nextInvoiceNo = (state.config.nextInvoiceNo || 1) + 1;
    persistOrders();
    pushCompletedOrders(); // order just moved from "open" to "paid" — sync it now
    persistConfig();
    renderPaymentSuccess(order);
  }

  function renderPaymentSuccess(order){
    document.getElementById("paymentSub").textContent = order.tableName;
    document.getElementById("paymentBody").innerHTML = `
      <div style="text-align:center; padding:34px 10px 10px;">
        <div style="font-size:46px;">✅</div>

  /* ============ MODAL (add/edit category/item/table) ============ */
  function openModal(type, data){
    state.modal = {type, data: data || {}};
    renderModal();
    pushOverlay("modal", doCloseModal);
  }
  function doCloseModal(){ state.modal = null; renderModal(); }

  function renderModal(preserveFocus){
    const root = document.getElementById("modalRoot");
    if(!state.modal){ root.innerHTML = ""; return; }
    const {type, data} = state.modal;
    let title, fields, showDelete=false;

    if(type === "category"){
      title = data.id ? "Edit category" : "Add category";
      fields = `<div class="field"><label>Category name</label><input type="text" id="mCatName" value="${escapeHtml(data.name||"")}" placeholder="e.g. Beverages"></div>`;
    } else if(type === "item"){
      title = data.id ? "Edit item" : "Add item";
      const opts = state.config.categories.map(c=>`<option value="${c.id}" ${data.categoryId===c.id?"selected":""}>${escapeHtml(c.name)}</option>`).join("");
      fields = `
        <div class="field"><label>Item name</label><input type="text" id="mItemName" value="${escapeHtml(data.name||"")}" placeholder="e.g. Cold Coffee"></div>
        <div class="field"><label>Price (₹)</label><input type="number" inputmode="decimal" id="mItemPrice" value="${data.price!==undefined?data.price:""}" placeholder="e.g. 60"></div>
        <div class="field"><label>Category</label><select id="mItemCat">${opts}</select></div>`;
    } else if(type === "table"){
      title = data.id ? "Edit table" : "Add table";
      fields = `<div class="field"><label>Table name</label><input type="text" id="mTableName" value="${escapeHtml(data.name||"")}" placeholder="e.g. Table 7"></div>`;
    } else if(type === "editBill"){
      title = "Edit saved bill";
      const newSubtotal = data.items.reduce((s,l)=>s+l.price*l.qty,0);
      const newTotal = data.discount ? +(newSubtotal - newSubtotal*data.discount.percent/100).toFixed(2) : newSubtotal;
      const lines = data.items.length ? data.items.map(l=>`
        <div class="cart-line">
          <div style="flex:1;">
            <div class="clname">${escapeHtml(l.name)}</div>
            <div class="clprice">${money(l.price)} each</div>
          </div>
          <div class="cart-lineprice">${money(l.price*l.qty)}</div>
          <div class="stepper">
            <button type="button" data-ebill-dec="${l.itemId}">−</button>
            <span>${l.qty}</span>
            <button type="button" data-ebill-inc="${l.itemId}">+</button>
          </div>
        </div>`).join("") : `<div style="padding:14px 0; color:var(--text-dim); font-size:14px;">No items left — add one below.</div>`;
      const itemOpts = state.config.items.map(i=>`<option value="${i.id}">${escapeHtml(i.name)} — ${money(i.price)}</option>`).join("");
      fields = `
        <div class="field">
          <label>Items</label>
          <div id="ebillLines">${lines}</div>
        </div>
        <div class="field">
          <label>Add item</label>
          <div style="display:flex; gap:8px;">
            <select id="ebillAddSelect" style="flex:1;">${itemOpts}</select>
            <button type="button" class="btn btn-outline" id="ebillAddBtn">Add</button>
          </div>
        </div>
        ${data.discount ? `<div class="r-row" style="margin-top:6px;"><span>Subtotal</span><span>${money(newSubtotal)}</span></div><div class="r-row"><span>Discount (${data.discount.percent}%)</span><span>-${money(+(newSubtotal*data.discount.percent/100).toFixed(2))}</span></div>` : ""}
        <div class="r-row r-bold" style="margin-top:6px;"><span>New total</span><span id="ebillNewTotal">${money(newTotal)}</span></div>
        <div style="color:var(--text-dim); font-size:12px; margin-top:4px;">Payment amount will be updated to match the new total.</div>`;
    } else if(type === "changePayment"){
      title = "Change payment mode";
      const methods = ["cash","upi","mixed"].map(m=>{
        const icon = m==="cash"?"💵":m==="upi"?"📱":"🔀";
        const label = m==="cash"?"Cash":m==="upi"?"UPI":"Split";
        return `<button type="button" class="pay-method ${data.method===m?"active":""}" data-pay-method-modal="${m}">
          <div class="picon">${icon}</div><div class="plabel">${label}</div>
        </button>`;
      }).join("");
      let splitHtml = "";
      if(data.method === "mixed"){
        const cashVal = parseFloat(data.cash)||0;
        const upiVal = parseFloat(data.upi)||0;
        const remaining = +(data.total - cashVal - upiVal).toFixed(2);
        splitHtml = `
          <div class="split-inputs">
            <div class="split-field"><label>Cash amount</label><input type="number" inputmode="decimal" id="mSplitCash" placeholder="0" value="${data.cash ? data.cash : ""}"></div>
            <div class="split-field"><label>UPI amount</label><input type="number" inputmode="decimal" id="mSplitUpi" placeholder="0" value="${data.upi ? data.upi : ""}"></div>
          </div>
          <div class="remaining-note ${remaining===0?"ok":"bad"}">
            ${remaining===0 ? "Amounts match the total ✓" : (remaining>0 ? `${money(remaining)} remaining` : `${money(Math.abs(remaining))} over the total`)}
          </div>`;
      }
      fields = `
        <div class="field"><label>Amount due</label><div class="bigtotal" style="font-size:20px;">${money(data.total)}</div></div>
        <div class="pay-methods">${methods}</div>
        ${splitHtml}`;
    } else if(type === "confirmDeleteOrder"){
      title = "Delete this sale?";
      fields = `<div style="color:var(--text-dim); font-size:14px; line-height:1.5;">
        This will permanently remove the ${money(data.total)} sale for <strong>${escapeHtml(data.tableName)}</strong> from your reports. This can't be undone.
      </div>`;
      showDelete = true;
    }

    root.innerHTML = `
      <div class="modal-backdrop" id="modalBackdrop">
        <div class="modal">
          <h3>${title}</h3>
          ${fields}
          <div class="modal-actions">
            <button class="btn btn-outline" id="modalCancel">Cancel</button>
            <button class="btn ${showDelete?"btn-danger":"btn-amber"}" id="modalSave">${showDelete?"Delete":"Save"}</button>
          </div>
        </div>
      </div>`;
    if(!preserveFocus){
      setTimeout(()=>{
        const firstInput = root.querySelector("input");
        if(firstInput) firstInput.focus();
      }, 50);
    }
  }

  function saveModal(){
    const {type, data} = state.modal;
    if(type === "category"){
      const name = document.getElementById("mCatName").value.trim();
      if(!name){ showToast("Enter a category name"); return; }
      if(data.id){
        const c = state.config.categories.find(c=>c.id===data.id);
        c.name = name;
      } else {
        state.config.categories.push({id:uid(), name});
      }
    } else if(type === "item"){
      const name = document.getElementById("mItemName").value.trim();
      const price = parseFloat(document.getElementById("mItemPrice").value);
      const categoryId = document.getElementById("mItemCat").value;
      if(!name){ showToast("Enter an item name"); return; }
      if(isNaN(price) || price < 0){ showToast("Enter a valid price"); return; }
      if(data.id){
        const it = state.config.items.find(i=>i.id===data.id);
        it.name = name; it.price = price; it.categoryId = categoryId;
      } else {
        state.config.items.push({id:uid(), name, price, categoryId});
      }
    } else if(type === "table"){
      const name = document.getElementById("mTableName").value.trim();
      if(!name){ showToast("Enter a table name"); return; }
      if(data.id){
        const t = state.config.tables.find(t=>t.id===data.id);
        t.name = name;
      } else {
        state.config.tables.push({id:uid(), name});
      }
    } else if(type === "editBill"){
      if(data.items.length === 0){ showToast("Bill must have at least one item"); return; }
      const order = state.orders.find(o=>o.id===data.orderId);
      if(!order){ showToast("Couldn't find that bill"); closeTopOverlay(); return; }
      const newSubtotal = data.items.reduce((s,l)=>s+l.price*l.qty,0);
      const newTotal = data.discount ? +(newSubtotal - newSubtotal*data.discount.percent/100).toFixed(2) : newSubtotal;
      order.items = data.items.map(l=>({...l}));
      order.subtotal = newSubtotal;
      if(order.discount){ order.discount.amount = +(newSubtotal - newTotal).toFixed(2); }
      order.total = newTotal;
      if(order.payment){
        if(order.payment.method === "cash"){ order.payment.cash = newTotal; order.payment.total = newTotal; }
        else if(order.payment.method === "upi"){ order.payment.upi = newTotal; order.payment.total = newTotal; }
        else {
          // Mixed/split payment: previously this only updated payment.total, leaving the
          // cash/upi split at its pre-edit amounts -- so editing a split-paid bill made
          // cash+upi silently stop matching the new total (wrong cash-drawer reconciliation
          // in Reports and on any reprinted bill). Rescale cash/upi to keep the original
          // split ratio while guaranteeing cash+upi === newTotal exactly.
          const oldTotal = order.payment.total || (order.payment.cash + order.payment.upi) || 0;
          const cashShare = oldTotal > 0 ? order.payment.cash / oldTotal : 0.5;
          const newCash = Math.round(newTotal * cashShare * 100) / 100;
          order.payment.cash = newCash;
          order.payment.upi = +(newTotal - newCash).toFixed(2);
          order.payment.total = newTotal;
        }
      }
      order.editedAt = Date.now();
      persistOrders();
      pushCompletedOrders(); // editing an already-saved bill — resync to other devices
      render();
      closeTopOverlay();
      showToast("Bill updated");
      return;
    } else if(type === "changePayment"){
      const order = state.orders.find(o=>o.id===data.orderId);
      if(!order){ showToast("Couldn't find that bill"); closeTopOverlay(); return; }
      if(!data.method){ showToast("Choose a payment mode"); return; }
      let payment;
      if(data.method === "cash") payment = {method:"cash", cash:order.total, upi:0, total:order.total};
      else if(data.method === "upi") payment = {method:"upi", cash:0, upi:order.total, total:order.total};
      else {
        const cashVal = parseFloat(data.cash)||0;
        const upiVal = parseFloat(data.upi)||0;
        const remaining = +(order.total - cashVal - upiVal).toFixed(2);
        if(remaining !== 0){ showToast("Cash + UPI must equal the total"); return; }
        payment = {method:"mixed", cash:cashVal, upi:upiVal, total:order.total};
      }
      order.payment = payment;
      order.editedAt = Date.now();
      persistOrders();
      pushCompletedOrders(); // payment mode changed on a saved sale — resync to other devices
      render();
      closeTopOverlay();
      showToast("Payment mode updated");
      return;
    } else if(type === "confirmDeleteOrder"){
      state.orders = state.orders.filter(o=>o.id!==data.orderId);
      markOrderDeleted(data.orderId);
      if(state.expandedOrderId === data.orderId) state.expandedOrderId = null;
      persistOrders();
      persistDeletedOrderIds(); // tombstone the id so no device (including this one) resyncs the old sale back
      pushCompletedOrders(); // a saved sale was deleted — resync to other devices
      render();
      closeTopOverlay();
      showToast("Sale deleted");
      return;
    }
    persistConfig();
    render();
    closeTopOverlay();
  }

  function deleteCategory(id){
    if(itemsInCategory(id).length > 0){
      showToast("Move or delete its items first");
      return;
    }
    state.config.categories = state.config.categories.filter(c=>c.id!==id);
    persistConfig(); render();
  }
  function deleteItem(id){
    state.config.items = state.config.items.filter(i=>i.id!==id);
    persistConfig(); render();
  }
  function deleteTable(id){
    if(getOpenOrder(id)){ showToast("Table has an open order"); return; }
    state.config.tables = state.config.tables.filter(t=>t.id!==id);
    persistConfig(); render();
  }

  function onModalInput(e){
    if(!state.modal || state.modal.type !== "changePayment") return;
    const data = state.modal.data;
    if(e.target.id === "mSplitCash"){ data.cash = e.target.value; renderModalKeepFocus("mSplitCash"); }
    if(e.target.id === "mSplitUpi"){ data.upi = e.target.value; renderModalKeepFocus("mSplitUpi"); }
  }
  function renderModalKeepFocus(id){
    renderModal(true);
    const el = document.getElementById(id);
    if(el){ el.focus(); const v = el.value; el.value=""; el.value=v; }
  }

  function onViewClick(e){
    const printOrderBtnEarly = e.target.closest("[data-print-order]");
    if(printOrderBtnEarly){
      const ord = state.orders.find(o=>o.id===printOrderBtnEarly.dataset.printOrder);
      if(ord) printBill(ord);
      return;
    }

    const editBillBtnEarly = e.target.closest("[data-edit-bill-order]");
    if(editBillBtnEarly){
      const ord = state.orders.find(o=>o.id===editBillBtnEarly.dataset.editBillOrder);
      if(ord) openModal("editBill", {orderId: ord.id, items: ord.items.map(l=>({...l})), discount: ord.discount ? {...ord.discount} : null});
      return;
    }

    const changePaymentBtnEarly = e.target.closest("[data-change-payment-order]");
    if(changePaymentBtnEarly){
      const ord = state.orders.find(o=>o.id===changePaymentBtnEarly.dataset.changePaymentOrder);
      if(ord) openModal("changePayment", {orderId: ord.id, method: ord.payment.method, cash: ord.payment.cash||0, upi: ord.payment.upi||0, total: ord.total});
      return;
    }

    const deleteOrderBtnEarly = e.target.closest("[data-delete-order]");
    if(deleteOrderBtnEarly){
      const ord = state.orders.find(o=>o.id===deleteOrderBtnEarly.dataset.deleteOrder);
      if(ord) openModal("confirmDeleteOrder", {orderId: ord.id, tableName: ord.tableName, total: ord.total});
      return;
    }

    const openTable = e.target.closest("[data-open-table]");
    if(openTable){ openBilling(openTable.dataset.openTable); return; }

    const menuSub = e.target.closest("[data-menusub]");
    if(menuSub){ state.menuSub = menuSub.dataset.menusub; render(); return; }

    const rangeBtn = e.target.closest("[data-report-range]");
    if(rangeBtn){ state.reportRange = rangeBtn.dataset.reportRange; render(); return; }

    const toggleOrder = e.target.closest("[data-toggle-order]");
    if(toggleOrder){
      const id = toggleOrder.dataset.toggleOrder;
      state.expandedOrderId = state.expandedOrderId === id ? null : id;
      render(); return;
    }

    if(e.target.closest("[data-add-category]")) return openModal("category", {});
    const editCat = e.target.closest("[data-edit-category]");
    if(editCat) return openModal("category", state.config.categories.find(c=>c.id===editCat.dataset.editCategory));
    const delCat = e.target.closest("[data-delete-category]");
    if(delCat) return deleteCategory(delCat.dataset.deleteCategory);

    if(e.target.closest("[data-add-item]")) return openModal("item", {categoryId: state.config.categories[0] ? state.config.categories[0].id : ""});
    const editItem = e.target.closest("[data-edit-item]");
    if(editItem) return openModal("item", state.config.items.find(i=>i.id===editItem.dataset.editItem));
    const delItem = e.target.closest("[data-delete-item]");
    if(delItem) return deleteItem(delItem.dataset.deleteItem);

    if(e.target.closest("[data-add-table]")) return openModal("table", {});
    const editTable = e.target.closest("[data-edit-table]");
    if(editTable) return openModal("table", state.config.tables.find(t=>t.id===editTable.dataset.editTable));
    const delTable = e.target.closest("[data-delete-table]");
    if(delTable && !delTable.disabled) return deleteTable(delTable.dataset.deleteTable);

    const dateInput = e.target.id === "reportDateInput" ? e.target : null;
    if(dateInput){ /* handled by change listener below */ }

    if(e.target.closest("[data-save-settings]")){
      state.config.settings = {
        ...state.config.settings,
        cafeName: document.getElementById("sCafeName").value.trim() || "Kaapi Cafe",
        address: document.getElementById("sAddress").value.trim(),
        phone: document.getElementById("sPhone").value.trim(),
        footerNote: document.getElementById("sFooter").value.trim() || "Thank you! Visit again"
      };
      persistConfig();
      showToast("Details saved");
      return;
    }

    if(e.target.closest("[data-toggle-direct-print]")){
      state.config.settings.directPrint = !state.config.settings.directPrint;
      persistConfig();
      render();
      return;
    }

    if(e.target.closest("[data-toggle-discount]")){
      state.config.settings.discountEnabled = !state.config.settings.discountEnabled;
      persistConfig();
      render();
      return;
    }

    if(e.target.closest("[data-connect-printer]")){
      connectBluetoothPrinter();
      return;
    }
  }

  function onSheetClick(e){

      closeTopOverlay(); return;
    }
    const inc = e.target.closest("[data-cart-inc]");
    if(inc){ changeCartQty(inc.dataset.cartInc, 1); return; }

    if(dec){ changeCartQty(dec.dataset.cartDec, -1); return; }

  function onPaymentClick(e){
    const m = e.target.closest("[data-pay-method]");
    if(m){ state.paymentMethod = m.dataset.payMethod; renderPayment(); return; }
    if(e.target.id === "confirmPaymentBtn" && !e.target.disabled){ confirmPayment(); return; }
    if(e.target.id === "printBillBtn"){ printBill(state.completedOrder); return; }
    if(e.target.id === "paymentDoneBtn"){ showToast("Table freed"); closeOverlaysCount(layerStack.length); return; }
  }
  function onPaymentInput(e){
    if(e.target.id === "splitCashInput"){ state.splitCash = e.target.value; renderPaymentKeepFocus("splitCashInput"); }
    if(e.target.id === "splitUpiInput"){ state.splitUpi = e.target.value; renderPaymentKeepFocus("splitUpiInput"); }
    if(e.target.id === "discountInput"){ state.discountPercent = e.target.value; renderPaymentKeepFocus("discountInput"); }
  }
  function renderPaymentKeepFocus(id){
    renderPayment();
    const el = document.getElementById(id);
    if(el){ el.focus(); const v = el.value; el.value=""; el.value=v; }
  }

  function onModalClick(e){
    if(e.target.id === "modalBackdrop" || e.target.id === "modalCancel"){ closeTopOverlay(); return; }
    if(e.target.id === "modalSave"){ saveModal(); return; }

    if(state.modal && state.modal.type === "changePayment"){
      const m = e.target.closest("[data-pay-method-modal]");
      if(m){
        const data = state.modal.data;
        data.method = m.dataset.payMethodModal;
        if(data.method === "cash"){ data.cash = data.total; data.upi = 0; }
        else if(data.method === "upi"){ data.upi = data.total; data.cash = 0; }
        else if(data.method === "mixed" && !parseFloat(data.cash) && !parseFloat(data.upi)){ data.cash = data.total; data.upi = 0; }
        renderModal();
        return;
      }
    }

    if(state.modal && state.modal.type === "editBill"){
      const inc = e.target.closest("[data-ebill-inc]");
      if(inc){
        const itemId = inc.dataset.ebillInc;
        const line = state.modal.data.items.find(l=>l.itemId===itemId);
        if(line) line.qty += 1;
        renderModal();
        return;
      }
      const dec = e.target.closest("[data-ebill-dec]");
      if(dec){
        const itemId = dec.dataset.ebillDec;
        const line = state.modal.data.items.find(l=>l.itemId===itemId);
        if(line){
          line.qty -= 1;
          if(line.qty <= 0) state.modal.data.items = state.modal.data.items.filter(l=>l.itemId!==itemId);
        }
        renderModal();
        return;
      }
      if(e.target.id === "ebillAddBtn"){
        const select = document.getElementById("ebillAddSelect");
        const itemId = select.value;
        const item = state.config.items.find(i=>i.id===itemId);
        if(!item) return;
        const line = state.modal.data.items.find(l=>l.itemId===itemId);
        if(line) line.qty += 1;
        else state.modal.data.items.push({itemId:item.id, name:item.name, price:item.price, qty:1});
        renderModal();
        return;
      }
    }
  }

  // ---- Auto PWA install prompt (mobile only) ----
  (function(){
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(!isMobile) return;

    const isStandalone = window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone === true;
    if(isStandalone) return;

    const DISMISS_KEY = "kaapiInstallPromptDismissedAt";
    const lastDismiss = Number(localStorage.getItem(DISMISS_KEY) || 0);
    const daysSinceDismiss = (Date.now() - lastDismiss) / 86400000;
    if(lastDismiss && daysSinceDismiss < 7) return;

    let deferredPrompt = null;
    const ua = navigator.userAgent;
    const isIOSDevice = /iPhone|iPad|iPod/i.test(ua);
    // Only real Safari supports "Add to Home Screen" from the Share sheet.
    // Exclude Chrome/Firefox/Edge on iOS (they're all Safari-engine wrappers
    // without that menu item) and in-app browsers (Instagram, FB, TikTok, etc.)
    const isOtherIOSBrowser = /CriOS|FxiOS|EdgiOS|OPiOS|mercury/i.test(ua);
    const isInAppBrowser = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|TikTok|Snapchat/i.test(ua);
    const isIOS = isIOSDevice && !isOtherIOSBrowser && !isInAppBrowser;
    // iOS device but not a browser that can install — skip silently, no banner at all.
    if(isIOSDevice && !isIOS) return;

    function showBanner({onInstall, iosHint}){
      const banner = document.createElement("div");
      banner.id = "pwaInstallBanner";
      banner.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;"
        + "background:#171110;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:14px;"
        + "padding:12px 14px;display:flex;align-items:center;gap:10px;"
        + "box-shadow:0 8px 24px rgba(0,0,0,.35);font-family:inherit;font-size:14px;";

      const icon = document.createElement("img");
      icon.src = "icon-192.png";
      icon.alt = "";
      icon.style.cssText = "width:36px;height:36px;border-radius:8px;flex-shrink:0;";

      const text = document.createElement("div");
      text.style.cssText = "flex:1;line-height:1.3;";
      text.innerHTML = iosHint
        ? "Install Froolla: tap <strong>Share</strong> then <strong>Add to Home Screen</strong>."
        : "Install Froolla for quick, full-screen access.";

      const closeBtn = document.createElement("button");
      closeBtn.textContent = "✕";
      closeBtn.style.cssText = "background:none;border:none;color:#fff;opacity:.7;font-size:16px;"
        + "padding:4px 6px;cursor:pointer;flex-shrink:0;";
      closeBtn.onclick = () => {
        localStorage.setItem(DISMISS_KEY, String(Date.now()));
        banner.remove();
      };

      banner.appendChild(icon);
      banner.appendChild(text);

      if(!iosHint){
        const installBtn = document.createElement("button");
        installBtn.textContent = "Install";
        installBtn.style.cssText = "background:#fff;color:#171110;border:none;border-radius:10px;"
          + "padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;flex-shrink:0;";
        installBtn.onclick = async () => {
          banner.remove();
          if(!onInstall) return;
          await onInstall();
        };
        banner.appendChild(installBtn);
      }

      banner.appendChild(closeBtn);
      document.body.appendChild(banner);
    }

    if(isIOS){
      // iOS has no install API — show an instructional banner shortly after load.
      window.addEventListener("load", () => {
        setTimeout(() => showBanner({ iosHint: true }), 1500);
      });
      return;
    }

    // Android/Chrome: capture the native prompt and trigger it automatically.
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(async () => {
        if(!deferredPrompt) return;
        try{
          await deferredPrompt.prompt();
          const choice = await deferredPrompt.userChoice;
          if(choice.outcome !== "accepted"){
            localStorage.setItem(DISMISS_KEY, String(Date.now()));
          }
        }catch(err){
          // Auto-prompt blocked by browser (no gesture) — fall back to a tappable banner.
          showBanner({ onInstall: async () => {
            if(!deferredPrompt) return;
            await deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
          }});
        }
        deferredPrompt = null;
      }, 1500);
    });

    window.addEventListener("appinstalled", () => {
      localStorage.removeItem(DISMISS_KEY);
    });
  })();
})();
</script>
</body>
</html>
