  /* ============ ADMIN: Backup & Restore ============
     A backup is one JSON file with the menu, tables, settings, business days, every order/sale and
     the cashbook (user accounts and passwords are NOT included). Restoring uploads the file to a
     staging area and then swaps it in inside ONE database transaction - it either fully succeeds
     or changes nothing. A safety copy of the current data is downloaded automatically first. */
  const LAST_BACKUP_KEY = "mycafe-last-backup";           // this device only, not sensitive
  const BACKUP_STALE_DAYS = 7;
  function lastBackupAt(){ try{ return Number(localStorage.getItem(LAST_BACKUP_KEY)) || 0; }catch(_){ return 0; } }
  function bkState(){
    if(!state.backup) state.backup = {busy:false, error:"", status:"", doc:null, summary:null, fileName:"", confirm:""};
    return state.backup;
  }
  function setBackupStatus(text){            // update the progress line without rebuilding the screen
    const b = bkState(); b.status = text;
    const el = $id("backupStatus"); if(el) el.textContent = text;
  }
  function backupFileName(tag){
    const d = new Date(), p = (n) => String(n).padStart(2,"0");
    const cafe = ((state.config && state.config.settings && state.config.settings.cafeName) || "pos").toLowerCase().replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"") || "pos";
    return `${cafe}-backup-${d.getFullYear()}-${p(d.getMonth()+1)}-${p(d.getDate())}-${p(d.getHours())}${p(d.getMinutes())}${tag?"-"+tag:""}.json`;
  }
  function downloadJson(doc, filename){
    const blob = new Blob([JSON.stringify(doc)], {type:"application/json"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url; a.download = filename; a.style.display = "none";
    document.body.appendChild(a); a.click();
    setTimeout(()=>{ a.remove(); URL.revokeObjectURL(url); }, 4000);
  }

  function renderBackupTab(){
    if(!Authz.canManageBackup()) return emptyState("🔒","Access denied","Only an Admin can back up or restore data.");
    const b = bkState();
    const last = lastBackupAt();
    const days = last ? Math.floor((Date.now()-last)/86400000) : null;
    const stale = !last || days >= BACKUP_STALE_DAYS;
    const lastLine = last
      ? `Last backup from this device: ${fmtDateTime(last)}${days>0 ? ` (${days} day${days===1?"":"s"} ago)` : " (today)"}`
      : "No backup has been made from this device yet.";

    let summaryHtml = "";
    if(b.summary){
      const m = b.summary, c = m.counts;
      const row = (k,v) => `<div style="display:flex; justify-content:space-between; gap:12px; padding:5px 0; border-bottom:1px solid var(--border); font-size:13px;"><span style="color:var(--text-dim);">${k}</span><span style="font-weight:600; text-align:right;">${v}</span></div>`;
      summaryHtml = `
        <div class="cat-chip-header">This file contains</div>
        <div class="list-row" style="display:block;">
          ${row("File", escapeHtml(b.fileName))}
          ${row("Created", m.createdAt ? fmtDateTime(Date.parse(m.createdAt)) : "—")}
          ${m.createdBy ? row("Created by", escapeHtml(m.createdBy)) : ""}
          ${m.outlet && m.outlet.name ? row("Outlet", escapeHtml(m.outlet.name)) : ""}
          ${row("Completed sales", `${m.paidSales} · ${money(m.paidTotal)}`)}
          ${m.firstSale ? row("Sales period", `${fmtShortDate(m.firstSale)} – ${fmtShortDate(m.lastSale)}`) : ""}
          ${m.openOrders ? row("Open orders", m.openOrders) : ""}
          ${row("Menu items / categories", `${c.products} / ${c.categories}`)}
          ${row("Tables", c.dining_tables)}
          ${row("Cashbook entries", c.cashbook_entries)}
          ${row("File check", m.checksumVerified ? "✅ intact" : "— (older file, no checksum)")}
        </div>
        <div style="background:rgba(196,87,59,0.12); color:#e79080; border-radius:var(--radius-md); padding:12px 14px; font-size:13px; line-height:1.5; margin:12px 0;">
          <b>This replaces ALL current menu, tables, settings, sales and cashbook data</b> with the contents of this file.
          User accounts and passwords are not touched. A safety backup of the current data is downloaded automatically first.
          Make sure no one is billing on another device, and ask them to refresh afterwards.
        </div>
        <div class="field"><label>Type RESTORE to confirm</label>
          <input type="text" id="backupConfirm" value="${escapeHtml(b.confirm)}" autocomplete="off" autocapitalize="characters" spellcheck="false" ${b.busy?"disabled":""}></div>
        <button class="btn btn-danger btn-block" id="backupRestoreBtn" ${b.busy || b.confirm.trim().toUpperCase()!=="RESTORE" ? "disabled" : ""}>♻️ Restore this backup</button>
        <button class="btn btn-outline btn-block" style="margin-top:8px;" data-backup-clear ${b.busy?"disabled":""}>Cancel</button>`;
    }

    return `
      <div class="cat-chip-header" style="margin-top:0;">Back up</div>
      <div class="list-row" style="display:block; ${stale ? "border-color:#b45309;" : ""}">
        <div class="rtitle">🗄️ Download a backup</div>
        <div class="rsub" style="margin:4px 0 12px; line-height:1.5;">Saves your menu, tables, settings, every sale and the cashbook into one file. Keep copies somewhere safe (Google Drive, email to yourself, a USB stick).</div>
        <div class="rsub" style="margin-bottom:12px; ${stale ? "color:#fbbf24;" : ""}">${stale ? "⚠️ " : ""}${escapeHtml(lastLine)}${stale && last ? " — time for a new one." : ""}</div>
        <button class="btn btn-amber btn-block" id="backupDownloadBtn" ${b.busy?"disabled":""}>⬇️ Download backup now</button>
      </div>

      <div class="cat-chip-header">Restore</div>
      <div class="list-row" style="display:block;">
        <div class="rtitle">♻️ Restore from a backup file</div>
        <div class="rsub" style="margin:4px 0 12px; line-height:1.5;">Pick a backup file made by this app. You will see what it contains and must confirm before anything changes.</div>
        <input type="file" id="backupFile" accept=".json,application/json" style="display:none;">
        <label for="backupFile" class="btn btn-outline btn-block" style="${b.busy?"opacity:.5; pointer-events:none;":""}">📂 ${b.summary ? "Choose a different file" : "Choose backup file"}</label>
      </div>
      ${summaryHtml}
      <div id="backupStatus" class="hint-text" style="margin-top:12px; ${b.error ? "color:#e79080;" : ""}" role="status">${escapeHtml(b.error || b.status || "")}</div>
      <div class="hint-text">Backups never include user accounts or passwords. Order history in a backup is the complete history of this outlet at that moment.</div>`;
  }

  async function runBackupDownload(){
    if(!need("backup.manage")) return;
    const b = bkState(); if(b.busy) return;
    b.busy = true; b.error = ""; b.status = "Starting…"; render();
    try{
      const u = Authz.user();
      const doc = await DL.exportBackup((label)=> setBackupStatus("Reading " + label + "…"), u ? u.displayName : null);
      downloadJson(doc, backupFileName());
      try{ localStorage.setItem(LAST_BACKUP_KEY, String(Date.now())); }catch(_){ /* storage blocked */ }
      b.status = `Backup saved: ${doc.paidSales} sales, ${doc.counts.products} items, ${doc.counts.cashbook_entries} cashbook entries.`;
      showToast("Backup downloaded");
    }catch(e){
      b.error = e.denied ? "You don't have permission to make a backup." : (e.message || "Backup failed");
      b.status = "";
    }finally{ b.busy = false; render(); }
  }

  async function onBackupFileChosen(file){
    if(!need("backup.manage")) return;
    const b = bkState(); if(b.busy || !file) return;
    b.error = ""; b.status = ""; b.doc = null; b.summary = null; b.confirm = ""; b.fileName = file.name;
    try{
      if(file.size > 200*1024*1024) throw new Error("That file is too large to be a backup of this app.");
      let doc;
      try{ doc = JSON.parse(await file.text()); }
      catch(_){ throw new Error("That file isn't a valid backup (it can't be read as JSON)."); }
      b.summary = await DL.inspectBackup(doc);
      b.doc = doc;
    }catch(e){ b.error = e.message || "Couldn't read that file."; }
    render();
  }

  async function runRestore(){
    if(!need("backup.manage")) return;
    const b = bkState();
    if(b.busy || !b.doc || b.confirm.trim().toUpperCase() !== "RESTORE") return;
    b.busy = true; b.error = ""; render();
    let applied = false;
    try{
      // 1) safety copy of what is there now - if this fails we stop before touching anything
      setBackupStatus("Saving a safety backup of the current data…");
      let safety;
      try{
        const u = Authz.user();
        safety = await DL.exportBackup((label)=> setBackupStatus("Safety backup: reading " + label + "…"), u ? u.displayName : null);
        downloadJson(safety, backupFileName("BEFORE-RESTORE"));
      }catch(e){
        throw new Error("Couldn't make the safety backup, so nothing was restored. " + (e.message || ""));
      }
      // 2) upload + atomic swap
      await DL.restoreBackup(b.doc, (label, done, total)=> setBackupStatus(`${label}… (${Math.min(done+1,total)}/${total})`));
      applied = true;
      b.doc = null; b.summary = null; b.confirm = "";
      b.status = "✅ Restored. Reloading…";
      showToast("Backup restored");
      render();
      setTimeout(()=> location.reload(), 1200);
    }catch(e){
      b.error = (e.denied ? "You don't have permission to restore." : (e.message || "Restore failed")) + (applied ? "" : " — your current data was not changed.");
      b.status = "";
    }finally{
      if(!applied){ b.busy = false; render(); }
    }
  }

  async function saveUserModal(type, data){

    try{

        const email = $id("mUserEmail").value.trim();

        const password = $id("mUserPassword").value;

        const okLogin = email.includes("@") ? /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) : /^[a-z0-9][a-z0-9._-]{1,29}$/i.test(email);
        if(!okLogin){ showToast("Enter a username (letters/numbers) or a valid email"); return false; }
        if(password.length < 8){ showToast("Password must be at least 8 characters"); return false; }
        await Auth.adminUsers("create_user", {display_name: name, email, password, role});
        showToast("User created — they can sign in now");

        await Auth.adminUsers("set_password", {user_id: data.id, password});
        showToast("Password changed");
      } else if(type === "renameUser"){

        if(!name){ showToast("Enter a name"); return false; }
        await Auth.adminUsers("rename", {user_id: data.id, display_name: name});
        showToast("Name updated");

        await Auth.adminUsers("set_status", {user_id: data.id, status: data.to});
        showToast(data.to === "disabled" ? "User disabled" : "User enabled");

        showToast("Password reset email sent");

    }

  /* ============ KOT DISPLAY (Kitchen) ============
     Every table's bill shows up here automatically as soon as items are added to
     its cart (see ensureKotSync, called from addToCart/changeCartQty) — no manual
     step required. The 🧾 button on a table's bill (sendOrderToKitchen) is now just
     for re-printing/re-flagging a ticket, e.g. after the kitchen already marked it
     "prepared" and more items came in. */
  function activeKotOrders(){
    return state.orders
      .filter(o => o.status === "open" && o.kot && o.items.length > 0)
      .sort((a,b) => (a.kot.sentAt||0) - (b.kot.sentAt||0));
  }
  function updateKotNavBadge(){
    const dot = document.getElementById("kotNavDot");
    if(!dot) return;
    const pending = activeKotOrders().filter(o => o.kot.status !== "prepared").length;
    dot.style.display = pending > 0 ? "flex" : "none";
    dot.textContent = pending > 9 ? "9+" : String(pending);
  }
  let kotPollTimer = null;
  function manageKotPolling(){
    if(state.tab === "kot"){
      if(!kotPollTimer) kotPollTimer = setInterval(()=>{ syncFromCloud({ordersOnly:true}).catch(()=>{}); }, 5000);
    } else if(kotPollTimer){
      clearInterval(kotPollTimer);
      kotPollTimer = null;
    }
  }
  // Called whenever a table's cart changes (item added or qty bumped up). Keeps the
  // kitchen display in sync automatically — creates the kot entry the first time an
  // order gets items, so nothing needs a manual "send to kitchen" tap. If the kitchen
  // had already marked it "prepared", flag it as new again so the extra/changed items
  // don't get missed; leave "new"/"preparing" orders alone since the item list on
  // screen updates live either way.
  function ensureKotSync(order){
    if(!order) return;
    if(!order.kot){
      const now = Date.now();
      order.kot = {status:"new", sentAt:now, updatedAt:now};
    } else if(order.kot.status === "prepared"){
      order.kot.status = "new";
      order.kot.sentAt = order.kot.updatedAt = Date.now();   // new batch: restart the kitchen timer
      delete order.kot.batch;
    }
  }
  // Quantities per item the kitchen has already prepared on this bill, and what is still waiting.
  function kotQtyMap(order){
    const m = {};
    order.items.forEach(l => { m[l.itemId] = (m[l.itemId] || 0) + l.qty; });
    return m;
  }
  function kotPendingLines(order){
    const done = (order.kot && order.kot.done) || {};
    return order.items
      .map(l => ({...l, qty: l.qty - (done[l.itemId] || 0)}))
      .filter(l => l.qty > 0);
  }
  function sendOrderToKitchen(order){
    if(!order || order.items.length === 0) return;
    const now = Date.now();
    if(!order.kot){
      order.kot = {status:"new", sentAt:now, updatedAt:now};
    } else {
      // Re-sending (e.g. tapped again after adding more items) bumps it back to
      // the top of the queue as "new" so the kitchen notices the update.
      if(order.kot.status === "prepared"){ order.kot.sentAt = now; delete order.kot.batch; }
      order.kot.status = "new";
      order.kot.updatedAt = now;
    }
    pushOrders();
    showToast("Sent to kitchen display");
    render();
  }
  function advanceKotStatus(orderId){
    const order = state.orders.find(o=>o.id===orderId);
    if(!order || !order.kot) return;
    if(order.kot.status === "new") order.kot.status = "preparing";
    else if(order.kot.status === "preparing"){
      // Remember exactly what was prepared, so items added later show up on their own.
      order.kot.batch = kotPendingLines(order).map(l => ({name:l.name, qty:l.qty, note:l.note || ""}));
      order.kot.prevDone = order.kot.done || {};
      order.kot.done = kotQtyMap(order);
      order.kot.status = "prepared";
    }
    order.kot.updatedAt = Date.now();
    pushOrders();
    render();
  }
  function revertKotStatus(orderId){
    const order = state.orders.find(o=>o.id===orderId);
    if(!order || !order.kot) return;
    if(order.kot.status === "prepared"){
      order.kot.status = "preparing";
      order.kot.done = order.kot.prevDone || {};            // those items are pending again
      delete order.kot.prevDone; delete order.kot.batch;
    }
    else if(order.kot.status === "preparing") order.kot.status = "new";
    order.kot.updatedAt = Date.now();
    pushOrders();
    render();
  }
  // Removes the order from the kitchen display without touching the table/bill itself —
  // used once the food's been served and there's nothing left to track on this screen.
  function clearKotOrder(orderId){
    const order = state.orders.find(o=>o.id===orderId);
    if(!order || order.status === "open") return;   // only after the bill is paid / cancelled
    delete order.kot;
    pushOrders();
    render();
  }
  // "By item" view: everything still waiting to be cooked, grouped by menu category, with the
  // same item from different tables added together (e.g. "Masala Chai  5" — T1 ×2 · T4 ×3).
  function renderKotItemsView(orders){
    const cats = state.config.categories || [];
    const catOf = new Map(state.config.items.map(i => [i.id, i.categoryId]));
    const groups = new Map();   // categoryId -> Map(itemId -> {name, total, tables:Map, notes:[]})
    orders.forEach(o => {
      kotPendingLines(o).forEach(l => {
        const cid = catOf.has(l.itemId) ? catOf.get(l.itemId) : "__other";
        if(!groups.has(cid)) groups.set(cid, new Map());
        const g = groups.get(cid);
        if(!g.has(l.itemId)) g.set(l.itemId, {name:l.name, total:0, tables:new Map(), notes:[]});
        const e = g.get(l.itemId);
        e.total += l.qty;
        e.tables.set(o.tableName, (e.tables.get(o.tableName) || 0) + l.qty);
        if(l.note) e.notes.push(o.tableName + ": " + l.note);
      });
    });
    if(groups.size === 0) return emptyState("✅","Nothing waiting","Everything on the kitchen screen has been prepared.");
    const order = cats.map(c => [c.id, c.name]);
    if(groups.has("__other")) order.push(["__other","Other"]);
    const html = order.filter(([id]) => groups.has(id)).map(([id, name]) => {
      const rows = [...groups.get(id).values()].sort((a,b) => b.total - a.total || a.name.localeCompare(b.name)).map(e => `
        <div class="kot-item">
          <div class="kihead"><span class="kicount">${e.total}×</span><span class="kiname">${escapeHtml(e.name)}</span></div>
          <div class="kitables">${[...e.tables].map(([t,q]) => `<span class="kitable">${escapeHtml(t)} <b>×${q}</b></span>`).join("")}</div>
          ${e.notes.map(n => `<div class="kinote">↳ ${escapeHtml(n)}</div>`).join("")}
        </div>`).join("");
      return `<div class="kot-cat">${escapeHtml(name)}</div>${rows}`;
    }).join("");
    return html;
  }
  function renderKotTab(){
    const orders = activeKotOrders();
    const seg = `<div class="segmented">
      <button data-kot-view="tables" class="${state.kotView!=="items"?"active":""}">By table</button>
      <button data-kot-view="items" class="${state.kotView==="items"?"active":""}">By item</button>
    </div>`;
    if(orders.length === 0){
      return emptyState("🍳","No active kitchen orders","Orders show up here automatically as soon as items are added to a table's bill.");
    }
    if(state.kotView === "items") return seg + renderKotItemsView(orders);
    const statusLabel = {new:"New", preparing:"Preparing", prepared:"Prepared"};
    const cards = orders.map(o=>{
      // Only what still needs cooking: items already marked prepared are hidden when more are added to the same bill.
      const line = (l, cls) => `<li class="${cls}"><span class="kq">${l.qty}x</span><span>${escapeHtml(l.name)}</span></li>${l.note ? `<div class="knote">↳ ${escapeHtml(l.note)}</div>` : ""}`;
      const pending = kotPendingLines(o);
      const doneMap = o.kot.done || {};
      const completed = o.items
        .map(l => ({...l, qty: Math.min(l.qty, doneMap[l.itemId] || 0)}))
        .filter(l => l.qty > 0);
      let itemsHtml = pending.map(l => line(l, "")).join("");
      if(!pending.length && !completed.length) itemsHtml = `<li><span>No items</span></li>`;
      if(completed.length){
        itemsHtml += `<li class="kdone-head"><span>✓ Completed</span></li>` + completed.map(l => line(l, "kdone")).join("");
      }
      const addOn = !!(o.kot.done && Object.keys(o.kot.done).length && o.kot.status !== "prepared");
      let actions = "";
      if(o.kot.status === "new"){
        actions = `<button class="kbtn primary" data-kot-advance="${o.id}">Start preparing</button>`;
      } else if(o.kot.status === "preparing"){
        actions = `<button class="kbtn ghost" data-kot-back="${o.id}">↺</button><button class="kbtn done" data-kot-advance="${o.id}">Mark prepared</button>`;
      } else {
        // No manual clear: the ticket leaves this screen by itself once the bill is paid or cancelled.
        actions = `<button class="kbtn ghost" data-kot-back="${o.id}">↺</button><span class="knote">Stays until the bill is paid or cancelled</span>`;
      }
      return `
        <div class="kot-card status-${o.kot.status}">
          <div class="khead">
            <span class="kname">${escapeHtml(o.tableName)}</span>
            <span class="kot-badge">${addOn ? "Add-on · " : ""}${statusLabel[o.kot.status]}</span>
          </div>
          <div class="kelapsed">Sent <span data-elapsed-start="${o.kot.sentAt}">${fmtElapsed(o.kot.sentAt)}</span> ago</div>
          <ul class="kitems">${itemsHtml}</ul>
          <div class="kactions">${actions}</div>
        </div>`;
    }).join("");
    return seg + `<div class="kot-grid">${cards}</div>`;
  }

  function renderMenuTab(){

    if(Authz.canAccessTab("users")) subs.push(["users","Users"]);
    if(Authz.canAccessTab("backup")) subs.push(["backup","Backup"]);
    if(Authz.canAccessTab("audit")) subs.push(["audit","Audit"]);
    if(!subs.some(x => x[0] === state.menuSub)) state.menuSub = "categories";
    const seg = `
      <div class="segmented scroll">
        ${subs.map(([k,l]) => `<button data-menusub="${k}" class="${state.menuSub===k?"active":""}">${l}</button>`).join("")}
      </div>`;
    let body = "";
    if(state.menuSub === "categories") body = renderCategoriesList();

    else body = renderSettingsTab();
    return seg + body;
  }

  // Cashier totals are checked by the database (gst_calc, migration 0007). If it isn't installed,
  // turning GST on would make every cashier payment fail — so check first.
  async function gstDbReady(){
    if(!supabaseClient) return true;
    try{
      const { error } = await supabaseClient.rpc("gst_calc", {p_outlet:"00000000-0000-0000-0000-000000000000", p_org:"00000000-0000-0000-0000-000000000000", p_items:[], p_disc_bp:0});
      if(error && (error.code==="PGRST202" || error.code==="42883" || /could not find the function/i.test(error.message||""))) return false;
    }catch(e){ /* offline etc. — saving settings will report that itself */ }
    return true;
  }

          </div>
        </div>`;
    }).join("") : emptyState("🍽️","No tables yet","Add tables so you can open a bill for each one.");
    return rows + `<div class="fab-row"><button class="btn btn-amber btn-block" data-add-table>+ Add table</button></div>`;
  }

  /* ============ REPORTS TAB ============
     Every report is built from BUSINESS DAYS (the cycle from a day's opening to its closing),
     never from calendar dates. A day is shown as "Day 12" (its running number: the first day
     ever opened is Day 1) with the time it opened and closed. A range is a set of whole business
     days: one day, the last 7, the last 30, or "from Day X to Day Y".
     Sales belong to the day they were rung up on (order.businessDayId) and cashbook entries to
     the day that was open when they were logged, so a cafe open past midnight stays one day. */
  function getLastBusinessDay(){
    const days = state.config.businessDays || [];
    if(!days.length) return null;
    return days.reduce((max,d)=> (!max||d.openedAt>max.openedAt)?d:max, null);
  }
  // Lets the report show any business day, not just the most recent one. Falls back to the
  // latest day whenever nothing (or a since-deleted day) is selected.
  function selectedBusinessDay(){
    const days = state.config.businessDays || [];
    if(state.reportBizDayId){
      const found = days.find(d=>d.id===state.reportBizDayId);
      if(found) return found;
    }
    return getLastBusinessDay();
  }
  function sortedBusinessDays(){ return (state.config.businessDays||[]).slice().sort((a,b)=>a.openedAt-b.openedAt || (a.id<b.id?-1:1)); }
  // Running number of a business day: Day 1 = the first day ever opened.
  const MONTHS3 = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
  function businessDayNo(day){
    let n = 1;
    (state.config.businessDays||[]).forEach(d=>{ if(d.openedAt < day.openedAt || (d.openedAt === day.openedAt && d.id < day.id)) n++; });
    return n;
  }
  function bdName(day){ return fmtShortDate(day.openedAt); }   // the business day = the date it was opened, e.g. "12 Oct"
  function bdLabel(day){ return bdName(day) + (day.closedAt ? "" : " (open)"); }
  function bdTimes(day){ return fmtTime(day.openedAt) + " → " + (day.closedAt ? fmtTime(day.closedAt) : "now"); }
  function fmtSpan(ms){
    const mins = Math.max(0, Math.round(ms/60000)), h = Math.floor(mins/60), m = mins%60;
    return h>0 ? h+"h "+m+"m" : m+"m";
  }
  function bdSpan(day){ return fmtSpan((day.closedAt || Date.now()) - day.openedAt); }
  // Which business day a moment belongs to: by id when known, else by the day's open -> close window.
  function businessDayAt(ts, dayId){
    const days = state.config.businessDays || [];
    if(dayId){ const d = days.find(x=>x.id===dayId); if(d) return d; }
    return days.find(d => ts >= d.openedAt && ts <= (d.closedAt || Infinity)) || null;
  }
  // "12 Oct · 9:05 am". Something logged while no day was open reads "Before 13 Oct day · 8:40 am".
  function whenLabel(ts, dayId){
    const d = businessDayAt(ts, dayId);
    if(d) return bdName(d) + " · " + fmtTime(ts);
    const next = sortedBusinessDays().find(x => x.openedAt > ts);
    if(next) return "Before " + bdName(next) + " day · " + fmtTime(ts);
    const last = getLastBusinessDay();
    return (last ? "After " + bdName(last) + " day · " : "") + fmtTime(ts);
  }

  // The business days the current range covers (oldest first).
  function reportDays(){
    const all = sortedBusinessDays();
    if(!all.length) return [];
    const r = state.reportRange;
    if(r === "day"){ const d = selectedBusinessDay(); return d ? [d] : []; }
    if(r === "7" || r === "30") return all.slice(-parseInt(r,10));
    let b = all.findIndex(d=>d.id===state.reportToDayId);
    if(b < 0) b = all.length-1;
    let a = all.findIndex(d=>d.id===state.reportFromDayId);
    if(a < 0) a = Math.max(0, b-6);
    if(a > b){ const x = a; a = b; b = x; }
    return all.slice(a, b+1);
  }
  function reportScope(){
    const days = reportDays();
    return {days,
      start: days.length ? Math.min(...days.map(d=>d.openedAt)) : 0,
      end:   days.length ? Math.max(...days.map(d=>d.closedAt || Date.now())) : 0};
  }
  function inDays(days, ts){ return days.some(d => ts >= d.openedAt && ts <= (d.closedAt || Infinity)); }
  function ordersForDays(days){
    const ids = new Set(days.map(d=>d.id));
    return state.orders.filter(o => o.status==="paid" && (o.businessDayId ? ids.has(o.businessDayId) : (o.paidAt && inDays(days, o.paidAt))));
  }
  function cashbookEntriesForDays(days){
    const ids = new Set(days.map(d=>d.id));
    return cashbookEntries().filter(e => e.businessDayId ? ids.has(e.businessDayId) : inDays(days, e.at));
  }

  // A single sale row for the Reports activity list — sales and cashbook entries are
  // merged into one list there, sorted by actual time, so this stays free of anything
  // cashbook-specific.
  function renderSaleRow(o, showDay){
    const badgeClass = o.payment.method==="cash"?"badge-cash":o.payment.method==="upi"?"badge-upi":"badge-mixed";
    const expanded = state.expandedOrderId === o.id;
    let detail = "";
    if(expanded){
      const lines = o.items.map(l=>`<div class="dline"><span>${escapeHtml(l.name)} × ${l.qty}</span><span>${money(l.price*l.qty)}</span></div>`).join("");
      let discountLine = "";
      if(o.discount){
        discountLine = `<div class="dline"><span>Subtotal</span><span>${money(o.subtotal)}</span></div><div class="dline"><span>Discount (${o.discount.percent}%)</span><span>-${money(o.discount.amount)}</span></div>`;
      }
      const taxLines = o.tax ? ((o.tax.mode==="exclusive" && !o.discount) ? `<div class="dline"><span>Subtotal</span><span>${money(o.subtotal)}</span></div>` : "")
        + taxBillLines(o).map(l=>`<div class="dline"><span>${escapeHtml(l.label)}</span><span>${money(l.amount)}</span></div>`).join("")
        + (o.tax.mode==="inclusive" ? `<div class="dline"><span>(prices include GST)</span><span></span></div>` : "") : "";
      discountLine += taxLines;
      let payLine = "";
      if(o.payment.method==="mixed"){
        payLine = `<div class="dline"><span>Cash</span><span>${money(o.payment.cash)}</span></div><div class="dline"><span>UPI</span><span>${money(o.payment.upi)}</span></div>`;
      }
      detail = `<div class="order-detail">${lines}${discountLine}${payLine}
        ${Authz.can("bill.reprint") ? `<button class="btn btn-outline btn-block" style="margin-top:10px;" data-print-order="${o.id}">🧾 Print bill again</button>` : ""}
        ${Authz.canEditSale() ? `<button class="btn btn-outline btn-block" style="margin-top:8px;" data-edit-bill-order="${o.id}">✏️ Edit bill</button>
        <button class="btn btn-outline btn-block" style="margin-top:8px;" data-change-payment-order="${o.id}">💳 Change payment mode</button>` : ""}
        ${Authz.canVoidSale() ? `<button class="btn btn-danger btn-block" style="margin-top:8px;" data-delete-order="${o.id}">🗑️ Void sale</button>` : ""}
      </div>`;
    }
    return `
      <div class="order-row" data-toggle-order="${o.id}">
        <div class="otop">
          <div>
            <div class="oleft">${escapeHtml(o.tableName)} · ${money(o.total)}</div>
            <div class="otime">Bill #${o.invoiceNo || "—"} · ${showDay ? whenLabel(o.paidAt, o.businessDayId) : fmtTime(o.paidAt)}</div>
          </div>
          <span class="badge ${badgeClass}">${o.payment.method}</span>
        </div>
        ${detail}
      </div>`;
  }

  // A single cashbook entry, in the same "order-row" shape as a sale row so the two
  // interleave naturally in one time-ordered list. Colour-coded: green-ish for income,
  // red-ish for expense, amber for a plain drawer<->bank transfer.
  function cashbookRowHtml(e){
    let label, badgeClass, sign;
    if(e.type==="expense"){ label="Expense · " + (e.account==="drawer"?"Cash drawer":"Bank"); badgeClass="badge-mixed"; sign="-"; }
    else if(e.type==="income"){ label="Other income · " + (e.account==="drawer"?"Cash drawer":"Bank"); badgeClass="badge-cash"; sign="+"; }
    else if(e.type==="supplier_payment"){ label="Supplier payment · " + (e.account==="drawer"?"Cash drawer":"Bank"); badgeClass="badge-upi"; sign="-"; }
    else if(e.type==="supplier_payment_reversal"){ label="Supplier payment reversed · " + (e.account==="drawer"?"Cash drawer":"Bank"); badgeClass="badge-cash"; sign="+"; }
    else { label="Transfer · " + (e.from==="drawer"?"Drawer → Bank":"Bank → Drawer"); badgeClass="badge-upi"; sign=""; }
    return `
      <div class="order-row">
        <div class="otop">
          <div>
            <div class="oleft">${label}</div>
            <div class="otime">${state.reportRange==="day" ? fmtTime(e.at) : whenLabel(e.at, e.businessDayId)}${e.note ? " · " + escapeHtml(e.note) : ""}</div>
          </div>
          <span class="badge ${badgeClass}">${sign}${money(e.amount)}</span>
        </div>
      </div>`;
  }

  // Staff get a stripped-down Reports view: current business day's sales + bill
  // history only. No Daily/Month/Custom ranges, no past-day picker, no Close day
  // button, no closing summaries/PDF — that's all admin-only.
  function renderStaffReportsTab(){
    const day = getOpenBusinessDay() || getLastBusinessDay();
    const paid = (day ? ordersForDays([day]) : []).sort((a,b)=>b.paidAt-a.paidAt);
    const total = paid.reduce((s,o)=>s+o.total,0);
    const cash = paid.reduce((s,o)=> s + (o.payment ? (o.payment.method==="cash" ? o.payment.total|| o.total : (o.payment.cash||0)) : 0), 0);
    const upi = paid.reduce((s,o)=> s + (o.payment ? (o.payment.method==="upi" ? (o.payment.total||o.total) : (o.payment.upi||0)) : 0), 0);

    const banner = day
      ? `<div class="daybanner ${day.closedAt ? "" : "open"}">
          <div class="db-info">
            <div class="db-status">${day.closedAt ? "⚪ Last business day" : "🟢 Day open"}</div>
            <div class="db-sub">${bdName(day)} · ${bdTimes(day)} · ${paid.length} order${paid.length===1?"":"s"} · ${money(total)}</div>
          </div>
        </div>`
      : `<div class="daybanner">
          <div class="db-info">
            <div class="db-status">⚪ No day open</div>
            <div class="db-sub">Opens automatically with the next sale</div>
          </div>
        </div>`;

    const stats = `
      <div class="stat-grid">
        <div class="stat-card accent"><div class="slabel">Total sales</div><div class="sval">${money(total)}</div></div>
        <div class="stat-card"><div class="slabel">Orders</div><div class="sval">${paid.length}</div></div>
        <div class="stat-card"><div class="slabel">Cash</div><div class="sval">${money(cash)}</div></div>
        <div class="stat-card"><div class="slabel">UPI</div><div class="sval">${money(upi)}</div></div>
      </div>`;

    const list = paid.length === 0
      ? emptyState("📊","No sales yet","Completed sales for the current business day will show up here, newest first.")
      : paid.map(o=>renderSaleRow(o, false)).join("");

    return banner + stats + list;
  }

  // ---- Report type panels ----------------------------------------------------------
  // Each report type (Sales / Expense / Bank transfer) reads its own slice of the data
  // for the current {start,end} range — a sale, an expense, and a transfer only ever
  // show up in exactly one of the three, so nothing is duplicated between them (the
  // old view merged everything into one interleaved list).

  // GST collected across a set of paid orders, grouped by rate. null when none carried tax.
  function gstSummaryOf(orders){
    const withTax = orders.filter(o=>o.tax && o.tax.groups);
    if(!withTax.length) return null;
    const by = new Map(); const P = (n)=>Math.round(n*100);
    withTax.forEach(o=> o.tax.groups.forEach(g=>{
      const a = by.get(g.rate) || {rate:g.rate, taxable:0, cgst:0, sgst:0, igst:0, tax:0};
      a.taxable+=P(g.taxable); a.cgst+=P(g.cgst); a.sgst+=P(g.sgst); a.igst+=P(g.igst); a.tax+=P(g.tax);
      by.set(g.rate, a);
    }));
    const groups = [...by.values()].sort((a,b)=>a.rate-b.rate);
    const sum = (k)=> groups.reduce((t,g)=>t+g[k],0)/100;
    return {groups: groups.map(g=>({rate:g.rate, taxable:g.taxable/100, cgst:g.cgst/100, sgst:g.sgst/100, igst:g.igst/100, tax:g.tax/100})),
            taxable:sum("taxable"), cgst:sum("cgst"), sgst:sum("sgst"), igst:sum("igst"), tax:sum("tax"), bills: withTax.length, allBills: orders.length};
  }
  function gstSummaryHtml(orders){
    const g = gstSummaryOf(orders);
    if(!g) return "";
    const rows = g.groups.map(x=>`<div class="dline"><span>GST ${x.rate}% · taxable ${money(x.taxable)}</span><span>${money(x.tax)}</span></div>
        <div class="dline" style="padding-left:12px; opacity:.85;"><span>${x.igst ? "IGST" : "CGST "+money(x.cgst)+" + SGST (state) "+money(x.sgst)}</span><span>${x.igst ? money(x.igst) : ""}</span></div>`).join("");
    return `<div class="cat-chip-header" style="margin-top:22px;">GST collected</div>
      <div class="order-row"><div class="order-detail" style="display:block;">
        <div class="dline"><span>Taxable value</span><span>${money(g.taxable)}</span></div>
        ${rows}
        <div class="dline r-bold" style="margin-top:4px; padding-top:6px; border-top:1px solid var(--border);"><span>Total GST</span><span>${money(g.tax)}</span></div>
        ${g.cgst||g.sgst ? `<div class="dline"><span>CGST</span><span>${money(g.cgst)}</span></div><div class="dline"><span>SGST (state tax)</span><span>${money(g.sgst)}</span></div>` : ""}
        ${g.igst ? `<div class="dline"><span>IGST</span><span>${money(g.igst)}</span></div>` : ""}
        ${g.bills < g.allBills ? `<div class="dline" style="color:var(--text-dim);"><span>${g.allBills-g.bills} bill${g.allBills-g.bills===1?"":"s"} had no GST</span><span></span></div>` : ""}
      </div></div>`;
  }

  /* ============ REPORTS TAB (redesigned) ============
     Layout: day banner → report tabs (Overview · Sales · Items · Cash) → period picker → content.
       Overview  KPIs, sales bar graph (one bar per business day), payments, top items
       Sales     bill list, GST, closing summary / cash check, CSV export
       Items     best sellers, category share, items with no sales, CSV export
       Cash      expenses, other income, drawer <-> bank transfers, balances
     Everything is computed in the browser from orders/cashbook already loaded - no database changes. */
  const REPORT_TABS = [["overview","📊","Overview"],["sales","🧾","Bills"],["items","🍹","Items"],["cash","💰","Cash"],["closing","📕","Closing"]];
  const REPORT_RANGES = [["day","Day"],["7","Last 7"],["30","Last 30"],["custom","Custom"]];   // all in business days

  function orderCashUpi(o){
    const p = o.payment; if(!p) return {cash:0, upi:0};
    if(p.method === "cash") return {cash:p.total||o.total, upi:0};
    if(p.method === "upi") return {cash:0, upi:p.total||o.total};
    return {cash:p.cash||0, upi:p.upi||0};
  }
  function salesTotalsOf(paid){
    const t = {total:0, orders:paid.length, cash:0, upi:0, discount:0};
    paid.forEach(o=>{ const cu = orderCashUpi(o); t.total += o.total; t.cash += cu.cash; t.upi += cu.upi; t.discount += (o.discount && o.discount.amount) || 0; });
    t.total = round2(t.total); t.cash = round2(t.cash); t.upi = round2(t.upi); t.discount = round2(t.discount);
    t.avg = t.orders ? round2(t.total / t.orders) : 0;
    return t;
  }
  function cashbookTotalsFor(days){
    const entries = cashbookEntriesForDays(days);
    const sum = (type)=> round2(entries.filter(e=>e.type===type).reduce((s,e)=>s+e.amount,0));
    return {entries, expense:sum("expense"), income:sum("income")};
  }

  /* ---- chart series ---- */
  function finishRow(r){ r.total = round2(r.total); r.cash = round2(r.cash); r.upi = round2(r.upi); return r; }
  function addToRow(r, o){ const cu = orderCashUpi(o); r.total += o.total; r.cash += cu.cash; r.upi += cu.upi; r.orders++; }
  // One bar per BUSINESS DAY (open -> close cycle). Day range: the selected day plus the 6 before it,
  // so a single day can be compared with its recent past. Other ranges: every business day in the range.
  function businessDaySeries(){
    const all = sortedBusinessDays();
    let days;
    if(state.reportRange === "day"){
      const sel = selectedBusinessDay();
      const idx = sel ? all.findIndex(d=>d.id===sel.id) : -1;
      days = idx >= 0 ? all.slice(Math.max(0, idx-6), idx+1) : all.slice(-7);
    } else {
      days = reportDays().slice(-62);
    }
    return days.map((d,i)=>{
      const mo = new Date(d.openedAt).getMonth(), pm = i ? new Date(days[i-1].openedAt).getMonth() : -1;
      const row = {key:d.id, ts:d.openedAt, title:bdLabel(d), times:bdTimes(d), label:String(new Date(d.openedAt).getDate()), sub:(mo!==pm ? MONTHS3[mo] : ""), total:0, cash:0, upi:0, orders:0};
      ordersForDays([d]).forEach(o=>addToRow(row, o));
      return finishRow(row);
    });
  }
  function shortMoney(n){
    n = Number(n)||0;
    if(n>=1000000) return (n/1000000).toFixed(1).replace(/\.0$/,"")+"M";
    if(n>=1000) return (n/1000).toFixed(1).replace(/\.0$/,"")+"k";
    return String(Math.round(n));
  }
  function niceMax(v){
    if(v<=0) return 100;
    const raw = v/4, p = Math.pow(10, Math.floor(Math.log10(raw))), m = raw/p;
    const step = (m<=1?1:m<=2?2:m<=2.5?2.5:m<=5?5:10)*p;
    return step*4;
  }

  function barChartHtml(rows, stack, avg, bestKey){
    const L=34, R=6, B=28;
    const W = Math.max(360, L+R+rows.length*14), iw=W-L-R;   // many business days -> chart widens and scrolls sideways
    const fmtAmt = n => { n = Math.round((Number(n)||0)*100)/100; return Number.isInteger(n) ? String(n) : n.toFixed(2); };
    const maxLen = Math.max(...rows.map(r=>fmtAmt(r.total).length), 1);
    const slot0 = iw/rows.length, narrow = slot0 < Math.max(34, maxLen*6.2);
    const H = narrow ? 215 + Math.max(0, maxLen-5)*5 : 215;
    const T = narrow ? Math.round(maxLen*5.2 + 12) : 20, ih = H-T-B;
    const yMax = niceMax(Math.max(...rows.map(r=>r.total), 0));
    const y = v => T + ih - (v/yMax)*ih;
    const slot = iw/rows.length, bw = Math.max(3, Math.min(34, slot*0.68));
    const every = rows.length<=8 ? 1 : rows.length<=16 ? 2 : rows.length<=31 ? 5 : 7;
    let g = "";
    for(let i=0;i<=4;i++){
      const v = yMax*i/4, yy = y(v);
      g += `<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="#2a4247" stroke-width="${i?0.6:1}"/><text x="${L-5}" y="${yy+3}" text-anchor="end">${shortMoney(v)}</text>`;
    }
    rows.forEach((r,i)=>{
      const x = L + slot*i + (slot-bw)/2, cx = x + bw/2;
      const sel = state.dailySel === r.key, dim = state.dailySel && !sel ? 0.45 : 1;
      let bars = "";
      if(r.total > 0){
        if(stack){
          const hc = (r.cash/yMax)*ih, hu = (r.upi/yMax)*ih;
          bars = `<rect x="${x}" y="${y(r.cash)}" width="${bw}" height="${hc}" fill="#4fd1ae" rx="2"/><rect x="${x}" y="${y(r.cash)-hu}" width="${bw}" height="${hu}" fill="#ff7d4d" rx="2"/>`;
        } else {
          bars = `<rect x="${x}" y="${y(r.total)}" width="${bw}" height="${(r.total/yMax)*ih}" fill="${r.key===bestKey?"#ff7d4d":"#4fd1ae"}" rx="2"/>`;
        }
      }
      const show = i%every===0 || i===rows.length-1;
      let vlab = "";
      if(r.total > 0){
        const ty = y(r.total) - 4, amt = fmtAmt(r.total);   // exact total sale of the business day
        vlab = narrow
          ? `<text class="vlabel rot" transform="rotate(-90 ${cx+3} ${ty})" x="${cx+3}" y="${ty}" text-anchor="start">${amt}</text>`
          : `<text class="vlabel" x="${cx}" y="${ty}" text-anchor="middle">${amt}</text>`;
      }
      g += `<g class="dbar" data-daily-bar="${r.key}" opacity="${dim}"><rect x="${L+slot*i}" y="${T}" width="${slot}" height="${ih}" fill="transparent"/>${bars}`
        + vlab
        + (sel ? `<rect x="${x-2}" y="${T}" width="${bw+4}" height="${ih}" fill="none" stroke="#f0f7f6" stroke-width="1" rx="3" stroke-dasharray="3 2"/>` : "")
        + (show ? `<text x="${cx}" y="${H-12}" text-anchor="middle">${r.label}</text>` : "")
        + (show && r.sub ? `<text x="${cx}" y="${H-2}" text-anchor="middle">${r.sub}</text>` : "")
        + `</g>`;
    });
    if(avg > 0 && avg <= yMax){
      g += `<line x1="${L}" x2="${W-R}" y1="${y(avg)}" y2="${y(avg)}" stroke="#e6aa3c" stroke-width="1" stroke-dasharray="4 3"/><text x="${W-R}" y="${y(avg)-3}" text-anchor="end" style="fill:#e6aa3c">avg ${shortMoney(avg)}</text>`;
    }
    return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Sales bar graph" style="${W>360 ? "width:"+W+"px; min-width:"+W+"px;" : ""}">${g}</svg>`;
  }
  function trendCardHtml(paid){
    const hourly = false;
    const rows = businessDaySeries();
    const active = rows.filter(r=>r.orders>0);
    const avg = active.length ? round2(active.reduce((s,r)=>s+r.total,0)/active.length) : 0;
    const best = active.reduce((b,r)=> (!b || r.total>b.total) ? r : b, null);
    const stack = state.dailyStack;
    const unit = "business day";
    const head = `<div class="rtitle"><span>Sales by ${unit}</span>
      <span class="mini-seg"><button data-daily-stack="0" class="${!stack?"active":""}">Total</button><button data-daily-stack="1" class="${stack?"active":""}">Cash/UPI</button></span></div>`;
    if(!active.length) return `<div class="rcard">${head}<div class="hint-text" style="text-align:center; padding:22px 0 8px;">No business day sales in this period yet.</div></div>`;

    const legend = stack
      ? `<div class="dlegend"><span><i style="background:#4fd1ae"></i>Cash</span><span><i style="background:#ff7d4d"></i>UPI</span></div>`
      : `<div class="dlegend"><span><i style="background:#ff7d4d"></i>Best ${unit}</span><span><i style="background:#4fd1ae"></i>Other</span></div>`;
    let detail = `<div class="hint-text" style="text-align:center; padding:6px 0 0;">Bars = business days (by opening date) · tap a bar for details${best ? ` · best ${unit}: ${best.title} (${money(best.total)})` : ""}</div>`;
    const sel = rows.find(r=>r.key===state.dailySel);
    if(sel){
      const vs = (avg>0 && sel.orders) ? Math.round((sel.total-avg)/avg*100) : null;
      detail = `<div class="sel-detail">
        <div class="rline bold"><span>${sel.title}</span><span>${money(sel.total)}</span></div>
        <div class="rline"><span>Open</span><span>${sel.times}</span></div>
        <div class="rline"><span>Orders · avg bill</span><span>${sel.orders} · ${money(sel.orders ? round2(sel.total/sel.orders) : 0)}</span></div>
        <div class="rline"><span>Cash · UPI</span><span>${money(sel.cash)} · ${money(sel.upi)}</span></div>
        ${vs!==null ? `<div class="rline"><span>vs. average ${unit}</span><span style="color:${vs>=0?"var(--teal)":"#e79080"}; font-weight:600;">${vs>=0?"+":""}${vs}%</span></div>` : ""}
      </div>`;
    }
    return `<div class="rcard">${head}<div class="dchart">${barChartHtml(rows, stack, avg, best && best.key)}</div>${legend}${detail}</div>`;
  }

  /* ---- item / category statistics ---- */
  function itemStatsOf(paid){
    const cfg = state.config;
    const itemById = new Map((cfg.items||[]).map(i=>[i.id,i]));
    const catById = new Map((cfg.categories||[]).map(c=>[c.id,c.name]));
    const items = new Map(), cats = new Map(); let total = 0;
    paid.forEach(o=> (o.items||[]).forEach(l=>{
      const rev = round2(l.price*l.qty); total += rev;
      const it = itemById.get(l.itemId);
      const cat = (it && catById.get(it.categoryId)) || "Other";
      const k = l.itemId || ("n:"+l.name);
      const a = items.get(k) || {id:l.itemId||null, name:l.name, cat, qty:0, rev:0};
      a.qty += l.qty; a.rev = round2(a.rev+rev); items.set(k,a);
      const c = cats.get(cat) || {name:cat, qty:0, rev:0};
      c.qty += l.qty; c.rev = round2(c.rev+rev); cats.set(cat,c);
    }));
    return {items:[...items.values()], cats:[...cats.values()], total:round2(total)};
  }
  function rankListHtml(list, valueOf, labelOf, subOf){
    const max = Math.max(...list.map(valueOf), 0) || 1;
    return list.map((x,i)=>`<div class="rank"><div class="rtop"><span class="rn">${i+1}. ${escapeHtml(labelOf(x))}</span><span class="rv">${money(x.rev)}</span></div>
      <div class="rsub2">${subOf(x)}</div><div class="rbar"><i style="width:${Math.max(2, Math.round(valueOf(x)/max*100))}%"></i></div></div>`).join("");
  }

  /* ---- panels ---- */
  // Sales dashboard: total sale, UPI sale, cash sale, total orders.
  function salesDashboardHtml(paid){
    const t = salesTotalsOf(paid);
    return `<div class="sale-dash">
        <div class="stat-card accent"><div class="slabel">Total sale</div><div class="sval">${money(t.total)}</div></div>
        <div class="stat-card"><div class="slabel">Total orders</div><div class="sval">${t.orders}</div></div>
        <div class="stat-card upi"><div class="slabel">UPI sale</div><div class="sval">${money(t.upi)}</div></div>
        <div class="stat-card cash"><div class="slabel">Cash sale</div><div class="sval">${money(t.cash)}</div></div>
      </div>`;
  }
  function renderOverviewPanel(scope, paid){
    const t = salesTotalsOf(paid);
    const cb = cashbookTotalsFor(scope.days);
    const net = round2(t.total - cb.expense + cb.income);
    const kpis = salesDashboardHtml(paid) + `<div class="stat-grid">
        <div class="stat-card"><div class="slabel">Avg bill</div><div class="sval">${money(t.avg)}</div></div>
        <div class="stat-card"><div class="slabel">Net result</div><div class="sval" style="color:${net>=0?"var(--teal)":"#e79080"};">${money(net)}</div><div class="ksub">sales − expenses + other income</div></div>
      </div>`;
    if(!paid.length) return kpis + trendCardHtml(paid) + `<div class="hint-text" style="text-align:center;">Completed sales will show up here.</div>`;

    const cashPct = t.total ? Math.round(t.cash/t.total*100) : 0, upiPct = t.total ? 100-cashPct : 0;
    const gst = gstSummaryOf(paid);
    const pay = `<div class="rcard"><div class="rtitle"><span>Payments</span></div>
      <div class="paybar"><span style="width:${cashPct}%; background:var(--teal);"></span><span style="width:${upiPct}%; background:var(--amber);"></span></div>
      <div class="rline"><span><i class="pdot" style="background:var(--teal)"></i>Cash · ${cashPct}%</span><span>${money(t.cash)}</span></div>
      <div class="rline"><span><i class="pdot" style="background:var(--amber)"></i>UPI · ${upiPct}%</span><span>${money(t.upi)}</span></div>
      ${t.discount>0 ? `<div class="rline dim"><span>Discounts given</span><span>${money(t.discount)}</span></div>` : ""}
      ${gst ? `<div class="rline dim"><span>GST collected</span><span>${money(gst.tax)}</span></div>` : ""}
      <div class="rline dim"><span>Expenses · other income</span><span>${money(cb.expense)} · ${money(cb.income)}</span></div>
    </div>`;

    const st = itemStatsOf(paid);
    const top = st.items.slice().sort((a,b)=>b.rev-a.rev).slice(0,5);
    const topCard = `<div class="rcard"><div class="rtitle"><span>Top items</span><button class="linkbtn" data-report-type="items">See all →</button></div>
      ${rankListHtml(top, x=>x.rev, x=>x.name, x=>x.qty+" sold")}</div>`;
    return kpis + trendCardHtml(paid) + pay + topCard;
  }

  /* ---- Business-day closing report: one summary used by the popup after "Close day" and by
     Reports -> Sales for any closed day. Sales split, expenses / income / net, cash drawer + cash
     count, top items and the busiest hour. ---- */
  function hourLabel(h){ const x = h % 12 === 0 ? 12 : h % 12; return x + (h < 12 ? " AM" : " PM"); }
  // One line per supplier payment (and per reversal) of the day: time · supplier · bill · cash/bank, amount.
  function supplierPaymentRowsHtml(entries, row){
    return (entries || []).filter(e => e.type === "supplier_payment" || e.type === "supplier_payment_reversal").slice().sort((a,b) => a.at - b.at).map(e => {
      const rev = e.type === "supplier_payment_reversal";
      const label = fmtTime(e.at) + " · " + escapeHtml(String(e.note || "Supplier payment").replace(/^Supplier payment( reversed)? · /, "")) + " · " + (e.account === "drawer" ? "Cash" : "Bank") + (rev ? " · reversed" : "");
      return row("&nbsp;&nbsp;" + label, (rev ? "+ " : "− ") + money(e.amount), "dim");
    }).join("");
  }
  function closingReportHtml(day){
    const paid = ordersForBusinessDay(day.id);
    const t = salesTotalsOf(paid);
    const split = paid.filter(o => o.payment && o.payment.method === "mixed").length;
    const cb = cashbookDaySummary(day.id);
    const expTotal = round2(cb.drawerExpense + cb.bankExpense);
    const incTotal = round2(cb.drawerIncome + cb.bankIncome);
    const expCount = cb.entries.filter(e => e.type === "expense").length;
    const net = round2(t.total - expTotal);
    const openBal = cashbookBalances(day.openedAt - 1);
    const closeBal = cashbookBalances(day.closedAt || Infinity);
    const items = {};
    paid.forEach(o => (o.items || []).forEach(l => {
      const r = items[l.name] || (items[l.name] = {qty:0, amt:0});
      r.qty += l.qty; r.amt += l.qty * l.price;
    }));
    const top = Object.keys(items).sort((a,b) => items[b].qty - items[a].qty || items[b].amt - items[a].amt).slice(0, 5);
    const byHour = {};
    paid.forEach(o => { const h = new Date(o.paidAt).getHours(); byHour[h] = (byHour[h] || 0) + 1; });
    const busy = Object.keys(byHour).sort((a,b) => byHour[b] - byHour[a] || a - b)[0];
    const row = (k, v, cls) => `<div class="cs-row ${cls || ""}"><span>${k}</span><span>${v}</span></div>`;
    return `<div class="cs-wrap">
      <div class="cs-head">Sales</div>
      ${row("Total sales", money(t.total), "bold")}
      ${row("Bills", t.orders)}
      ${row("Cash", money(t.cash))}
      ${row("UPI", money(t.upi))}
      ${split ? row("Split-payment bills", split, "dim") : ""}
      ${t.discount ? row("Discounts given", "− " + money(t.discount), "dim") : ""}
      <div class="cs-head">Expenses &amp; income</div>
      ${row("Expenses" + (expCount ? ` (${expCount})` : ""), expTotal ? "− " + money(expTotal) : money(0), expTotal ? "bad" : "")}
      ${incTotal ? row("Other income", "+ " + money(incTotal), "good") : ""}
      ${row("Net (sales − expenses)", (net < 0 ? "− " : "") + money(Math.abs(net)), "bold " + (net < 0 ? "bad" : "good"))}
      ${(cb.drawerSupplier || cb.bankSupplier) ? row("Supplier payments (not an expense)", "− " + money(round2(cb.drawerSupplier + cb.bankSupplier)), "dim") + row("&nbsp;&nbsp;from cash drawer · bank", money(cb.drawerSupplier) + " · " + money(cb.bankSupplier), "dim") + supplierPaymentRowsHtml(cb.entries, row) : ""}
      <div class="cs-head">Cash drawer</div>
      ${row("Opening balance", money(openBal.drawer))}
      ${row("Drawer balance at closing", money(closeBal.drawer))}
      ${row("Bank balance at closing", money(closeBal.bank))}
      ${cashCountLinesHtml(day)}
      ${top.length ? `<div class="cs-head">Top items</div>` + top.map((n, i) => row(`${i+1}. ${escapeHtml(n)}`, `${items[n].qty} · ${money(items[n].amt)}`)).join("") : ""}
      ${busy !== undefined ? `<div class="cs-head">Busiest hour</div>` + row(`${hourLabel(+busy)} – ${hourLabel((+busy + 1) % 24)}`, `${byHour[busy]} bill${byHour[busy] === 1 ? "" : "s"}`) : ""}
    </div>`;
  }

  function renderSalesReportPanel(scope, paid){
    const t = salesTotalsOf(paid);
    const closingSummary = "";   // closing summary + revert now live in the Closing tab
    const head = `<div class="rtitle"><span>${paid.length} bill${paid.length===1?"":"s"} · ${money(t.total)}</span>${paid.length ? `<button class="linkbtn" data-export-csv="bills">⬇️ CSV</button>` : ""}</div>`;
    const list = paid.length === 0
      ? emptyState("🧾","No sales for this selection","Completed sales of the chosen business day(s) will show up here, newest first.")
      : paid.map(o=>renderSaleRow(o, state.reportRange !== "day")).join("");
    const cashCheck = state.reportRange === "day" ? "" : cashCheckRangeHtml(scope.days);
    return salesDashboardHtml(paid) + head + list + gstSummaryHtml(paid) + closingSummary + cashCheck;
  }

  // Closing tab: the closing report of ONE business day, its PDF, and "Revert closing".
  function renderClosingPanel(){
    const day = selectedBusinessDay();
    if(!day) return emptyState("📕","No business day yet","A day opens with the first sale. Close it from the banner above to get its closing report.");
    const paid = ordersForBusinessDay(day.id);
    const itemTotals = {};
    paid.forEach(o=> (o.items||[]).forEach(l=>{ itemTotals[l.name] = (itemTotals[l.name]||0) + l.qty; }));
    const itemNames = Object.keys(itemTotals).sort((a,b)=> itemTotals[b]-itemTotals[a]);
    const itemLines = itemNames.map(n=>`<div class="dline"><span>${escapeHtml(n)}</span><span>${itemTotals[n]}</span></div>`).join("");
    const canManage = Authz.canManageBusinessDay();
    let revert = "";
    if(day.closedAt){
      const ok = canManage && canRevertBusinessDay(day);
      const why = !canManage ? "Only an admin can revert a closing."
        : "Closing can only be reverted on the latest closed day, and only while the next day has no sales.";
      revert = `<button class="btn btn-outline btn-block" style="margin-top:12px;${ok ? "" : " opacity:.45;"}" ${ok ? `data-revert-day="${day.id}"` : "disabled"}>↩️ Revert closing (mistakenly closed)</button>`
        + (ok ? "" : `<div class="hint-text" style="margin-top:6px;">${why}</div>`);
    }
    const note = day.closedAt ? "" : `<div class="hint-text" style="padding:0 0 10px;">The ${bdName(day)} business day is still open — this is a live preview. Use the Close button above to finish it.</div>`;
    return `${note}<div class="order-row"><div class="order-detail" style="display:block;">
        <div class="dline"><span>Business day</span><span>${bdName(day)}</span></div>
        <div class="dline"><span>Opened</span><span>${fmtTime(day.openedAt)}</span></div>
        <div class="dline"><span>${day.closedAt ? "Closed" : "Status"}</span><span>${day.closedAt ? fmtTime(day.closedAt) : "Open"}</span></div>
        <div class="dline"><span>${day.closedAt ? "Open for" : "Open so far"}</span><span>${bdSpan(day)}</span></div>
        ${closingReportHtml(day)}
        <button class="btn btn-outline btn-block" style="margin-top:12px;" data-download-bizday="${day.id}">⬇️ Download PDF</button>
        ${itemNames.length ? `<div class="cat-chip-header" style="margin:12px 0 4px;">Items sold</div>${itemLines}` : ""}
        ${revert}
      </div></div>`;
  }

  // Cash count result of one closed day, as report lines. Reads the figures saved AT CLOSE.
  function cashCountLinesHtml(day){
    const cc = day && day.cashClose;
    if(!cc) return `<div class="dline"><span>Cash count</span><span style="color:var(--text-dim);">Not recorded</span></div>`;
    const v = cashVerdict(cc.variance);
    const color = v.key==="exact" ? "var(--teal)" : (v.key==="short" ? "#e79080" : "#e6aa3c");
    return `<div class="dline" style="margin-top:4px; padding-top:6px; border-top:1px solid var(--border);"><span>Expected cash in drawer</span><span>${money(cc.expected)}</span></div>
      <div class="dline"><span>Cash counted</span><span>${money(cc.counted)}</span></div>
      <div class="dline r-bold" style="color:${color};"><span>${v.icon} ${v.key==="exact" ? "Exact" : v.label}</span><span>${v.key==="exact" ? money(0) : v.sign + money(v.amount)}</span></div>
      ${v.key==="exact" ? "" : `<div class="dline"><span>Drawer balance adjusted by</span><span>${v.sign}${money(v.amount)}</span></div>`}
      ${cc.note ? `<div class="dline"><span>Note</span><span>${escapeHtml(cc.note)}</span></div>` : ""}
      ${cc.countedBy ? `<div class="dline"><span>Counted by</span><span>${escapeHtml(cc.countedBy)}</span></div>` : ""}`;
  }
  // Multi-day ranges: one line per closed day in the range that has a cash count.
  function cashCheckRangeHtml(scopeDays){
    const days = scopeDays
      .filter(d => d.closedAt && d.cashClose)
      .sort((a,b)=>b.openedAt-a.openedAt);
    if(!days.length) return "";
    const net = round2(days.reduce((sum,d)=>sum+d.cashClose.variance,0));
    const nv = cashVerdict(net);
    const rows = days.map(d=>{
      const v = cashVerdict(d.cashClose.variance);
      const color = v.key==="exact" ? "var(--teal)" : (v.key==="short" ? "#e79080" : "#e6aa3c");
      return `<div class="dline"><span>${bdName(d)} · closed ${fmtTime(d.closedAt)}</span><span style="color:${color}; font-weight:600;">${v.icon} ${v.key==="exact" ? "Exact" : v.label+" "+money(v.amount)}</span></div>`;
    }).join("");
    return `<div class="rtitle" style="margin-top:22px;"><span>Cash drawer check</span></div>
      <div class="order-row"><div class="order-detail" style="display:block;">${rows}
        <div class="dline r-bold" style="margin-top:4px; padding-top:6px; border-top:1px solid var(--border);"><span>Net over ${days.length} counted day${days.length===1?"":"s"}</span><span>${nv.key==="exact" ? money(0) : nv.sign + money(nv.amount)}</span></div>
      </div></div>`;
  }

  function renderItemsPanel(paid){
    if(!paid.length) return emptyState("🍹","No items sold for this selection","Best sellers and category sales will show up here.");
    const st = itemStatsOf(paid);
    const byQty = state.itemSort === "qty";
    const sorted = st.items.slice().sort((a,b)=> byQty ? (b.qty-a.qty || b.rev-a.rev) : (b.rev-a.rev || b.qty-a.qty));
    const sortToggle = `<span class="mini-seg"><button data-item-sort="qty" class="${byQty?"active":""}">Qty</button><button data-item-sort="rev" class="${!byQty?"active":""}">Sales</button></span>`;
    const best = `<div class="rcard"><div class="rtitle"><span>Best sellers</span>${sortToggle}</div>
      ${rankListHtml(sorted.slice(0,15), x=> byQty ? x.qty : x.rev, x=>x.name, x=>x.qty+" sold · "+escapeHtml(x.cat))}
      ${sorted.length>15 ? `<div class="hint-text" style="padding:4px 0 0;">+ ${sorted.length-15} more · export CSV for the full list</div>` : ""}</div>`;

    const cats = st.cats.slice().sort((a,b)=>b.rev-a.rev);
    const catCard = `<div class="rcard"><div class="rtitle"><span>Sales by category</span></div>
      ${cats.map(c=>{ const pct = st.total ? Math.round(c.rev/st.total*100) : 0;
        return `<div class="rank"><div class="rtop"><span class="rn">${escapeHtml(c.name)}</span><span class="rv">${money(c.rev)} · ${pct}%</span></div><div class="rbar"><i style="width:${Math.max(2,pct)}%; background:var(--amber);"></i></div></div>`; }).join("")}</div>`;

    const soldIds = new Set(st.items.map(i=>i.id).filter(Boolean));
    const unsold = (state.config.items||[]).filter(i=>!soldIds.has(i.id));
    const unsoldCard = unsold.length
      ? `<div class="rcard"><div class="rtitle"><span>Not sold in these business days (${unsold.length})</span></div>
          <div class="hint-text" style="padding:0; color:var(--text-dim);">${unsold.slice(0,12).map(i=>escapeHtml(i.name)).join(" · ")}${unsold.length>12 ? ` · +${unsold.length-12} more` : ""}</div></div>`
      : "";
    return best + catCard + unsoldCard + `<button class="btn btn-outline btn-block" data-export-csv="items">⬇️ Export items CSV</button>`;
  }

  // Cash tab = the two original cashbook reports, one tap apart: Expense and Bank transfer.
  function renderExpenseReportPanel(scope){
    const entries = cashbookEntriesForDays(scope.days)
      .filter(e => e.type==="expense" || e.type==="income")
      .sort((a,b)=>b.at-a.at);
    const expense = entries.filter(e=>e.type==="expense").reduce((s,e)=>s+e.amount,0);
    const income = entries.filter(e=>e.type==="income").reduce((s,e)=>s+e.amount,0);
    const stats = `
      <div class="stat-grid">
        <div class="stat-card accent"><div class="slabel">Total expenses</div><div class="sval">${money(expense)}</div></div>
        <div class="stat-card"><div class="slabel">Other income</div><div class="sval">${money(income)}</div></div>
        <div class="stat-card"><div class="slabel">Net</div><div class="sval">${money(income-expense)}</div></div>
        <div class="stat-card"><div class="slabel">Entries</div><div class="sval">${entries.length}</div></div>
      </div>`;
    const list = entries.length === 0
      ? emptyState("💵","No expenses or income for this selection","Cashbook expenses and other income entries will show up here, newest first.")
      : entries.map(cashbookRowHtml).join("");

  function renderTransferReportPanel(scope){
    const entries = cashbookEntriesForDays(scope.days)
      .filter(e => e.type==="transfer")
      .sort((a,b)=>b.at-a.at);
    const drawerToBank = entries.filter(e=>e.from==="drawer").reduce((s,e)=>s+e.amount,0);
    const bankToDrawer = entries.filter(e=>e.from==="bank").reduce((s,e)=>s+e.amount,0);
    const bal = cashbookBalances(scope.days.length ? scope.end : undefined);   // balances at the close of the last business day shown

      <div class="stat-grid">
        <div class="stat-card accent"><div class="slabel">Drawer → Bank</div><div class="sval">${money(drawerToBank)}</div></div>
        <div class="stat-card"><div class="slabel">Bank → Drawer</div><div class="sval">${money(bankToDrawer)}</div></div>
        <div class="stat-card"><div class="slabel">Transfers</div><div class="sval">${entries.length}</div></div>
        <div class="stat-card"><div class="slabel">Net to bank</div><div class="sval">${money(drawerToBank-bankToDrawer)}</div></div>
        <div class="stat-card"><div class="slabel">Cash drawer</div><div class="sval">${money(bal.drawer)}</div></div>
        <div class="stat-card"><div class="slabel">Bank</div><div class="sval">${money(bal.bank)}</div></div>
      </div>`;

  function renderCashReportPanel(scope){
    const v = state.cashView === "transfer" ? "transfer" : "expense";
    const toggle = `<div class="segmented" style="margin-bottom:14px;">
        <button data-cash-view="expense" class="${v==="expense"?"active":""}">💵 Expense</button>
        <button data-cash-view="transfer" class="${v==="transfer"?"active":""}">🔁 Bank transfer</button>
      </div>`;
    return toggle + (v === "transfer" ? renderTransferReportPanel(scope) : renderExpenseReportPanel(scope));

  /* ---- CSV export (opens in Excel / Sheets) ---- */
  function csvCell(v){ v = v==null ? "" : String(v); return /[",\r\n]/.test(v) ? '"' + v.replace(/"/g,'""') + '"' : v; }
  function downloadCsv(filename, rows){
    const csv = "\ufeff" + rows.map(r=>r.map(csvCell).join(",")).join("\r\n");
    const url = URL.createObjectURL(new Blob([csv], {type:"text/csv;charset=utf-8"}));
    const a = document.createElement("a"); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 3000);
  }
  function exportReportCsv(kind){
    const scope = reportScope();
    const paid = ordersForDays(scope.days).sort((a,b)=>a.paidAt-b.paidAt);
    const first = scope.days[0], last = scope.days[scope.days.length-1];
    const stamp = !first ? "no-days" : (first.id===last.id ? bdName(first).replace(/ /g,"-") : bdName(first).replace(/ /g,"-")+"_to_"+bdName(last).replace(/ /g,"-"));
    if(kind === "items"){
      const st = itemStatsOf(paid);
      const rows = [["Item","Category","Qty sold","Sales"]];
      st.items.sort((a,b)=>b.qty-a.qty).forEach(i=>rows.push([i.name, i.cat, i.qty, i.rev]));
      downloadCsv("items_" + stamp + ".csv", rows);
    } else {
      const rows = [["Bill #","Business day","Time","Table","Items","Subtotal","Discount","Total","Payment","Cash","UPI"]];
      paid.forEach(o=>{
        const cu = orderCashUpi(o), d = businessDayAt(o.paidAt, o.businessDayId);
        rows.push([o.invoiceNo||"", d ? bdName(d) : "", fmtTime(o.paidAt), o.tableName||"",
          (o.items||[]).map(l=>l.name+" x"+l.qty).join("; "), o.subtotal!=null?o.subtotal:o.total,
          (o.discount && o.discount.amount) || 0, o.total, o.payment ? o.payment.method : "", cu.cash, cu.upi]);
      });
      downloadCsv("bills_" + stamp + ".csv", rows);
    }
    showToast("CSV downloaded");
  }

  /* ---- the tab ---- */
  function renderReportsTab(){
    if(!Authz.canViewReports()) return emptyState("🔒","Access denied","You don't have permission to view reports.");

    const openDay = getOpenBusinessDay();
    const dayBanner = openDay
      ? (()=>{
          const dOrders = ordersForBusinessDay(openDay.id);
          const dTotal = dOrders.reduce((s,o)=>s+o.total,0);
          return `<div class="daybanner open">
            <div class="db-info">
              <div class="db-status">🟢 Day open</div>
              <div class="db-sub">${bdName(openDay)} · since ${fmtTime(openDay.openedAt)} · ${dOrders.length} order${dOrders.length===1?"":"s"} · ${money(dTotal)}</div>
            </div>
            ${Authz.canManageBusinessDay() ? `<button class="btn btn-outline" id="closeDayBtn">Close day (${bdName(openDay)})</button>` : ""}
          </div>`;
        })()
      : `<div class="daybanner">
          <div class="db-info">
            <div class="db-status">⚪ No day open</div>
            <div class="db-sub">Opens automatically with the next sale</div>
          </div>
        </div>`;

    const type = REPORT_TABS.some(t=>t[0]===state.reportType) ? state.reportType : "overview";
    const tabBtns = `<div class="rtabs">${REPORT_TABS.map(t=>`<button data-report-type="${t[0]}" class="${type===t[0]?"active":""}"><span>${t[1]}</span>${t[2]}</button>`).join("")}</div>`;

    const effRange = type === "closing" ? "day" : state.reportRange;
    const rangeBtns = type === "closing" ? "" : `<div class="segmented">${REPORT_RANGES.map(r=>`<button data-report-range="${r[0]}" class="${state.reportRange===r[0]?"active":""}">${r[1]}</button>`).join("")}</div>`;

    const scope = reportScope();
    const sDays = scope.days, fDay = sDays[0], lDay = sDays[sDays.length-1];
    let picker = "";
    if(effRange === "custom"){
      const allDays = sortedBusinessDays().reverse();   // newest first
      const opts = (pick)=> allDays.map(d=>`<option value="${d.id}" ${pick && d.id===pick.id ? "selected" : ""}>${bdLabel(d)} · ${bdTimes(d)}</option>`).join("");
      picker = allDays.length
        ? `<div class="range-row" style="display:flex; gap:8px; align-items:center;">
            <select id="reportFromDay" style="flex:1; min-width:0;">${opts(fDay)}</select><span>→</span>
            <select id="reportToDay" style="flex:1; min-width:0;">${opts(lDay)}</select>
          </div>
          <div class="hint-text" style="padding-bottom:10px;">From ${bdName(fDay)} to ${bdName(lDay)} · ${sDays.length} business day${sDays.length===1?"":"s"}</div>`
        : "";
    } else if(effRange === "day"){
      const allDays = sortedBusinessDays().reverse();   // newest first
      const currentDay = selectedBusinessDay();
      const dayOptions = allDays.map(d=>{
        const label = d.closedAt
          ? `${bdName(d)} · ${bdTimes(d)}${d.cashClose ? (()=>{ const v = cashVerdict(d.cashClose.variance); return v.key==="exact" ? " · ✅" : " · "+v.icon+" "+v.label.toLowerCase()+" "+money(v.amount); })() : ""}`
          : `🟢 ${bdName(d)} (open) · since ${fmtTime(d.openedAt)}`;
        return `<option value="${d.id}" ${currentDay && d.id===currentDay.id ? "selected" : ""}>${label}</option>`;
      }).join("");
      picker = allDays.length ? `<div class="range-row"><select id="bizDaySelect">${dayOptions}</select></div>` : "";
    } else {
      picker = `<div class="hint-text" style="padding-bottom:10px;">${sDays.length ? `${bdName(fDay)} – ${bdName(lDay)} · ${sDays.length} business day${sDays.length===1?"":"s"}` : "No business days yet"}</div>`;
    }

    const paid = ordersForDays(scope.days).sort((a,b)=>b.paidAt-a.paidAt);
    const panel = type === "closing" ? renderClosingPanel()
      : type === "sales" ? renderSalesReportPanel(scope, paid)
      : type === "items" ? renderItemsPanel(paid)
      : type === "cash" ? renderCashReportPanel(scope)
      : renderOverviewPanel(scope, paid);

    return dayBanner + tabBtns + rangeBtns + picker + panel;
  }

      </div>`;

    const actions = `
      <div class="cb-actions">
        <button class="btn btn-outline" data-cb-add="expense">➖ Expense</button>
        <button class="btn btn-outline" data-cb-add="income">➕ Income</button>
        <button class="btn btn-outline" data-cb-add="transfer">🔀 Transfer</button>
      </div>`;

    const openingRow = `
      <div class="section-head" style="margin-top:4px;">
        <h2 style="font-size:16px;">Opening balance</h2>
        <button class="btn btn-ghost" data-cb-edit-opening="1">Edit</button>
      </div>
      <div class="list-row" style="margin-bottom:18px;">
        <div class="rowmain">
          <div class="rsub">Cash drawer</div>

        </div>
        <div class="rowmain" style="text-align:right;">
          <div class="rsub">Bank</div>
          <div class="rtitle">${money(cb.bankOpeningBalance||0)}</div>
        </div>
      </div>`;

    const adjs = cashCountAdjustments().slice().reverse();
    const adjHtml = adjs.length ? `<div class="cat-chip-header" style="margin-top:18px;">Day-close cash adjustments (already in the drawer balance)</div>` + adjs.map(d=>{
      const v = cashVerdict(d.cashClose.variance);
      return `<div class="list-row"><div class="rowmain"><div class="rtitle">${v.icon} Cash ${v.key==="short"?"shortage":"excess"} at day close</div><div class="rsub">${bdName(d)} · closed ${fmtTime(d.closedAt)}${d.cashClose.note ? " · "+escapeHtml(d.cashClose.note) : ""}</div></div>
        <div class="ractions" style="align-items:center;"><div style="font-weight:700;">${v.sign}${money(v.amount)}</div></div></div>`;
    }).join("") : "";
    let list;
    if(entries.length === 0){
      list = emptyState("📒","No cashbook entries yet","Log an expense, other income, or a drawer ↔ bank transfer with the buttons above.");
    } else {
      list = entries.map(e=>{
        let icon, label;
        if(e.type==="expense"){ icon="➖"; label="Expense · " + (e.account==="drawer"?"Cash drawer":"Bank"); }
        else if(e.type==="income"){ icon="➕"; label="Other income · " + (e.account==="drawer"?"Cash drawer":"Bank"); }
        else if(e.type==="supplier_payment"){ icon="🏪"; label="Supplier payment · " + (e.account==="drawer"?"Cash drawer":"Bank"); }
        else if(e.type==="supplier_payment_reversal"){ icon="↩️"; label="Supplier payment reversed · " + (e.account==="drawer"?"Cash drawer":"Bank"); }
        else { icon="🔀"; label="Transfer · " + (e.from==="drawer" ? "Drawer → Bank" : "Bank → Drawer"); }
        const sign = (e.type==="expense" || e.type==="supplier_payment") ? "-" : (e.type==="income" || e.type==="supplier_payment_reversal") ? "+" : "";
        const isSup = e.type==="supplier_payment" || e.type==="supplier_payment_reversal";   // changed only from the Suppliers screen
        return `
          <div class="list-row">
            <div class="rowmain">
              <div class="rtitle">${icon} ${label}</div>
              <div class="rsub">${whenLabel(e.at, e.businessDayId)}${e.note ? " · " + escapeHtml(e.note) : ""}</div>
            </div>
            <div class="ractions" style="align-items:center; gap:10px;">

              ${isSup ? "" : `<button class="header-menu-btn" data-delete-cashbook-entry="${e.id}">🗑️</button>`}
            </div>
          </div>`;
      }).join("");
    }

    return `${stats}${actions}${openingRow}<div class="section-head"><h2 style="font-size:16px;">All entries</h2></div>${list}${adjHtml}`;

  function renderBilling(){
    const table = state.config.tables.find(t=>t.id===state.activeTableId);
    if(!table){ closeTopOverlay(); return; }
    const order = getOpenOrder(table.id);
    document.getElementById("billingTitle").textContent = table.name;
    const kotLabel = {new:" · Kitchen: New", preparing:" · Kitchen: Preparing", prepared:" · Kitchen: Prepared"};
    document.getElementById("billingSub").textContent = order ? ("Order open · " + fmtElapsed(order.createdAt) + (order.kot ? kotLabel[order.kot.status] : "")) : "Empty order";
    const count = order ? order.items.reduce((s,l)=>s+l.qty,0) : 0;
    const countBadge = document.getElementById("billingCartCount");
    countBadge.style.display = count>0 ? "flex" : "none";
    countBadge.textContent = count;

    const cats = state.config.categories;
    const chips = `<div class="chip-row">
        <button class="chip ${state.billingCategoryFilter==='all'?'active':''}" data-billing-filter="all">All</button>
        ${cats.map(c=>`<button class="chip ${state.billingCategoryFilter===c.id?'active':''}" data-billing-filter="${c.id}">${escapeHtml(c.name)}</button>`).join("")}
      </div>`;

    let items = state.billingCategoryFilter==="all" ? state.config.items : itemsInCategory(state.billingCategoryFilter);
    let grid;
    if(state.config.items.length===0){
      grid = emptyState("🍪","No menu items yet","Add items in the Menu tab before billing.");
    } else if(items.length===0){
      grid = emptyState("🔍","Nothing in this category","Try a different category above.");
    } else {
      grid = `<div class="item-grid">` + items.map(it=>{
        const line = order ? order.items.find(l=>l.itemId===it.id) : null;
        const qty = line ? line.qty : 0;
        return `
          <button class="item-card${it.image?" has-img":""}" data-add-cart="${it.id}">

            <div class="iprice">${money(it.price)}</div>`}

      }).join("") + `</div>`;

  function renderCartBar(){
    // remove existing bar
    const existing = document.getElementById("cartBarEl");
    if(existing) existing.remove();
    const order = getOpenOrder(state.activeTableId);
    if(!order || order.items.length===0) return;
    const total = orderTotal(order);
    const count = order.items.reduce((s,l)=>s+l.qty,0);
    const bar = document.createElement("div");
    bar.id = "cartBarEl";
    bar.className = "cartbar";
    bar.innerHTML = `
      <div>
        <div class="cinfo">${count} item${count===1?"":"s"} in cart</div>
        <div class="ctotal">${money(total)}</div>
      </div>
      <button class="cta" id="viewCartBtn">View cart</button>`;
    document.getElementById("billingOverlay").appendChild(bar);
  }

  function addToCart(itemId){
    const table = state.config.tables.find(t=>t.id===state.activeTableId);
    const item = state.config.items.find(i=>i.id===itemId);
    if(!table || !item) return;
    let order = getOpenOrder(table.id);
    if(!order){
      order = {id:uid(), tableId:table.id, tableName:table.name, items:[], status:"open", createdAt:Date.now()};
      state.orders.push(order);
    }
    let line = order.items.find(l=>l.itemId===itemId);
    if(line) line.qty += 1;
    else order.items.push({itemId:item.id, name:item.name, price:item.price, qty:1, note:""});
    ensureKotSync(order);
    pushOrders();
    renderBilling();
  }

  function changeCartQty(itemId, delta){
    const order = getOpenOrder(state.activeTableId);
    if(!order) return;
    let line = order.items.find(l=>l.itemId===itemId);
    if(!line) return;
    line.qty += delta;
    if(line.qty <= 0){
      order.items = order.items.filter(l=>l.itemId!==itemId);
    }
    if(order.items.length===0){
      state.orders = state.orders.filter(o=>o.id!==order.id);
      // Tombstone it too, not just remove it locally — otherwise the next push's cloud-merge
      // step would see this order id still sitting in Supabase (from when it was first
      // created) and bring the now-emptied cart right back.
      markOrderDeleted(order.id);
      persistDeletedOrderIds();
      state.sheet = null;
      renderSheet();
      // The cart sheet auto-closed programmatically here (not via the back button/backdrop),
      // so pop its entry off the nav stack too -- otherwise the next back-press just consumes
      // this now-stale "sheet" layer instead of actually leaving the billing screen.
      if(layerStack.length && layerStack[layerStack.length-1].type === "sheet"){
        closeTopOverlay();
      }
    } else {
      ensureKotSync(order);
    }
    pushOrders();
    renderBilling();
    if(state.sheet === "cart") renderSheet();
  }
