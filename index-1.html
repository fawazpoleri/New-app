  // Packaged into the Android app, `window.print()` has no effect: a plain Capacitor/Android
  // WebView does not implement the JS print API on its own (that's a Chrome/desktop-browser
  // feature) -- it needs an explicit native hookup to android.print.PrintManager. The KaapiPrint
  // plugin (added to the Android project) provides that hookup; on the web/PWA build, or if the
  // plugin isn't present for any reason, this falls back to the normal window.print() dialog.

  /* ---- Direct Bluetooth print (Web Bluetooth + ESC/POS), 2" / 58mm, 32-char width ---- */
  const ESCPOS_WIDTH = 32;
  const BT_PRINTER_SERVICE_UUIDS = [
    "000018f0-0000-1000-8000-00805f9b34fb",
    "0000ff00-0000-1000-8000-00805f9b34fb",
    "49535343-fe7d-4ae5-8fa9-9fafd205e455",
    "e7810a71-73ae-499d-8c15-faa9aef0c3f2"
  ];
  let btDevice = null;
  let btCharacteristic = null;

  function padRow(left, right, width){
    left = String(left); right = String(right);
    const space = width - left.length - right.length;
    if(space < 1) return (left + " " + right).slice(0, width);
    return left + " ".repeat(space) + right;
  }
  function centerRow(text, width){
    text = String(text);
    if(text.length >= width) return text.slice(0, width);
    return " ".repeat(Math.floor((width - text.length)/2)) + text;
  }
  function wrapRow(text, width){
    text = String(text);
    const out = [];
    for(let i=0;i<text.length;i+=width) out.push(text.slice(i,i+width));
    return out.length ? out : [""];
  }
  function moneyPlain(n){
    n = Number(n)||0;
    return "Rs " + (Number.isInteger(n) ? n : n.toFixed(2));
  }
  function escposEncode(lines){
    const ESC=0x1B, GS=0x1D;
    const bytes = [ESC,0x40]; // init
    const push = str => bytes.push(...Array.from(new TextEncoder().encode(str)));
    push(lines.join("\n") + "\n\n\n");
    bytes.push(GS,0x56,0x42,0x00); // partial cut (ignored by printers without a cutter)
    return new Uint8Array(bytes);
  }

  function buildKOTEscPos(order){
    const W = ESCPOS_WIDTH;
    const lines = [];
    lines.push(centerRow("KITCHEN ORDER", W));
    lines.push("-".repeat(W));
    lines.push(padRow(order.tableName, fmtDateTime(Date.now()), W));
    lines.push("-".repeat(W));
    order.items.forEach(l=>{
      wrapRow(`${String(l.qty)+"x"} ${l.name}`, W).forEach(row=>lines.push(row));
      if(l.note) wrapRow(`  * ${l.note}`, W).forEach(row=>lines.push(row));
    });
    lines.push("-".repeat(W));
    return escposEncode(lines);
  }

  function buildBillEscPos(order){
    const cfg = state.config.settings || {};
    const W = ESCPOS_WIDTH;
    const lines = [];
    lines.push(centerRow(cfg.cafeName || "mycafe", W));
    if(cfg.address) lines.push(centerRow(cfg.address, W));
    if(cfg.phone) lines.push(centerRow(cfg.phone, W));
    if(order.tax){
      if(order.tax.gstin) lines.push(centerRow("GSTIN: "+order.tax.gstin, W));
      lines.push(centerRow("TAX INVOICE", W));
      if(order.tax.stateName) lines.push(centerRow("Supply: "+order.tax.stateName+(order.tax.stateCode?" ("+order.tax.stateCode+")":""), W));
    }
    lines.push("-".repeat(W));
    lines.push(padRow("Bill #"+(order.invoiceNo||""), order.tableName, W));
    lines.push(fmtDateTime(order.paidAt));
    lines.push("-".repeat(W));
    order.items.forEach(l=>{
      wrapRow(l.name, W).forEach(row=>lines.push(row));
      lines.push(padRow(`  ${l.qty} x ${moneyPlain(l.price)}`, moneyPlain(l.price*l.qty), W));
      if(l.note) wrapRow(`  * ${l.note}`, W).forEach(row=>lines.push(row));
    });
    lines.push("-".repeat(W));
    if(order.discount || (order.tax && order.tax.mode==="exclusive")) lines.push(padRow("Subtotal", moneyPlain(order.subtotal), W));
    if(order.discount) lines.push(padRow(`Discount (${order.discount.percent}%)`, "-"+moneyPlain(order.discount.amount), W));
    taxBillLines(order).forEach(l=> lines.push(padRow(l.label, moneyPlain(l.amount), W)));
    lines.push(padRow(order.tax && order.tax.mode==="inclusive" ? "TOTAL (incl GST)" : "TOTAL", moneyPlain(order.total), W));
    lines.push("-".repeat(W));
    if(order.payment.method === "mixed"){
      lines.push(padRow("Cash", moneyPlain(order.payment.cash), W));
      lines.push(padRow("UPI", moneyPlain(order.payment.upi), W));
    } else {
      lines.push(padRow("Paid via", order.payment.method.toUpperCase(), W));
    }
    lines.push("-".repeat(W));
    lines.push(centerRow(cfg.footerNote || "Thank you! Visit again", W));
    return escposEncode(lines);
  }

  async function findWritableCharacteristic(server){
    const services = await server.getPrimaryServices();
    for(const service of services){
      const chars = await service.getCharacteristics();
      const writable = chars.find(c => c.properties.write || c.properties.writeWithoutResponse);
      if(writable) return writable;
    }
    return null;
  }

  async function connectBluetoothPrinter(){
    if(!navigator.bluetooth){
      showToast("Bluetooth printing isn't supported on this browser/device");
      return false;
    }
    try{
      const device = await navigator.bluetooth.requestDevice({
        acceptAllDevices: true,
        optionalServices: BT_PRINTER_SERVICE_UUIDS
      });
      const server = await device.gatt.connect();
      const characteristic = await findWritableCharacteristic(server);
      if(!characteristic) throw new Error("No writable characteristic found on this printer");
      btDevice = device;
      btCharacteristic = characteristic;
      device.addEventListener("gattserverdisconnected", ()=>{ btCharacteristic = null; });
      state.config.settings.printerName = device.name || "Bluetooth printer";
      state.config.settings.printerId = device.id;
      state.config.settings.updatedAt = Date.now();
      persistConfig();
      render();
      showToast("Printer connected: " + (device.name || ""));
      return true;
    }catch(e){
      if(e.name !== "NotFoundError") showToast("Couldn't connect to printer");
      return false;
    }
  }

  async function ensureBluetoothPrinter(){
    if(btCharacteristic) return true;
    // Try a silent reconnect to the last-paired printer (Chrome keeps prior grants per origin).
    if(navigator.bluetooth && navigator.bluetooth.getDevices && state.config.settings.printerId){
      try{
        const known = await navigator.bluetooth.getDevices();
        const match = known.find(d => d.id === state.config.settings.printerId);
        if(match){
          const server = await match.gatt.connect();
          const characteristic = await findWritableCharacteristic(server);
          if(characteristic){
            btDevice = match; btCharacteristic = characteristic;
            match.addEventListener("gattserverdisconnected", ()=>{ btCharacteristic = null; });
            return true;
          }
        }
      }catch(e){ /* fall through to explicit connect prompt */ }
    }
    return connectBluetoothPrinter();
  }

  async function sendToBluetoothPrinter(bytes){
    const ok = await ensureBluetoothPrinter();
    if(!ok || !btCharacteristic) return false;
    const CHUNK = 180; // keep well under typical BLE write payload limits
    try{
      for(let i=0;i<bytes.length;i+=CHUNK){
        const chunk = bytes.slice(i, i+CHUNK);
        if(btCharacteristic.properties.writeWithoutResponse) await btCharacteristic.writeValueWithoutResponse(chunk);
        else await btCharacteristic.writeValue(chunk);
      }
      return true;
    }catch(e){
      showToast("Print failed — check printer connection");
      btCharacteristic = null;
      return false;
    }
  }

      ${(day.cashClose && day.cashClose.variance) ? `<div class="rp-row"><span>Cash count adjustment — Cash drawer (${day.cashClose.variance<0?"shortage":"excess"})</span><span class="${day.cashClose.variance<0?"amt-expense":"amt-income"}">${day.cashClose.variance<0?"−":"+"} ${money(Math.abs(day.cashClose.variance))}</span></div>` : ""}
      <div class="rp-row bold"><span>Closing balance — Cash drawer</span><span>${money(closeBal.drawer)}</span></div>

  // Used by downloadBusinessDayPdf: hands the doc to the native Android print
  // plugin when present, otherwise opens it in a new tab and triggers that
  // tab's own print dialog (the route to the browser's built-in "Save as PDF").
  function printReportHtml(html, jobName){
    const fullHtml = `<!DOCTYPE html><html><head><meta charset="UTF-8"><title>${jobName}</title><style>${REPORT_PRINT_CSS}</style></head><body>${html}</body></html>`;
    const KaapiPrint = nativePrintPlugin();
    if(KaapiPrint){
      KaapiPrint.printHtml({html: fullHtml, jobName}).catch(e=>{
        console.error("native print failed", e);
        showToast("Print failed — check printer connection");
      });
      return;
    }
    const win = window.open("", "_blank");
    if(!win){ showToast("Allow pop-ups to download the report"); return; }
    win.document.open();
    win.document.write(fullHtml);
    win.document.close();
    const triggerPrint = () => { try{ win.focus(); win.print(); }catch(e){} };
    win.onload = triggerPrint;
    setTimeout(triggerPrint, 300);
  }

  function renderPayment(){
    const order = getOpenOrder(state.activeTableId);
    if(!order){ closeTopOverlay(); return; }
    const discountOn = Authz.canApplyDiscount() && !!(state.config.settings && state.config.settings.discountEnabled);
    const pr = priceOrder(order.items, state.discountPercent, discountOn);
    const subtotal = pr.subtotal, total = pr.total;
    const disc = pr.discount || {percent:0, amount:0};
    document.getElementById("paymentSub").textContent = order.tableName;

    const methods = ["cash","upi","mixed"].map(m=>{
      const icon = m==="cash"?"💵":m==="upi"?"📱":"🔀";
      const label = m==="cash"?"Cash":m==="upi"?"UPI":"Split";
      return `<button class="pay-method ${state.paymentMethod===m?"active":""}" data-pay-method="${m}">
        <div class="picon">${icon}</div><div class="plabel">${label}</div>
      </button>`;
    }).join("");

    let splitHtml = "";
    let confirmDisabled = !state.paymentMethod;
    if(state.paymentMethod === "mixed"){
      const cashVal = parseFloat(state.splitCash)||0;
      const upiVal = parseFloat(state.splitUpi)||0;
      const remaining = +(total - cashVal - upiVal).toFixed(2);
      // Negative amounts can sum to the right total (e.g. cash:-50, upi:total+50) while being
      // meaningless as an actual cash-drawer/UPI split, so they're rejected explicitly rather
      // than relying on the sum check alone.
      const hasNegative = cashVal < 0 || upiVal < 0;
      splitHtml = `
        <div class="split-inputs">
          <div class="split-field">
            <label>Cash amount</label>
            <input type="number" inputmode="decimal" min="0" id="splitCashInput" placeholder="0" value="${state.splitCash}">
          </div>
          <div class="split-field">
            <label>UPI amount</label>
            <input type="number" inputmode="decimal" min="0" id="splitUpiInput" placeholder="0" value="${state.splitUpi}">
          </div>
        </div>
        <div class="remaining-note ${(remaining===0 && !hasNegative)?"ok":"bad"}">
          ${hasNegative ? "Amounts can't be negative" : (remaining===0 ? "Amounts match the total ✓" : (remaining>0 ? `${money(remaining)} remaining` : `${money(Math.abs(remaining))} over the total`))}
        </div>`;
      confirmDisabled = remaining !== 0 || hasNegative;
    }

    let discountHtml = "";
    let totalsHtml = `
      <div class="pay-total">
        <div class="label">Amount due</div>
        <div class="bigtotal">${money(total)}</div>
      </div>`;

    if(discountOn || pr.tax){
      discountHtml = !discountOn ? "" : `
        <div class="field" style="margin-top:0;">
          <label>Discount (%)</label>
          <input type="number" inputmode="decimal" min="0" max="100" id="discountInput" placeholder="0" value="${state.discountPercent}">
        </div>`;
      totalsHtml = `
        <div class="pay-total" style="text-align:left;">
          ${(discountOn || !pr.tax || pr.tax.mode==="exclusive") ? `<div class="r-row"><span>Subtotal</span><span>${money(subtotal)}</span></div>` : `<div class="r-row"><span>Items (prices include GST)</span><span>${money(subtotal)}</span></div>`}
          ${disc.amount>0 ? `<div class="r-row"><span>Discount (${disc.percent}%)</span><span>-${money(disc.amount)}</span></div>` : ""}

  // Put a sale back exactly as it was before an unconfirmed change.
  function restoreOrder(prev){
    const i = state.orders.findIndex(o => o.id === prev.id);
    if(i >= 0) state.orders[i] = prev; else state.orders.push(prev);
  }
  // Save-or-rollback for a sale that's already been mutated in memory: writes straight to
  // Supabase and only keeps the change if Supabase confirms. No internet → rolled back.
  async function pushOrdersConfirmed(rollback){
    const ok = await pushOrders(0, true);
    if(!ok){
      rollback();
      saveFailedToast();
      if(!state.modal) render();
    }
    return ok;
  }
  // Void a completed sale — ADMIN only. The database enforces this (orders DELETE policy +
  // orders_guard trigger) and writes a SALE_VOID audit row. Removed on screen only once confirmed.
  async function deleteSaleConfirmed(id){
    if(!supabaseClient || !need("sale.void")) return false;
    pendingWriteCount++;
    localWriteVersion++;
    setSyncStatus("syncing");
    try{
      await DL.deleteOrder(id);
      state.orders = state.orders.filter(o => o.id !== id);
      ordersSnapshot.delete(id);
      setSyncStatus("synced");
      return true;
    }catch(e){
      console.error("sale void failed — nothing deleted", e);
      handleDbError(e);
      setSyncStatus(navigator.onLine === false ? "offline" : "error");
      if(e && e.denied) showToast("Not permitted — only an Admin can void a sale");
      else saveFailedToast();
      return false;
    } finally {
      pendingWriteCount--;
    }
  }

  let paymentSaving = false;
  async function confirmPayment(){
    if(paymentSaving) return;
    const order = getOpenOrder(state.activeTableId);
    if(!order) return;
    const discountOn = Authz.canApplyDiscount() && !!(state.config.settings && state.config.settings.discountEnabled);
    const pr = priceOrder(order.items, state.discountPercent, discountOn);
    const subtotal = pr.subtotal, total = pr.total;
    let payment;
    if(state.paymentMethod === "cash") payment = {method:"cash", cash:total, upi:0, total};
    else if(state.paymentMethod === "upi") payment = {method:"upi", cash:0, upi:total, total};
    else {
      const cashVal = parseFloat(state.splitCash)||0;
      const upiVal = parseFloat(state.splitUpi)||0;
      const remaining = +(total - cashVal - upiVal).toFixed(2);
      // Hard server-side-style guard, independent of the button's disabled state — protects
      // against a stale render or a directly-fired confirm still carrying a bad split.
      if(cashVal < 0 || upiVal < 0 || remaining !== 0){
        showToast("Cash + UPI must be non-negative and equal the total");
        return;
      }
      payment = {method:"mixed", cash:cashVal, upi:upiVal, total};
    }

    const now = Date.now();
    const prevOrder = clone(order);   // to undo if Supabase doesn't confirm
    paymentSaving = true;
    const payBtn = document.getElementById("confirmPaymentBtn");
    if(payBtn){ payBtn.disabled = true; payBtn.textContent = "Saving…"; }
    try{
    order.status = "paid";
    order.subtotal = subtotal;
    order.discount = pr.discount;
    order.tax = pr.tax;          // GST snapshot (null when GST is off) — the database recomputes it for cashiers
    order.total = total;
    order.payment = payment;
    order.paidAt = now;          // provisional — the database stamps the real paid time
    // Invoice number, paid time and business day are assigned by the DATABASE when the sale is
    // saved (atomic counter + business-day rules in orders_guard). The client can't choose them.
    try{
      const day = await DL.ensureBusinessDay();
      adoptBusinessDay(day);
      order.businessDayId = day.id;
    }catch(e){
      handleDbError(e);
      restoreOrder(prevOrder);
      saveFailedToast();
      renderPayment();
      return;
    }
    if(!(await pushOrdersConfirmed(() => restoreOrder(prevOrder)))){
      renderPayment();
      return;
    }
    renderPaymentSuccess(order);
    } finally {
      paymentSaving = false;
    }
  }

  function renderPaymentSuccess(order){
    document.getElementById("paymentSub").textContent = order.tableName;
    document.getElementById("paymentBody").innerHTML = `
      <div style="text-align:center; padding:34px 10px 10px;">
        <div style="font-size:46px;">✅</div>
        <div style="font-weight:700; font-size:17px; margin-top:10px;">Payment recorded</div>
        <div style="color:var(--text-dim); margin-top:4px; font-size:14px;">${money(order.total)} · ${order.payment.method.toUpperCase()}</div>
      </div>
      <button class="btn btn-outline btn-block" id="printBillBtn" style="margin-bottom:10px;">🧾 Print bill</button>
      <button class="btn btn-amber btn-block" id="paymentDoneBtn">Done</button>`;
    state.completedOrder = order;
  }

            <button class="btn ${showDelete?"btn-danger":"btn-amber"}" id="modalSave" ${(changePaymentInvalid||cashbookInvalid||closeInvalid)?"disabled":""}>${saveLabel || (showDelete?"Delete":"Save")}</button>

  let modalSaving = false;
  async function saveModal(){
    if(modalSaving || !state.modal) return;
    modalSaving = true;
    const saveBtn = document.getElementById("modalSave");
    const saveLabelText = saveBtn ? saveBtn.textContent : "";
    if(saveBtn){ saveBtn.disabled = true; saveBtn.textContent = "Saving…"; }
    try{
      await saveModalInner();
    } finally {
      modalSaving = false;
      const b = document.getElementById("modalSave");
      if(b && state.modal){ b.disabled = false; b.textContent = saveLabelText; }   // modal stayed open = save failed, allow retry
    }
  }
  // Which permission each modal's save needs (UI check — the database re-checks every write).
  const MODAL_PERMS = {category:"categories.manage", item:"products.manage", table:"tables.manage",
    editBill:"sale.edit", changePayment:"sale.edit", confirmDeleteOrder:"sale.void",
    cashbookEntry:"expenses.manage", cashbookOpening:"expenses.manage", confirmDeleteCashbookEntry:"expenses.manage",
    confirmCloseDay:"businessday.manage", addCashier:"users.manage", renameUser:"users.manage",
    confirmToggleUser:"users.manage", confirmResetUser:"users.manage", setUserPassword:"users.manage"};
  async function saveModalInner(){
    const {type, data} = state.modal;
    const modalRef = state.modal;
    // The person may have dismissed the modal while the save was in flight — don't close a different layer.
    const closeIfOpen = () => { if(state.modal === modalRef) closeTopOverlay(); };
    if(type === "dayClosedSummary"){ closeIfOpen(); return; }
    if(MODAL_PERMS[type] && !need(MODAL_PERMS[type])) return;
    if(type === "changePassword"){
      // any signed-in user may change THEIR OWN password (no permission needed; current password is re-checked)
      const cur = $id("mPwCurrent").value, n1 = $id("mPwNew").value, n2 = $id("mPwNew2").value;
      if(!cur){ showToast("Enter your current password"); return; }
      if(n1.length < 8){ showToast("New password must be at least 8 characters"); return; }
      if(n1 !== n2){ showToast("The new passwords don't match"); return; }
      try{ await Auth.changePassword(cur, n1); }
      catch(e){ showToast(e.message || "Couldn't change the password"); return; }
      showToast("Password changed");
      closeIfOpen();
      return;
    }
    if(["addCashier","renameUser","confirmToggleUser","confirmResetUser","setUserPassword"].includes(type)){
      if(!(await saveUserModal(type, data))) return;
      render();
      closeIfOpen();
      return;
    }
    if(type === "category"){
      const name = document.getElementById("mCatName").value.trim();
      if(!name){ showToast("Enter a category name"); return; }
      if(data.id){
        const c = state.config.categories.find(c=>c.id===data.id);
        c.name = name; c.updatedAt = Date.now();
      } else {
        state.config.categories.push({id:uid(), name, updatedAt:Date.now()});
      }
    } else if(type === "item"){
      const name = document.getElementById("mItemName").value.trim();
      const price = parseFloat(document.getElementById("mItemPrice").value);
      const categoryId = document.getElementById("mItemCat").value;
      const imgEl = document.getElementById("mItemImg");
      const itemImg = imgEl ? imgEl.value : "";
      if(!name){ showToast("Enter an item name"); return; }
      if(isNaN(price) || price < 0){ showToast("Enter a valid price"); return; }
      const gstEl = document.getElementById("mItemGst");
      let gstRate;                                   // undefined = use the default rate
      if(gstEl && gstEl.value.trim()!==""){
        gstRate = parseFloat(gstEl.value);
        if(isNaN(gstRate) || gstRate < 0 || gstRate > 100){ showToast("GST rate must be between 0 and 100"); return; }
        gstRate = Math.round(gstRate*100)/100;
      }
      if(data.id){
        const it = state.config.items.find(i=>i.id===data.id);
        it.name = name; it.price = price; it.categoryId = categoryId; it.updatedAt = Date.now();
        if(itemImg) it.image = itemImg; else delete it.image;
        if(gstEl){ if(gstRate===undefined) delete it.gstRate; else it.gstRate = gstRate; }
      } else {
        const ni = {id:uid(), name, price, categoryId, updatedAt:Date.now()};
        if(itemImg) ni.image = itemImg;
        if(gstRate!==undefined) ni.gstRate = gstRate;
        state.config.items.push(ni);
      }
    } else if(type === "table"){
      const name = document.getElementById("mTableName").value.trim();
      if(!name){ showToast("Enter a table name"); return; }
      if(data.id){
        const t = state.config.tables.find(t=>t.id===data.id);
        t.name = name; t.updatedAt = Date.now();
      } else {
        state.config.tables.push({id:uid(), name, updatedAt:Date.now()});
      }
    } else if(type === "editBill"){
      if(data.items.length === 0){ showToast("Bill must have at least one item"); return; }
      const order = state.orders.find(o=>o.id===data.orderId);
      if(!order){ showToast("Couldn't find that bill"); closeTopOverlay(); return; }
      const prevOrder = clone(order);
      const savePr = priceOrder(data.items, data.discount ? data.discount.percent : 0, !!data.discount, ebTaxCfg(order));
      const newSubtotal = savePr.subtotal;
      const newTotal = savePr.total;
      order.items = data.items.map(l=>({...l}));
      order.subtotal = newSubtotal;
      if(order.discount){ order.discount.amount = savePr.discount ? savePr.discount.amount : 0; }
      order.tax = savePr.tax;
      order.total = newTotal;
      if(order.payment){
        if(order.payment.method === "cash"){ order.payment.cash = newTotal; order.payment.total = newTotal; }
        else if(order.payment.method === "upi"){ order.payment.upi = newTotal; order.payment.total = newTotal; }
        else {
          // Mixed/split payment: previously this only updated payment.total, leaving the
          // cash/upi split at its pre-edit amounts -- so editing a split-paid bill made
          // cash+upi silently stop matching the new total (wrong cash-drawer reconciliation
          // in Reports and on any reprinted bill). Rescale cash/upi to keep the original
          // split ratio while guaranteeing cash+upi === newTotal exactly.
          const oldTotal = order.payment.total || (order.payment.cash + order.payment.upi) || 0;
          const cashShare = oldTotal > 0 ? order.payment.cash / oldTotal : 0.5;
          const newCash = Math.round(newTotal * cashShare * 100) / 100;
          order.payment.cash = newCash;
          order.payment.upi = +(newTotal - newCash).toFixed(2);
          order.payment.total = newTotal;
        }
      }
      order.editedAt = Date.now();
      // Saved straight to Supabase; no internet → change rolled back, modal stays open.
      if(!(await pushOrdersConfirmed(() => restoreOrder(prevOrder)))) return;
      render();
      closeIfOpen();
      showToast("Bill updated");
      return;
    } else if(type === "changePayment"){
      const order = state.orders.find(o=>o.id===data.orderId);
      if(!order){ showToast("Couldn't find that bill"); closeTopOverlay(); return; }
      if(!data.method){ showToast("Choose a payment mode"); return; }
      let payment;
      if(data.method === "cash") payment = {method:"cash", cash:order.total, upi:0, total:order.total};
      else if(data.method === "upi") payment = {method:"upi", cash:0, upi:order.total, total:order.total};
      else {
        const cashVal = parseFloat(data.cash)||0;
        const upiVal = parseFloat(data.upi)||0;
        const remaining = +(order.total - cashVal - upiVal).toFixed(2);
        if(cashVal < 0 || upiVal < 0 || remaining !== 0){ showToast("Cash + UPI must be non-negative and equal the total"); return; }
        payment = {method:"mixed", cash:cashVal, upi:upiVal, total:order.total};
      }
      const prevOrder = clone(order);
      order.payment = payment;
      order.editedAt = Date.now();
      // Saved straight to Supabase; no internet → change rolled back, modal stays open.
      if(!(await pushOrdersConfirmed(() => restoreOrder(prevOrder)))) return;
      render();
      closeIfOpen();
      showToast("Payment mode updated");
      return;
    } else if(type === "confirmDeleteOrder"){
      // Deleted in Supabase first; only removed on screen once that's confirmed.
      if(!(await deleteSaleConfirmed(data.orderId))) return;
      if(state.expandedOrderId === data.orderId) state.expandedOrderId = null;
      render();
      closeIfOpen();
      showToast("Sale deleted");
      return;
    } else if(type === "cashbookEntry"){
      const amount = parseFloat(document.getElementById("mCbAmount").value);
      const note = document.getElementById("mCbNote").value.trim();
      if(isNaN(amount) || amount <= 0){ showToast("Enter a valid amount"); return; }
      if(data.type === "transfer"){
        const from = data.from || "drawer";
        const to = from === "drawer" ? "bank" : "drawer";
        // Hard guard, independent of the button's disabled state — mirrors the mixed-payment
        // split check above. Transferring more than an account actually holds would take it
        // negative, which isn't a real balance a drawer or bank account can have.
        const available = from === "drawer" ? cashbookBalances().drawer : cashbookBalances().bank;
        if(amount > available){ showToast(`Not enough in ${from==="drawer"?"the cash drawer":"the bank"} — only ${money(available)} available`); return; }
        if(!(await addCashbookEntry({type:"transfer", from, to, amount, note}))) return;
        showToast("Transfer recorded");
      } else {
        const account = data.account || "drawer";
        if(data.type === "expense"){
          const available = account === "drawer" ? cashbookBalances().drawer : cashbookBalances().bank;
          if(amount > available){ showToast(`Not enough in ${account==="drawer"?"the cash drawer":"the bank"} — only ${money(available)} available`); return; }
        }
        if(!(await addCashbookEntry({type:data.type, account, amount, note}))) return;
        showToast(data.type==="expense" ? "Expense recorded" : "Income recorded");
      }
      render();
      closeIfOpen();
      return;
    } else if(type === "cashbookOpening"){
      const drawer = parseFloat(document.getElementById("mCbOpenDrawer").value) || 0;
      const bank = parseFloat(document.getElementById("mCbOpenBank").value) || 0;
      if(!(await setCashbookOpeningBalances(drawer, bank))) return;
      render();
      closeIfOpen();
      showToast("Opening balance updated");
      return;
    } else if(type === "confirmDeleteCashbookEntry"){
      if(!(await deleteCashbookEntry(data.id))) return;
      render();
      closeIfOpen();
      showToast("Entry deleted");
      return;
    } else if(type === "confirmCloseDay"){
      // Re-read the newest sales first, so the saved Expected figure can never be built from stale data.
      try{ await pullLatestForClose(); }
      catch(err){ showToast("Couldn't check the latest sales — check your internet and try again"); return; }
      const openDay = getOpenBusinessDay();
      if(!openDay || openDay.id !== data.dayId){ showToast("This day is no longer open — refresh and try again"); closeIfOpen(); render(); return; }
      const noteEl = document.getElementById("mCloseNote"); if(noteEl) data.note = noteEl.value;
      const cnt = parseCounted(data.counted);
      if(!cnt.valid){ showToast("Enter a valid cash amount"); return; }
      let cashCount = null;
      if(!cnt.empty){
        const freshExpected = expectedDrawerCash();
        if(data.shownExpected !== undefined && Math.abs(freshExpected - data.shownExpected) > 0.004){
          renderModal(true);       // redraw with the new figures
          showToast("Sales or cashbook changed meanwhile — check the figures, then tap Close day again");
          return;
        }
        cashCount = {counted: cnt.value, note: data.note || ""};
      }
      if(!(await closeBusinessDay(cashCount))) return;
      if(state.modal === modalRef){ state.modal = {type:"dayClosedSummary", data:{dayId: openDay.id}}; renderModal(); }
      showToast("Day closed");
      return;
    }
    if(!(await persistConfig())) return;   // saved to Supabase or rolled back — modal stays open on failure
    render();
    closeIfOpen();
  }

  async function deleteCategory(id){
    if(!need("categories.manage")) return;
    if(itemsInCategory(id).length > 0){
      showToast("Move or delete its items first");
      return;
    }
    state.config.categories = state.config.categories.filter(c=>c.id!==id);
    tombstone("deletedCategoryIds", id);
    await persistConfig(); render();
  }
  async function deleteItem(id){
    if(!need("products.manage")) return;
    state.config.items = state.config.items.filter(i=>i.id!==id);
    tombstone("deletedItemIds", id);
    await persistConfig(); render();
  }
  async function deleteTable(id){
    if(!need("tables.manage")) return;
    if(getOpenOrder(id)){ showToast("Table has an open order"); return; }
    state.config.tables = state.config.tables.filter(t=>t.id!==id);
    tombstone("deletedTableIds", id);
    await persistConfig(); render();
  }
  // Records that a category/item/table was deleted ON PURPOSE, the same way deletedOrderIds
  // does for sales — otherwise a merge against an older cloud config (see mergeConfig) can't
  // tell "another device added this and I haven't synced it yet" apart from "I deleted this
  // and the cloud just hasn't caught up", and would silently resurrect the deleted record.
  function tombstone(listName, id){
    if(!state.config[listName]) state.config[listName] = [];
    if(!state.config[listName].includes(id)) state.config[listName].push(id);
  }

  function onModalInput(e){
    if(!state.modal) return;
    const data = state.modal.data;
    if(state.modal.type === "changePayment"){
      if(e.target.id === "mSplitCash"){ data.cash = e.target.value; renderModalKeepFocus("mSplitCash"); }
      if(e.target.id === "mSplitUpi"){ data.upi = e.target.value; renderModalKeepFocus("mSplitUpi"); }
      return;
    }
    if(state.modal.type === "confirmCloseDay"){
      const noteEl = document.getElementById("mCloseNote");
      if(noteEl) data.note = noteEl.value;
      if(e.target.id === "mCloseCounted"){ data.counted = e.target.value; renderModalKeepFocus("mCloseCounted"); }
      return;
    }
    if(state.modal.type === "cashbookEntry"){
      if(e.target.id === "mCbAmount"){
        // Capture the note field too before re-rendering, so the amount's live validation
        // note doesn't blow away a note the person is mid-typing in the other field.
        const noteEl = document.getElementById("mCbNote");
        if(noteEl) data.note = noteEl.value;
        data.amount = e.target.value;
        renderModalKeepFocus("mCbAmount");
      }
      return;
    }
    if(state.modal.type === "editBill"){
      const noteInput = e.target.closest("[data-ebill-note]");
      if(noteInput){
        const itemId = noteInput.dataset.ebillNote;
        const line = data.items.find(l=>l.itemId===itemId);
        if(line){
          line.note = noteInput.value;
          const selStart = noteInput.selectionStart, selEnd = noteInput.selectionEnd;
          renderModal(true);
          const el = document.querySelector(`[data-ebill-note="${itemId}"]`);
          if(el){ el.focus(); try{ el.setSelectionRange(selStart, selEnd); }catch(err){} }
        }
        return;
      }
    }
  }
  function renderModalKeepFocus(id){
    renderModal(true);
    const el = document.getElementById(id);
    if(el){ el.focus(); const v = el.value; el.value=""; el.value=v; }
  }

      const id = toggleBizDay.dataset.toggleBizday;
      state.expandedBusinessDayId = state.expandedBusinessDayId === id ? null : id;
      render(); return;
    }
    if(e.target.id === "closeDayBtn"){
      if(!need("businessday.manage")) return;
      try{ await pullLatestForClose(); }catch(err){ showToast("Offline — the figures below may be out of date"); }
      const day = getOpenBusinessDay();
      if(day) openModal("confirmCloseDay", {dayId: day.id, openedAt: day.openedAt});
      else { render(); showToast("This day is already closed"); }
      return;
    }

    const cbAddBtn = e.target.closest("[data-cb-add]");
    if(cbAddBtn){
      if(!need("expenses.manage")) return;
      const t = cbAddBtn.dataset.cbAdd;
      openModal("cashbookEntry", t==="transfer" ? {type:"transfer", from:"drawer", amount:"", note:""} : {type:t, account:"drawer", amount:"", note:""});
      return;
    }
    if(e.target.closest("[data-cb-edit-opening]")){
      if(!need("expenses.manage")) return;
      openModal("cashbookOpening", {drawer: state.config.cashbook.drawerOpeningBalance||0, bank: state.config.cashbook.bankOpeningBalance||0});
      return;
    }
    const delCbEntry = e.target.closest("[data-delete-cashbook-entry]");
    if(delCbEntry){
      if(!need("expenses.manage")) return;
      const entry = cashbookEntries().find(en=>en.id===delCbEntry.dataset.deleteCashbookEntry);
      if(entry){
        const label = entry.type==="expense" ? "expense" : entry.type==="income" ? "income" : "transfer";
        openModal("confirmDeleteCashbookEntry", {id:entry.id, amount:entry.amount, label});
      }
      return;
    }

    if(e.target.closest("[data-add-category]")) return need("categories.manage") && openModal("category", {});
    const editCat = e.target.closest("[data-edit-category]");
    if(editCat) return need("categories.manage") && openModal("category", state.config.categories.find(c=>c.id===editCat.dataset.editCategory));
    const delCat = e.target.closest("[data-delete-category]");
    if(delCat) return need("categories.manage") && deleteCategory(delCat.dataset.deleteCategory);

    if(e.target.closest("[data-add-item]")) return need("products.manage") && openModal("item", {categoryId: state.config.categories[0] ? state.config.categories[0].id : ""});
    const editItem = e.target.closest("[data-edit-item]");
    if(editItem) return need("products.manage") && openModal("item", state.config.items.find(i=>i.id===editItem.dataset.editItem));
    const delItem = e.target.closest("[data-delete-item]");
    if(delItem) return need("products.manage") && deleteItem(delItem.dataset.deleteItem);

    if(e.target.closest("[data-add-table]")) return need("tables.manage") && openModal("table", {});
    const editTable = e.target.closest("[data-edit-table]");
    if(editTable) return need("tables.manage") && openModal("table", state.config.tables.find(t=>t.id===editTable.dataset.editTable));
    const delTable = e.target.closest("[data-delete-table]");
    if(delTable && !delTable.disabled) return need("tables.manage") && deleteTable(delTable.dataset.deleteTable);

    if(e.target.closest("[data-save-settings]")){
      if(!need("settings.manage")) return;
      state.config.settings = {
        ...state.config.settings,
        cafeName: document.getElementById("sCafeName").value.trim() || "mycafe",
        address: document.getElementById("sAddress").value.trim(),
        phone: document.getElementById("sPhone").value.trim(),
        footerNote: document.getElementById("sFooter").value.trim() || "Thank you! Visit again",
        updatedAt: Date.now()
      };
      if(await persistConfig()) showToast("Details saved");
      return;
    }

    if(e.target.closest("[data-toggle-direct-print]")){
      if(!need("settings.manage")) return;
      state.config.settings.directPrint = !state.config.settings.directPrint;
      state.config.settings.updatedAt = Date.now();
      persistConfig();
      render();
      return;
    }

    if(e.target.closest("[data-toggle-gst]")){
      if(!need("settings.manage")) return;
      const g0 = state.config.settings.gst || {};
      if(!g0.enabled && !(await gstDbReady())){
        showToast("Database update needed first: run 0007_gst.sql in the Supabase SQL Editor, then try again", 6000);
        return;
      }
      state.config.settings.gst = {rate:5, mode:"exclusive", split:"cgst_sgst", gstin:"", stateCode:"", stateName:"", ...g0, enabled: !g0.enabled};
      state.config.settings.updatedAt = Date.now();
      persistConfig();
      render();
      return;
    }
    if(e.target.closest("[data-save-gst]")){
      if(!need("settings.manage")) return;
      const rate = parseFloat(document.getElementById("sGstRate").value);
      if(isNaN(rate) || rate < 0 || rate > 100){ showToast("Enter a GST rate between 0 and 100"); return; }
      const gstin = document.getElementById("sGstin").value.trim().toUpperCase();
      let stateCode = document.getElementById("sGstState").value;
      if(gstin){
        if(!GSTIN_RE.test(gstin)){ showToast("That GSTIN isn't valid — it has 15 letters/digits, e.g. 29ABCDE1234F1Z5"); return; }
        const fromGstin = gstin.slice(0,2);
        if(stateCode && stateCode !== fromGstin){
          const nm = (GST_STATES.find(x=>x[0]===fromGstin)||[])[1] || fromGstin;
          showToast(`GSTIN starts with ${fromGstin} (${nm}) — pick that state or fix the GSTIN`); return;
        }
        if(!stateCode && GST_STATES.some(x=>x[0]===fromGstin)) stateCode = fromGstin;
      }
      const stateName = (GST_STATES.find(x=>x[0]===stateCode)||[])[1] || "";
      state.config.settings.gst = {
        enabled:true, mode: document.getElementById("sGstMode").value==="inclusive" ? "inclusive" : "exclusive",
        rate: Math.round(rate*100)/100, split: document.getElementById("sGstSplit").value==="igst" ? "igst" : "cgst_sgst",
        gstin, stateCode, stateName
      };
      state.config.settings.updatedAt = Date.now();
      if(await persistConfig()){ render(); showToast("GST settings saved"); }
      return;
    }

    if(e.target.closest("[data-toggle-discount]")){
      if(!need("settings.manage")) return;
      state.config.settings.discountEnabled = !state.config.settings.discountEnabled;
      state.config.settings.updatedAt = Date.now();
      persistConfig();
      render();
      return;
    }

    if(e.target.closest("[data-connect-printer]")){
      connectBluetoothPrinter();
      return;
    }
  }

  document.addEventListener("change", (e)=>{
    if(e.target && (e.target.id === "reportFromDay" || e.target.id === "reportToDay")){
      const sc = reportScope(), f = sc.days[0], l = sc.days[sc.days.length-1];
      state.reportFromDayId = e.target.id === "reportFromDay" ? e.target.value : (f ? f.id : null);
      state.reportToDayId   = e.target.id === "reportToDay"   ? e.target.value : (l ? l.id : null);
      state.dailySel = null;
      render();
    }
    if(e.target && e.target.id === "bizDaySelect"){
      state.reportBizDayId = e.target.value;
      render();
    }
  });

  function onBillingClick(e){
    const filter = e.target.closest("[data-billing-filter]");
    if(filter){ state.billingCategoryFilter = filter.dataset.billingFilter; renderBilling(); return; }
    const addCart = e.target.closest("[data-add-cart]");
    if(addCart){ addToCart(addCart.dataset.addCart); return; }
  }

  function onSheetClick(e){
    if(e.target.id === "sheetBackdrop" || e.target.id === "closeSheet"){
      closeTopOverlay(); return;
    }
    const inc = e.target.closest("[data-cart-inc]");
    if(inc){ changeCartQty(inc.dataset.cartInc, 1); return; }
    const dec = e.target.closest("[data-cart-dec]");
    if(dec){ changeCartQty(dec.dataset.cartDec, -1); return; }
    if(e.target.id === "holdOrderBtn"){ showToast("Order held"); closeOverlaysCount(layerStack.length); return; }
    if(e.target.id === "checkoutBtn"){ openPayment(); return; }
  }

  function onSheetInput(e){
    const noteInput = e.target.closest("[data-note-input]");
    if(!noteInput) return;
    const itemId = noteInput.dataset.noteInput;
    const order = getOpenOrder(state.activeTableId);
    if(!order) return;
    const line = order.items.find(l=>l.itemId===itemId);
    if(!line) return;
    line.note = noteInput.value;
    scheduleOrdersPush();
    renderSheetKeepFocus(noteInput);
  }
  function renderSheetKeepFocus(sourceEl){
    const itemId = sourceEl.dataset.noteInput;
    const selStart = sourceEl.selectionStart, selEnd = sourceEl.selectionEnd;
    renderSheet();
    const el = document.querySelector(`[data-note-input="${itemId}"]`);
    if(el){ el.focus(); try{ el.setSelectionRange(selStart, selEnd); }catch(err){} }
  }

  function onPaymentClick(e){
    const m = e.target.closest("[data-pay-method]");
    if(m){ state.paymentMethod = m.dataset.payMethod; renderPayment(); return; }
    if(e.target.id === "confirmPaymentBtn" && !e.target.disabled){
      // Disable immediately (before confirmPayment's own state-based guard even runs) so a
      // rapid double-tap can't fire two click events against the same still-mid-render button.
      e.target.disabled = true;
      confirmPayment();
      return;
    }
    if(e.target.id === "printBillBtn"){ printBill(state.completedOrder); return; }
    if(e.target.id === "paymentDoneBtn"){ showToast("Table freed"); closeOverlaysCount(layerStack.length); return; }
  }
  function onPaymentInput(e){
    if(e.target.id === "splitCashInput"){ state.splitCash = e.target.value; renderPaymentKeepFocus("splitCashInput"); }
    if(e.target.id === "splitUpiInput"){ state.splitUpi = e.target.value; renderPaymentKeepFocus("splitUpiInput"); }
    if(e.target.id === "discountInput"){ state.discountPercent = e.target.value; renderPaymentKeepFocus("discountInput"); }
  }
  function renderPaymentKeepFocus(id){
    renderPayment();
    const el = document.getElementById(id);
    if(el){ el.focus(); const v = el.value; el.value=""; el.value=v; }
  }

  function onModalClick(e){
    if(e.target.id === "modalBackdrop" || e.target.id === "modalCancel"){ closeTopOverlay(); return; }
    if(e.target.id === "modalSave"){ saveModal(); return; }
    if(e.target.id === "modalPdf" && state.modal && state.modal.type === "dayClosedSummary"){ downloadBusinessDayPdf(state.modal.data.dayId); return; }

    if(state.modal && state.modal.type === "cashbookEntry"){
      const data = state.modal.data;
      // Capture whatever's currently typed before any button click re-renders the modal,
      // so switching Type/Account/Direction never wipes out an amount or note in progress.
      const amountEl = document.getElementById("mCbAmount");
      const noteEl = document.getElementById("mCbNote");
      if(amountEl) data.amount = amountEl.value;
      if(noteEl) data.note = noteEl.value;
      const typeBtn = e.target.closest("[data-cb-type]");
      if(typeBtn){
        data.type = typeBtn.dataset.cbType;
        if(data.type !== "transfer" && !data.account) data.account = "drawer";
        if(data.type === "transfer" && !data.from) data.from = "drawer";
        renderModal();
        return;
      }
      const acctBtn = e.target.closest("[data-cb-account]");
      if(acctBtn){ data.account = acctBtn.dataset.cbAccount; renderModal(); return; }
      const dirBtn = e.target.closest("[data-cb-dir]");
      if(dirBtn){ data.from = dirBtn.dataset.cbDir === "drawer-bank" ? "drawer" : "bank"; renderModal(); return; }
    }

    if(state.modal && state.modal.type === "changePayment"){
      const m = e.target.closest("[data-pay-method-modal]");
      if(m){
        const data = state.modal.data;
        data.method = m.dataset.payMethodModal;
        if(data.method === "cash"){ data.cash = data.total; data.upi = 0; }
        else if(data.method === "upi"){ data.upi = data.total; data.cash = 0; }
        else if(data.method === "mixed" && !parseFloat(data.cash) && !parseFloat(data.upi)){ data.cash = data.total; data.upi = 0; }
        renderModal();
        return;
      }
    }

    if(state.modal && state.modal.type === "editBill"){
      const inc = e.target.closest("[data-ebill-inc]");
      if(inc){
        const itemId = inc.dataset.ebillInc;
        const line = state.modal.data.items.find(l=>l.itemId===itemId);
        if(line) line.qty += 1;
        renderModal();
        return;
      }
      const dec = e.target.closest("[data-ebill-dec]");
      if(dec){
        const itemId = dec.dataset.ebillDec;
        const line = state.modal.data.items.find(l=>l.itemId===itemId);
        if(line){
          line.qty -= 1;
          if(line.qty <= 0) state.modal.data.items = state.modal.data.items.filter(l=>l.itemId!==itemId);
        }
        renderModal();
        return;
      }
      if(e.target.id === "ebillAddBtn"){
        const select = document.getElementById("ebillAddSelect");
        const itemId = select.value;
        const item = state.config.items.find(i=>i.id===itemId);
        if(!item) return;
        const line = state.modal.data.items.find(l=>l.itemId===itemId);
        if(line) line.qty += 1;
        else state.modal.data.items.push({itemId:item.id, name:item.name, price:item.price, qty:1, note:""});
        renderModal();
        return;
      }
    }
  }

  // First run (no connection saved) or the hidden /#/setup page -> setup wizard instead of login.
  window.addEventListener("hashchange", () => { if(/^#\/setup\b/.test(location.hash)) location.reload(); });
  // Activation key (when a licensing registry is configured) comes first, then the setup wizard, then login.
  // With activation on, the setup wizard is never shown to customers (Setup.needed() is false), even for #/setup.
  if(window.Activation && Activation.registryOn() && /^#\/setup\b/.test(location.hash)) history.replaceState(null, "", location.pathname + location.search);
  if(window.Activation && Activation.needed()){ Activation.open(); }
  else if(window.Setup && Setup.needed()){ Setup.open(); }
  else if(window.Activation && Activation.hasLicense()){
    Activation.verify().then((r) => {
      if(r.locked){ Activation.lock(r.message); }
      else if(!r.reloading){ checkAuthAndStart(); }
    });
  }
  else { checkAuthAndStart(); }

  // Service worker + "install this as an app" banner only make sense when this file is
  // running as a hosted web page. Inside the packaged Android app (Capacitor WebView) it's
  // already a native app, so both are skipped there.
  const isNativeApp = !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

  if(!isNativeApp && "serviceWorker" in navigator){
    window.addEventListener("load", ()=>{
      navigator.serviceWorker.register("sw.js").catch(()=>{});
    });
  }

  // ---- Auto PWA install prompt (mobile web only) ----
  (function(){
    if(isNativeApp) return;
    const isMobile = /Android|iPhone|iPad|iPod/i.test(navigator.userAgent);
    if(!isMobile) return;

    const isStandalone = window.matchMedia("(display-mode: standalone)").matches
      || window.navigator.standalone === true;
    if(isStandalone) return;

    const DISMISS_KEY = "kaapiInstallPromptDismissedAt";
    const lastDismiss = Number(localStorage.getItem(DISMISS_KEY) || 0);
    const daysSinceDismiss = (Date.now() - lastDismiss) / 86400000;
    if(lastDismiss && daysSinceDismiss < 7) return;

    let deferredPrompt = null;
    const ua = navigator.userAgent;
    const isIOSDevice = /iPhone|iPad|iPod/i.test(ua);
    // Only real Safari supports "Add to Home Screen" from the Share sheet.
    // Exclude Chrome/Firefox/Edge on iOS (they're all Safari-engine wrappers
    // without that menu item) and in-app browsers (Instagram, FB, TikTok, etc.)
    const isOtherIOSBrowser = /CriOS|FxiOS|EdgiOS|OPiOS|mercury/i.test(ua);
    const isInAppBrowser = /FBAN|FBAV|Instagram|Line\/|MicroMessenger|TikTok|Snapchat/i.test(ua);
    const isIOS = isIOSDevice && !isOtherIOSBrowser && !isInAppBrowser;
    // iOS device but not a browser that can install — skip silently, no banner at all.
    if(isIOSDevice && !isIOS) return;

    function showBanner({onInstall, iosHint}){
      const banner = document.createElement("div");
      banner.id = "pwaInstallBanner";
      banner.style.cssText = "position:fixed;left:12px;right:12px;bottom:12px;z-index:9999;"
        + "background:#0e1a1f;color:#fff;border:1px solid rgba(255,255,255,.15);border-radius:14px;"
        + "padding:12px 14px;display:flex;align-items:center;gap:10px;"
        + "box-shadow:0 8px 24px rgba(0,0,0,.35);font-family:inherit;font-size:14px;";

      const icon = document.createElement("img");
      icon.src = "icon-192.png";
      icon.alt = "";
      icon.style.cssText = "width:36px;height:36px;border-radius:8px;flex-shrink:0;";

      const text = document.createElement("div");
      text.style.cssText = "flex:1;line-height:1.3;";
      text.innerHTML = iosHint
        ? "Install mycafe: tap <strong>Share</strong> then <strong>Add to Home Screen</strong>."
        : "Install mycafe for quick, full-screen access.";

      const closeBtn = document.createElement("button");
      closeBtn.textContent = "✕";
      closeBtn.style.cssText = "background:none;border:none;color:#fff;opacity:.7;font-size:16px;"
        + "padding:4px 6px;cursor:pointer;flex-shrink:0;";
      closeBtn.onclick = () => {
        localStorage.setItem(DISMISS_KEY, String(Date.now()));
        banner.remove();
      };

      banner.appendChild(icon);
      banner.appendChild(text);

      if(!iosHint){
        const installBtn = document.createElement("button");
        installBtn.textContent = "Install";
        installBtn.style.cssText = "background:#fff;color:#0e1a1f;border:none;border-radius:10px;"
          + "padding:8px 14px;font-weight:600;font-size:14px;cursor:pointer;flex-shrink:0;";
        installBtn.onclick = async () => {
          banner.remove();
          if(!onInstall) return;
          await onInstall();
        };
        banner.appendChild(installBtn);
      }

      banner.appendChild(closeBtn);
      document.body.appendChild(banner);
    }

    if(isIOS){
      // iOS has no install API — show an instructional banner shortly after load.
      window.addEventListener("load", () => {
        setTimeout(() => showBanner({ iosHint: true }), 1500);
      });
      return;
    }

    // Android/Chrome: capture the native prompt and trigger it automatically.
    window.addEventListener("beforeinstallprompt", (e) => {
      e.preventDefault();
      deferredPrompt = e;
      setTimeout(async () => {
        if(!deferredPrompt) return;
        try{
          await deferredPrompt.prompt();
          const choice = await deferredPrompt.userChoice;
          if(choice.outcome !== "accepted"){
            localStorage.setItem(DISMISS_KEY, String(Date.now()));
          }
        }catch(err){
          // Auto-prompt blocked by browser (no gesture) — fall back to a tappable banner.
          showBanner({ onInstall: async () => {
            if(!deferredPrompt) return;
            await deferredPrompt.prompt();
            await deferredPrompt.userChoice;
            deferredPrompt = null;
          }});
        }
        deferredPrompt = null;
      }, 1500);
    });

    window.addEventListener("appinstalled", () => {
      localStorage.removeItem(DISMISS_KEY);
    });
  })();
})();
</script>
</body>
</html>
