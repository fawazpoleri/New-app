<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0e1a1f">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>mycafe</title>
<meta name="apple-mobile-web-app-title" content="mycafe">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<!-- Supabase client (cloud database). Connection + credentials live in supabase-client.js,
     kept as its own file — see that file to point the app at a different Supabase project. -->
<script src="supabase.js?v=2.117.3"></script>
<script src="authz.js?v=11"></script>
<script src="config.js?v=11"></script>
<script src="supabase-client.js?v=11"></script>
<script src="setup.js?v=11"></script>
<script src="activation.js?v=11"></script>
<script src="data-layer.js?v=11"></script>
<script src="suppliers-online.js?v=12"></script>
<script src="suppliers-ui.js?v=12"></script>
<style>
  :root{
    --bg:#0e1a1f;
    --surface:#16292d;
    --surface-2:#1c3338;
    --border:#2a4247;
    --text:#f0f7f6;
    --text-dim:#a7bdbb;
    --text-faint:#6d8583;
    --amber:#ff7d4d;
    --amber-dark:#e6612f;
    --amber-ink:#2a0f05;
    --teal:#4fd1ae;
    --teal-dark:#2f9c80;
    --rust:#e2574c;
    --radius-lg:20px;
    --radius-md:14px;
    --radius-sm:10px;
    --safe-top:env(safe-area-inset-top,0px);
    --safe-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    overflow:hidden;
    overscroll-behavior:none;
  }
  h1,h2,h3,.display,.money,.tabbtn,.navlabel,.bigtotal{
    font-family:'Space Grotesk',-apple-system,sans-serif;
  }
  button{font-family:inherit; -webkit-appearance:none; appearance:none; border:none; background:none; color:inherit; cursor:pointer;}
  input,select{font-family:inherit; color:var(--text); background:var(--surface-2); border:1px solid var(--border); border-radius:var(--radius-sm); padding:12px 14px; font-size:16px; width:100%;}
  input:focus,select:focus,button:focus-visible{outline:2px solid var(--amber); outline-offset:1px;}
  ::selection{background:var(--amber); color:var(--amber-ink);}

  #app{position:fixed; inset:0; display:flex; flex-direction:column; height:100%;}

  /* ---------- Topbar ---------- */
  .topbar{
    padding:calc(14px + var(--safe-top)) 18px 14px;
    display:flex; align-items:center; justify-content:space-between;
    background:linear-gradient(180deg,var(--surface),var(--bg));
    border-bottom:1px solid var(--border);
    flex-shrink:0;
  }
  .brand{display:flex; align-items:center; gap:10px;}
  .brand .mark{width:34px;height:34px;border-radius:10px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .brand h1{font-size:18px; margin:0; font-weight:700; letter-spacing:0.2px;}
  .brand .sub{font-size:11px; color:var(--text-faint); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:42vw;}
  .brand .sub:empty{display:none;}
  .topbar .tabname{font-size:13px; color:var(--text-dim); font-weight:600; text-transform:uppercase; letter-spacing:0.08em;}
  .header-menu-btn{width:26px; height:26px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); font-size:13px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0;}
  .header-menu-btn:active{transform:scale(0.92);}
  .sync-status{display:flex; align-items:center; gap:5px; font-size:10.5px; color:var(--text-dim); flex-shrink:0;}
  .sync-dot{width:7px; height:7px; border-radius:50%; background:#999; flex-shrink:0; transition:background .2s ease;}
  .sync-dot.sync-synced, .sync-dot.sync-idle{background:#2ecc71;}
  .sync-dot.sync-syncing{background:#f5a623; animation:syncPulse 1s ease-in-out infinite;}
  .sync-dot.sync-error, .sync-dot.sync-offline{background:#e74c3c;}
  .sync-dot.sync-unconfigured{background:#999;}
  @keyframes syncPulse{0%,100%{opacity:1;}50%{opacity:.35;}}
  .sync-label{white-space:nowrap; max-width:74px; overflow:hidden; text-overflow:ellipsis;}
  .sync-btn{width:22px; height:22px; border-radius:7px; background:var(--surface-2); border:1px solid var(--border); font-size:11px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0;}
  .sync-btn:active{transform:scale(0.9);}
  .sync-btn:disabled{opacity:.5;}
  .sync-btn.spinning{animation:syncSpin .8s linear infinite;}
  @keyframes syncSpin{from{transform:rotate(0deg);}to{transform:rotate(360deg);}}

  /* ---------- Main view ---------- */
  #view{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 16px calc(96px + var(--safe-bottom));}

  /* ---------- Bottom nav ---------- */
  .bottomnav{
    position:fixed; left:0; right:0; bottom:0;
    display:flex; background:var(--surface); border-top:1px solid var(--border);
    padding:8px 8px calc(8px + var(--safe-bottom));
    z-index:40;
  }
  .navbtn{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:8px 4px; border-radius:12px; color:var(--text-faint); transition:color .15s;}
  .navbtn.active{color:var(--amber);}
  .navbtn .icon{font-size:20px; line-height:1;}
  .navlabel{font-size:11px; font-weight:600;}

  /* ---------- Section headers ---------- */
  .section-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:14px;}
  .section-head h2{font-size:20px; margin:0; font-weight:700;}
  .btn{padding:11px 16px; border-radius:var(--radius-sm); font-weight:600; font-size:14px; display:inline-flex; align-items:center; gap:6px;}
  .btn-amber{background:var(--amber); color:var(--amber-ink);}
  .btn-outline{background:transparent; border:1px solid var(--border); color:var(--text);}
  .btn-ghost{color:var(--text-dim);}
  .btn-danger{background:rgba(196,87,59,0.15); color:#e79080;}
  .btn:active{transform:scale(0.97);}
  .btn-block{width:100%; justify-content:center; padding:15px;}
  .btn[disabled]{opacity:0.4; pointer-events:none;}

  /* ---------- Tables grid ---------- */
  .tables-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px;}
  .table-card{
    position:relative; border-radius:var(--radius-lg); padding:16px 14px; min-height:112px;
    display:flex; flex-direction:column; justify-content:space-between;
    border:1.5px solid var(--teal-dark); background:var(--surface);
    text-align:left;
  }
  .table-card:active{transform:scale(0.97);}
  .table-card.occupied{border-color:var(--amber); background:linear-gradient(155deg,rgba(232,163,61,0.16),var(--surface));}
  .table-card .tname{font-size:17px; font-weight:700;}
  .table-card .tstatus{font-size:11px; font-weight:700; text-transform:uppercase; letter-spacing:0.06em; color:var(--teal);}
  .table-card.occupied .tstatus{color:var(--amber);}
  .table-card .tmeta{display:flex; align-items:center; justify-content:space-between; margin-top:10px;}
  .table-card .telapsed{font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .table-card .ttotal{font-size:15px; font-weight:700; color:var(--amber);}
  .dot{width:8px; height:8px; border-radius:50%; background:var(--teal); display:inline-block;}
  .table-card.occupied .dot{background:var(--amber);}

  /* ---------- Kitchen / KOT display ---------- */
  .kot-grid{display:grid; grid-template-columns:1fr; gap:12px;}
  .kot-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-lg); padding:14px 16px; border-left:4px solid var(--teal);}
  .kot-card.status-preparing{border-left-color:var(--amber);}
  .kot-card.status-prepared{border-left-color:#2ecc71; opacity:0.75;}
  .kot-card .khead{display:flex; align-items:center; justify-content:space-between; gap:8px;}
  .kot-card .kname{font-size:17px; font-weight:700;}
  .kot-card .kelapsed{font-size:12px; color:var(--text-dim); font-variant-numeric:tabular-nums;}
  .kot-badge{font-size:10.5px; font-weight:800; text-transform:uppercase; letter-spacing:0.06em; padding:4px 9px; border-radius:20px; background:var(--surface-2); color:var(--teal); white-space:nowrap;}
  .kot-card.status-preparing .kot-badge{color:var(--amber); background:rgba(232,163,61,0.14);}
  .kot-card.status-prepared .kot-badge{color:#2ecc71; background:rgba(46,204,113,0.14);}
  .kitems li.kdone{opacity:0.6;}
  .kitems li.kdone span:last-child{text-decoration:line-through;}
  .kitems li.kdone .kq::before{content:"✓ ";color:#2ecc71;}
  .kitems li.kdone-head{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line, rgba(128,128,128,0.35));font-size:11px;letter-spacing:0.04em;text-transform:uppercase;color:#2ecc71;list-style:none;}
  .kot-card.status-new .kot-badge{color:var(--rust); background:rgba(196,87,59,0.14);}
  .kot-card .kitems{margin:10px 0 0; padding:0; list-style:none; display:flex; flex-direction:column; gap:3px;}
  .kot-card .kitems li{font-size:15px; display:flex; gap:8px;}
  .kot-card .kitems .kq{font-weight:700; min-width:28px; flex-shrink:0; color:var(--amber);}
  .kot-card .kitems .knote{font-size:12.5px; color:var(--text-dim); padding-left:36px; margin-top:-2px;}
  .kot-card .kactions{display:flex; gap:8px; margin-top:12px;}
  .kot-card .kbtn{flex:1; padding:10px 8px; border-radius:var(--radius-sm); font-size:13.5px; font-weight:700; text-align:center; background:var(--surface-2); border:1px solid var(--border); color:var(--text);}
  .kot-card .kbtn:active{transform:scale(0.97);}
  .kot-card .kbtn.primary{background:var(--amber); color:var(--amber-ink); border-color:var(--amber);}
  .kot-card .kbtn.done{background:#2ecc71; color:#0d2b18; border-color:#2ecc71;}
  .kot-card .kbtn.ghost{flex:0 0 auto; padding:10px 12px; background:transparent; color:var(--text-faint);}
  .kot-cat{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin:16px 0 8px;}
  .kot-cat:first-child{margin-top:0;}
  .kot-item{background:var(--surface); border:1px solid var(--border); border-left:4px solid var(--amber); border-radius:var(--radius-md); padding:12px 14px; margin-bottom:8px;}
  .kot-item .kihead{display:flex; align-items:center; gap:12px;}
  .kot-item .kicount{font-size:22px; font-weight:800; color:var(--amber); min-width:44px; font-variant-numeric:tabular-nums;}
  .kot-item .kiname{font-size:16px; font-weight:700;}
  .kot-item .kitables{display:flex; flex-wrap:wrap; gap:6px; margin-top:8px;}
  .kot-item .kitable{font-size:12px; padding:3px 9px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border); color:var(--text-dim);}
  .kot-item .kitable b{color:var(--text);}
  .kot-item .kinote{font-size:12.5px; color:var(--text-dim); margin-top:4px;}
  .nav-icon-wrap{position:relative; display:inline-flex;}
  .nav-icon-wrap .navdot{position:absolute; top:-3px; right:-6px; min-width:16px; height:16px; padding:0 4px; border-radius:9px; background:var(--rust); color:#fff; font-size:10px; font-weight:800; display:flex; align-items:center; justify-content:center;}

  .empty-state{padding:40px 20px; text-align:center; color:var(--text-faint); border:1.5px dashed var(--border); border-radius:var(--radius-lg);}
  .empty-state .big{font-size:32px; margin-bottom:8px;}
  .empty-state p{margin:6px 0 16px; font-size:14px; line-height:1.5;}

  /* ---------- Segmented control ---------- */
  .segmented{display:flex; background:var(--surface-2); border-radius:12px; padding:4px; margin-bottom:16px; gap:4px;}
  .segmented button{flex:1; padding:9px 4px; border-radius:9px; font-size:13px; font-weight:600; color:var(--text-dim); text-align:center;}
  .segmented button.active{background:var(--amber); color:var(--amber-ink);}
  .segmented.scroll{overflow-x:auto; -webkit-overflow-scrolling:touch; scrollbar-width:none;}
  .segmented.scroll::-webkit-scrollbar{display:none;}
  .segmented.scroll button{flex:0 0 auto; white-space:nowrap; padding:9px 14px;}
  /* ---- Business-day closing report (popup after Close day + Reports) ---- */
  .cs-wrap .cs-head{font-size:11px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--text-faint); margin:14px 0 6px;}
  .cs-wrap .cs-head:first-child{margin-top:0;}
  .cs-wrap .cs-row, .cs-wrap .dline{display:flex; justify-content:space-between; gap:12px; padding:3px 0; font-size:14px;}
  .cs-wrap .cs-row.bold{font-weight:700; border-top:1px solid var(--border); margin-top:4px; padding-top:7px;}
  .cs-wrap .cs-head + .cs-row.bold{border-top:none; margin-top:0; padding-top:3px;}
  .cs-wrap .good{color:var(--teal);} .cs-wrap .bad{color:#e79080;} .cs-wrap .dim{color:var(--text-dim);}
  .cs-modal{max-height:calc(100vh - 40px); overflow-y:auto;}

  /* ---------- Lists (categories/items/tables mgmt) ---------- */
  .list-row{display:flex; align-items:center; justify-content:space-between; background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 14px; margin-bottom:10px;}
  .list-row .rowmain{min-width:0; flex:1;}
  .list-row .rtitle{font-weight:600; font-size:15px;}
  .list-row .rsub{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .list-row .ractions{display:flex; gap:6px; flex-shrink:0;}
  .icon-btn{width:34px; height:34px; border-radius:9px; display:flex; align-items:center; justify-content:center; background:var(--surface-2); font-size:15px;}
  .icon-btn:active{transform:scale(0.92);}
  .cat-chip-header{font-size:12px; text-transform:uppercase; letter-spacing:0.07em; color:var(--text-faint); margin:18px 0 8px; font-weight:700;}
  .cat-chip-header:first-child{margin-top:0;}

  .fab-row{margin-top:18px;}

  /* ---------- Reports ---------- */
  .daybanner{display:flex; align-items:center; justify-content:space-between; gap:12px; background:var(--surface); border:1.5px solid var(--border); border-radius:var(--radius-md); padding:13px 14px; margin-bottom:16px;}
  .daybanner.open{border-color:var(--teal-dark); background:linear-gradient(155deg,rgba(95,160,140,0.14),var(--surface));}
  .daybanner .db-status{font-weight:700; font-size:14px;}
  .daybanner .db-sub{font-size:12px; color:var(--text-faint); margin-top:2px;}
  .stat-grid{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:18px;}
  .stat-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px;}
  .cb-actions{display:flex; gap:8px; margin-bottom:18px;}
  .cb-actions .btn{flex:1;}
  .stat-card .slabel{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); font-weight:700;}
  .stat-card .sval{font-size:22px; font-weight:700; margin-top:4px;}
  .stat-card.accent .sval{color:var(--amber);}
  .dchart{padding:2px 0 0; overflow-x:auto; -webkit-overflow-scrolling:touch;}
  .dchart svg{display:block; width:100%; height:auto; overflow:visible;}
  .dchart .dbar{cursor:pointer;}
  .dchart text{font-family:inherit; fill:var(--text-faint); font-size:10px;}
  .dchart text.vlabel{fill:var(--text); font-size:9.5px; font-weight:700;}
  .dchart text.vlabel.rot{font-size:8.5px;}
  .sale-dash{display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:12px;}
  .sale-dash .stat-card.upi .sval{color:var(--amber);}
  .sale-dash .stat-card.cash .sval{color:var(--teal);}
  .dlegend{display:flex; gap:14px; justify-content:center; font-size:11.5px; color:var(--text-dim); margin:2px 0 4px;}
  .dlegend i{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:5px; vertical-align:-1px;}
  .ksub{font-size:10.5px; color:var(--text-faint); margin-top:3px; line-height:1.3;}
  .rtabs{display:flex; gap:6px; margin-bottom:12px;}
  .rtabs button{flex:1; padding:8px 2px 7px; border-radius:12px; background:var(--surface); border:1px solid var(--border); font-size:11.5px; font-weight:700; color:var(--text-dim); display:flex; flex-direction:column; align-items:center; gap:2px;}
  .rtabs button span{font-size:16px; line-height:1.1;}
  .rtabs button.active{background:var(--amber); border-color:var(--amber); color:var(--amber-ink);}
  .rcard{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:14px; margin-bottom:14px;}
  .rtitle{font-size:11px; text-transform:uppercase; letter-spacing:0.06em; color:var(--text-faint); font-weight:700; margin-bottom:10px; display:flex; justify-content:space-between; align-items:center; gap:8px;}
  .linkbtn{color:var(--amber); font-size:12px; font-weight:700; text-transform:none; letter-spacing:0; padding:2px 0;}
  .mini-seg{display:inline-flex; background:var(--surface-2); border-radius:9px; padding:2px; gap:2px; text-transform:none; letter-spacing:0;}
  .mini-seg button{padding:4px 9px; border-radius:7px; font-size:11.5px; font-weight:700; color:var(--text-dim);}
  .mini-seg button.active{background:var(--amber); color:var(--amber-ink);}
  .rline{display:flex; justify-content:space-between; gap:10px; padding:5px 0; font-size:13.5px;}
  .rline.bold{font-weight:700; font-size:14.5px;}
  .rline.dim{color:var(--text-dim); font-size:12.5px; border-top:1px solid var(--border); margin-top:4px; padding-top:7px;}
  .rline.dim + .rline.dim{border-top:none; margin-top:0; padding-top:3px;}
  .sel-detail{border-top:1px solid var(--border); margin-top:6px; padding-top:8px;}
  .pdot{display:inline-block; width:9px; height:9px; border-radius:3px; margin-right:7px;}
  .paybar{display:flex; height:10px; border-radius:5px; overflow:hidden; background:var(--surface-2); margin:0 0 10px;}
  .rank{margin-bottom:11px;}
  .rank:last-child{margin-bottom:0;}
  .rank .rtop{display:flex; justify-content:space-between; gap:10px; font-size:13.5px; font-weight:600;}
  .rank .rv{white-space:nowrap;}
  .rank .rsub2{font-size:11.5px; color:var(--text-faint); margin-top:1px;}
  .rbar{height:5px; background:var(--surface-2); border-radius:3px; overflow:hidden; margin-top:5px;}
  .rbar i{display:block; height:100%; background:var(--teal); border-radius:3px;}
  .range-row{display:flex; gap:8px; margin-bottom:14px; align-items:center;}
  .range-row input[type=date]{flex:1;}
  .order-row{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:13px 14px; margin-bottom:9px;}
  .order-row .otop{display:flex; justify-content:space-between; align-items:center;}
  .order-row .oleft{font-weight:600; font-size:14.5px;}
  .order-row .otime{font-size:11.5px; color:var(--text-faint); margin-top:2px;}
  .badge{font-size:10.5px; font-weight:700; padding:3px 8px; border-radius:20px; text-transform:uppercase; letter-spacing:0.04em;}
  .badge-cash{background:rgba(95,160,140,0.18); color:var(--teal);}
  .badge-upi{background:rgba(232,163,61,0.18); color:var(--amber);}
  .badge-mixed{background:rgba(196,87,59,0.18); color:#e79080;}
  .order-detail{margin-top:10px; padding-top:10px; border-top:1px dashed var(--border); font-size:13px; color:var(--text-dim);}
  .order-detail .dline{display:flex; justify-content:space-between; padding:3px 0;}

  /* ---------- Overlays (billing/payment) ---------- */
  .overlay{position:fixed; inset:0; background:var(--bg); z-index:100; display:flex; flex-direction:column; transform:translateY(100%); transition:transform .22s ease;}
  .overlay.open{transform:translateY(0);}
  @media (prefers-reduced-motion:reduce){.overlay{transition:none;}}
  .ov-header{padding:calc(14px + var(--safe-top)) 16px 12px; display:flex; align-items:center; gap:12px; border-bottom:1px solid var(--border); background:var(--surface); flex-shrink:0;}
  .ov-header .back{width:36px;height:36px;border-radius:10px;background:var(--surface-2);display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0;}
  .ov-header .titles{flex:1; min-width:0;}
  .ov-header h3{margin:0; font-size:16px; font-weight:700;}
  .ov-header .ovsub{font-size:12px; color:var(--text-faint); font-variant-numeric:tabular-nums; margin-top:1px;}
  .ov-body{flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:14px 16px 12px;}

  /* category chips in billing */
  .chip-row{display:flex; gap:8px; overflow-x:auto; padding-bottom:12px; margin-bottom:4px; -webkit-overflow-scrolling:touch;}
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{flex-shrink:0; padding:9px 16px; border-radius:20px; background:var(--surface-2); border:1px solid var(--border); font-size:13.5px; font-weight:600; color:var(--text-dim); white-space:nowrap;}
  .chip.active{background:var(--amber); color:var(--amber-ink); border-color:var(--amber);}

  /* category chips as a left-hand navbar next to the item grid (mobile + desktop) */
  #billingBody{ display:flex; align-items:flex-start; gap:12px; }
  .chip-row{
    flex-direction:column; align-items:stretch; overflow:visible;
    width:104px; flex-shrink:0; margin-bottom:0; padding-bottom:0;
    max-height:calc(100vh - 220px); overflow-y:auto;
    position:sticky; top:0; gap:6px;
  }
  .chip-row::-webkit-scrollbar{display:none;}
  .chip{
    width:100%; text-align:left; white-space:normal;
    border-radius:var(--radius-sm); padding:10px 10px; font-size:12.5px;
  }
  #billingBody .item-grid,
  #billingBody > div.empty-state{ flex:1; min-width:0; }
  #billingBody .item-grid{ grid-template-columns:1fr; }

  .item-grid{display:grid; grid-template-columns:1fr 1fr; gap:8px;}
  .item-card{background:var(--surface); border:1px solid var(--border); border-radius:12px; padding:8px 10px; text-align:left; position:relative; min-height:52px; display:flex; flex-direction:column; justify-content:space-between;}
  .item-card:active{transform:scale(0.96); border-color:var(--amber);}
  .item-card .iname{font-size:13px; font-weight:600; line-height:1.2;}
  .item-card .iprice{font-size:12.5px; color:var(--amber); font-weight:700; margin-top:3px;}
  .item-card.has-img{flex-direction:row; align-items:center; justify-content:flex-start; gap:9px;}
  .item-card .iimg{width:32px; height:32px; border-radius:7px; object-fit:cover; flex:none; background:var(--border);}
  .item-card .itext{min-width:0; display:flex; flex-direction:column; justify-content:center; flex:1;}
  .list-row .rimg{width:38px; height:38px; border-radius:8px; object-fit:cover; flex:none; margin-right:10px; background:var(--border);}
  .imgpick{display:flex; align-items:center; gap:12px;}
  .imgpick .imgprev{width:64px; height:64px; border-radius:12px; border:1px dashed var(--border); object-fit:cover; background:var(--surface); display:flex; align-items:center; justify-content:center; font-size:22px; flex:none;}
  .imgpick .imgbtns{display:flex; flex-direction:column; gap:6px; align-items:flex-start;}
  .imgpick .imgbtns button{font-size:13px; padding:6px 12px; border-radius:8px; border:1px solid var(--border); background:var(--surface); color:inherit;}
  .item-card .qtybadge{position:absolute; top:-6px; right:-6px; background:var(--amber); color:var(--amber-ink); font-size:12px; font-weight:800; min-width:22px; height:22px; border-radius:11px; display:flex; align-items:center; justify-content:center; padding:0 5px;}

  /* cart bar + sheet */
  .cartbar{position:fixed; left:0; right:0; bottom:0; background:var(--amber); color:var(--amber-ink); padding:14px 16px calc(14px + var(--safe-bottom)); display:flex; align-items:center; justify-content:space-between; z-index:110;}
  .cartbar .cinfo{font-size:13px; font-weight:700;}
  .cartbar .ctotal{font-size:17px; font-weight:800;}
  .cartbar .cta{background:var(--amber-ink); color:var(--amber); padding:11px 18px; border-radius:11px; font-weight:700; font-size:14px;}

  .sheet-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:120; display:flex; align-items:flex-end;}
  .sheet{background:var(--surface); width:100%; border-radius:20px 20px 0 0; max-height:78vh; display:flex; flex-direction:column; padding-bottom:calc(10px + var(--safe-bottom));}
  .sheet-handle{width:36px; height:4px; background:var(--border); border-radius:2px; margin:10px auto 4px;}
  .sheet-head{display:flex; justify-content:space-between; align-items:center; padding:8px 18px 10px;}
  .sheet-head h3{margin:0; font-size:16px;}
  .sheet-body{overflow-y:auto; padding:0 16px;}
  .cart-line{padding:8px 0; border-bottom:1px solid var(--border);}
  .cart-line-top{display:flex; align-items:center; gap:10px;}
  .cart-line .clname{flex:1; font-size:13px; font-weight:600;}
  .cart-line .clprice{font-size:11px; color:var(--text-faint); margin-top:1px;}
  .stepper{display:flex; align-items:center; gap:0; background:var(--surface-2); border-radius:10px; overflow:hidden;}
  .stepper button{width:28px; height:28px; font-size:16px; font-weight:700; color:var(--amber);}
  .stepper span{min-width:24px; text-align:center; font-weight:700; font-size:14px;}
  .cart-lineprice{font-weight:700; font-size:13px; min-width:50px; text-align:right;}
  .cart-note-input{margin-top:6px; width:100%; background:var(--surface-2); border:1px solid var(--border); border-radius:8px; padding:5px 9px; font-size:12px; color:var(--text); font-style:italic;}
  .cart-note-input::placeholder{color:var(--text-faint); font-style:italic;}
  .sheet-footer{padding:12px 16px 4px; border-top:1px solid var(--border); display:flex; gap:10px;}
  .subtotal-row{display:flex; justify-content:space-between; padding:12px 16px 0; font-size:14px; color:var(--text-dim);}
  .subtotal-row .val{color:var(--text); font-weight:700;}

  /* payment screen */
  .pay-total{text-align:center; padding:28px 0 20px;}
  .pay-total .label{font-size:12px; color:var(--text-faint); text-transform:uppercase; letter-spacing:0.08em; font-weight:700;}
  .pay-total .bigtotal{font-size:40px; font-weight:800; color:var(--amber); margin-top:6px;}
  .r-row{display:flex; justify-content:space-between; gap:6px;}
  .r-bold{font-weight:700;}
  .pay-total .r-row{font-size:14px; color:var(--text-dim); padding:4px 0;}
  .pay-total .r-row.r-bold{font-size:17px; color:var(--text); border-top:1px dashed var(--border); margin-top:6px; padding-top:10px;}
  .pay-methods{display:flex; gap:10px; margin-bottom:20px;}
  .pay-method{flex:1; padding:16px 8px; border-radius:var(--radius-md); border:1.5px solid var(--border); text-align:center; background:var(--surface);}
  .pay-method .picon{font-size:22px; margin-bottom:6px;}
  .pay-method .plabel{font-size:13px; font-weight:700;}
  .pay-method.active{border-color:var(--amber); background:rgba(232,163,61,0.1);}
  .split-inputs{display:flex; flex-direction:column; gap:12px; margin-bottom:16px;}
  .split-field label{font-size:12px; color:var(--text-dim); font-weight:600; margin-bottom:6px; display:block;}
  .remaining-note{text-align:center; font-size:13px; padding:10px; border-radius:10px; margin-bottom:14px; font-weight:600;}
  .remaining-note.ok{background:rgba(95,160,140,0.15); color:var(--teal);}
  .remaining-note.bad{background:rgba(196,87,59,0.15); color:#e79080;}

  /* generic modal for add/edit */
  .modal-backdrop{position:fixed; inset:0; background:rgba(0,0,0,0.55); z-index:200; display:flex; align-items:center; justify-content:center; padding:20px;}
  .modal{background:var(--surface); border-radius:var(--radius-lg); padding:20px; width:100%; max-width:400px; border:1px solid var(--border);}
  .modal h3{margin:0 0 16px; font-size:17px;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12.5px; color:var(--text-dim); font-weight:600; margin-bottom:6px;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-actions .btn{flex:1;}

  .toast{position:fixed; left:50%; bottom:100px; transform:translateX(-50%); background:var(--surface-2); border:1px solid var(--border); color:var(--text); padding:11px 18px; border-radius:12px; font-size:13.5px; font-weight:600; z-index:300; box-shadow:0 6px 20px rgba(0,0,0,0.4);}

  .loading-screen{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; flex-direction:column; gap:10px; z-index:500;}
  .loading-screen .mark{width:48px;height:48px;border-radius:14px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:24px;}

  /* ---------- Login screen ---------- */
  .login-screen{position:fixed; inset:0; background:var(--bg); display:flex; align-items:center; justify-content:center; z-index:600; padding:24px; padding-top:calc(24px + var(--safe-top)); padding-bottom:calc(24px + var(--safe-bottom));}
  .login-card{width:100%; max-width:340px;}
  .login-card .mark{width:56px;height:56px;border-radius:16px;background:var(--amber);display:flex;align-items:center;justify-content:center;font-size:28px; margin:0 auto 14px;}
  .login-card h1{font-size:20px; text-align:center; margin:0 0 4px;}
  .login-card .sub{font-size:13px; color:var(--text-faint); text-align:center; margin-bottom:26px;}
  .login-field{margin-bottom:14px;}
  .login-error{color:#e79080; font-size:12.5px; margin:-4px 0 14px; min-height:16px;}
  .login-card .login-link{font-size:13px;}
  .login-card .login-ok{color:var(--text-dim);}
  .role-badge{font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:0.05em; color:var(--text-faint); border:1px solid var(--border); border-radius:20px; padding:3px 8px; flex-shrink:0;}
  .logout-btn{width:26px; height:26px; border-radius:8px; background:var(--surface-2); border:1px solid var(--border); font-size:12px; display:flex; align-items:center; justify-content:center; color:var(--text-dim); flex-shrink:0;}
  .logout-btn:active{transform:scale(0.92);}
  /* Phones: keep the header buttons (🔑 and ⏻) on screen — the active tab is already shown in the bottom nav. */
  .brand{min-width:0;}
  .brand h1{white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:42vw;}
  @media (max-width:560px){
    .topbar .tabname, .sync-label{display:none !important;}
    .topbar{gap:8px; padding-left:12px; padding-right:12px;}
    .brand h1{font-size:16px; max-width:34vw;}
    .brand .sub{max-width:34vw;}
  }

  /* ---------- Settings tab ---------- */
  .settings-card{background:var(--surface); border:1px solid var(--border); border-radius:var(--radius-md); padding:16px; margin-bottom:14px;}
  .hint-text{font-size:12px; color:var(--text-faint); line-height:1.5; padding:0 2px 14px;}
  .print-btn-row{display:flex; gap:8px;}

  /* ---------- Print receipt (screen styles, hidden until print) ---------- */
  #printArea{display:none;}
  .receipt{font-family:'Courier New',Courier,monospace; font-size:13px; color:#000; width:100%; line-height:1.45;}
  .receipt .r-center{text-align:center;}
  .receipt .r-bold{font-weight:700;}
  .receipt .r-big{font-size:16px;}
  .receipt .r-row{display:flex; justify-content:space-between; gap:6px;}
  .receipt .small{font-size:11.5px;}
  .receipt .r-hr{border-top:1px dashed #000; margin:5px 0;}
  .receipt .kot-line{display:flex; gap:8px; font-size:15px; padding:2px 0;}
  .receipt .kot-line .q{font-weight:700; min-width:30px; flex-shrink:0;}
  .receipt .bill-head,.receipt .bill-item{display:flex; font-size:12.5px; padding:1px 0;}
  .receipt .bill-head{font-weight:700; border-bottom:1px solid #000; margin-bottom:3px;}
  .receipt .bi-name{flex:2; overflow-wrap:anywhere;}
  .receipt .bi-qty{flex:0.6; text-align:center;}
  .receipt .bi-amt{flex:1; text-align:right;}
  .receipt .item-note{font-size:11px; font-style:italic; padding-left:2px; margin:-1px 0 2px;}

  @media print{
    body *{ visibility:hidden; }
    #printArea, #printArea *{ visibility:visible; }
    #printArea{ display:block !important; position:absolute; left:0; top:0; width:100%; padding:0 2mm; }
    @page{ size:58mm auto; margin:2mm; }
  }

  /* =========================================================================
     DESKTOP / PC LAYOUT — fast-billing mode for mouse + keyboard + big screens
     CSS-only reflow. No markup, ids, classes or JS behaviour were changed —
     everything below just repositions/resizes the exact same elements.
     ========================================================================= */
  @media (min-width:900px){
    :root{ --topbar-h:66px; }

    /* ---- app shell: top header + left rail nav instead of bottom nav ---- */
    .topbar{ min-height:var(--topbar-h); padding:14px 28px; }
    .bottomnav{
      position:fixed; left:0; right:auto; top:var(--topbar-h); bottom:0;
      width:100px; flex-direction:column; justify-content:flex-start;
      gap:10px; padding:20px 10px; border-top:none; border-right:1px solid var(--border);
      z-index:40;
    }
    .navbtn{ flex:none; width:100%; padding:14px 6px; border-radius:12px; }
    .navbtn:hover{ background:var(--surface-2); color:var(--text); }
    .navbtn .icon{ font-size:22px; }

    #view{ margin-left:100px; padding:26px 34px calc(34px + var(--safe-bottom)); max-width:1600px; }

    /* ---- denser grids so more of the menu/tables/stats are visible at once ---- */
    .tables-grid{ grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:14px; }
    .item-grid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }
    .stat-grid{ grid-template-columns:repeat(4,1fr); }
    .table-card{ cursor:pointer; transition:transform .12s,box-shadow .12s,border-color .12s; }
    .item-card{ cursor:pointer; transition:border-color .12s,transform .08s; }
    .list-row{ transition:border-color .12s; }

    /* ---- billing / payment overlays behave like a proper POS screen ---- */
    .ov-header{ padding:16px 28px; }
    .ov-body{ padding:20px 28px 24px; }
    #billingOverlay .ov-body{ padding-right:372px; } /* reserve space for the docked cart */
    #paymentOverlay .ov-body{ max-width:560px; margin:0 auto; width:100%; }

    /* cart summary bar becomes a permanently-docked right-hand panel for one-click checkout */
    .cartbar{
      left:auto; right:0; top:var(--topbar-h); bottom:0; width:340px;
      flex-direction:column; align-items:stretch; justify-content:flex-end;
      gap:14px; padding:22px; border-left:2px solid var(--amber-dark);
    }
    .cartbar .cinfo{ font-size:14px; }
    .cartbar .ctotal{ font-size:26px; }
    .cartbar .cta{ width:100%; text-align:center; padding:15px; font-size:15px; }

    /* cart sheet opens as a full-height side panel next to the item grid, not a bottom sheet */
    .sheet-backdrop{ align-items:stretch; justify-content:flex-end; background:rgba(0,0,0,0.35); }
    .sheet{ width:400px; max-width:92vw; height:100%; border-radius:0; max-height:100%; border-left:1px solid var(--border); }

    /* wider item grid inside the billing sidebar layout on desktop */
    #billingBody{ gap:22px; }
    .chip-row{ width:172px; padding:0; }
    .chip{ padding:11px 14px; font-size:13.5px; }
    #billingBody .item-grid{ grid-template-columns:repeat(auto-fill,minmax(150px,1fr)); gap:10px; }

    /* modals sit centered as proper dialogs */
    .modal{ max-width:440px; }

    /* pointer affordances — only for devices that actually have a mouse */
    @media (hover:hover){
      .btn:hover{ filter:brightness(1.08); }
      .table-card:hover{ transform:translateY(-2px); box-shadow:0 8px 20px rgba(0,0,0,0.35); }
      .item-card:hover{ border-color:var(--amber); transform:translateY(-1px); }
      .list-row:hover{ border-color:var(--amber-dark); }
      .chip:hover:not(.active){ color:var(--text); }
      .icon-btn:hover{ background:var(--border); }
    }
  }
</style>
</head>
<body>

<div id="loginScreen" class="login-screen" style="display:none;">
  <div class="login-card">
    <div class="mark"><img src="logo.svg" alt="" style="width:100%;height:100%;border-radius:inherit;display:block"></div>

<script>
(function(){
  "use strict";

  /* ============ Storage — Supabase ONLY ====================================================
     Everything (menu, categories, tables, settings, business days, cashbook, open carts and
     completed sales) lives in Supabase. Nothing is cached or saved on the device.
       • Menu/config is ALWAYS loaded from Supabase at start. If Supabase can't be reached the
         app shows a "No internet" screen instead of opening from stale local data.
       • Saving a payment, editing a saved bill, changing a payment mode, deleting a sale and
         every menu/settings change are written straight to Supabase and only count as saved
         once Supabase confirms. With no internet the change is REJECTED and rolled back —
         it is never kept locally to sync later.
     Connection lives in supabase-client.js. */
  const supabaseClient = window.SupabaseDB ? window.SupabaseDB.client : null;

  const clone = v => JSON.parse(JSON.stringify(v));
  // Last menu/config snapshot Supabase has confirmed. A failed save rolls state.config back to
  // this, so the screen never shows a change that isn't actually in the database.
  let lastCloudConfig = null;
  let appReady = false;
  let initFailed = false;

  /* Tracks writes currently in flight to Supabase so the auto-refresh poll never reads back
     a stale snapshot while a just-made change (e.g. an item just added to a table's cart)
     hasn't finished saving yet — without this, syncFromCloud could overwrite fresh local
     state with the older cloud copy and make an occupied table look empty again.
     localWriteVersion additionally guards the case where a poll's own network request was
     ALREADY in flight (slow connection) when the change happened: pendingWriteCount alone
     only catches writes that started before the poll began, so the poll re-checks the
     version after its fetch resolves and discards the response if anything changed meanwhile. */
  let pendingWriteCount = 0;
  let localWriteVersion = 0;

  /* ============ Sync status indicator ============
     Surfaces whether config/sales are actually reaching Supabase, so a flaky wifi
     connection at the counter is visible instead of silently falling behind.
     States: unconfigured (no Supabase set up) | offline (browser has no network) |
     syncing | synced (last attempt succeeded) | error (last attempt failed). */
  let syncStatus = supabaseClient ? "idle" : "unconfigured";
  let lastSyncedAt = null;

  function setSyncStatus(next){
    syncStatus = next;
    if(next === "synced") lastSyncedAt = Date.now();
    renderSyncBadge();
  }

  function renderSyncBadge(){
    const dot = document.getElementById("syncDot");
    const label = document.getElementById("syncLabel");
    const btn = document.getElementById("syncBtn");
    if(!dot || !label) return;
    const text = {
      unconfigured: "No cloud sync",
      offline: "No internet",
      syncing: "Syncing…",
      error: "Sync error",
      idle: lastSyncedAt ? "Synced " + fmtAgo(lastSyncedAt) : "Not synced yet",
      synced: lastSyncedAt ? "Synced " + fmtAgo(lastSyncedAt) : "Synced"
    };
    dot.className = "sync-dot sync-" + syncStatus;
    label.textContent = text[syncStatus] || syncStatus;
    if(btn){
      btn.disabled = (syncStatus === "syncing" || syncStatus === "unconfigured");
      btn.classList.toggle("spinning", syncStatus === "syncing");
      btn.title = syncStatus === "unconfigured" ? "Cloud sync not set up" : "Sync now";
    }
  }

  async function manualSync(){
    if(!supabaseClient){ showToast("Cloud sync isn't set up on this device"); return; }

  /* Deep, key-order-independent equality check. Postgres JSONB does not preserve object key
     order, so a value round-tripped through Supabase can come back with keys reordered even
     when nothing actually changed. A plain JSON.stringify comparison would then wrongly treat
     every poll as "changed". Used to skip re-rendering/re-saving when a sync fetch pulled back
     the exact same data that's already in memory. */
  function stableStringify(value){
    if(Array.isArray(value)) return "[" + value.map(stableStringify).join(",") + "]";
    if(value && typeof value === "object"){
      return "{" + Object.keys(value).sort().map(k => JSON.stringify(k) + ":" + stableStringify(value[k])).join(",") + "}";
    }
    return JSON.stringify(value);
  }
  function sameData(a, b){
    return stableStringify(a) === stableStringify(b);
  }

     the stack one layer at a time instead of exiting the whole app. */
  const layerStack = [];

  function pushOverlay(type, onClose){

  }
  function replaceTopOverlay(type, onClose){
    if(layerStack.length){
      layerStack[layerStack.length-1] = {type, close:onClose};
    } else {
      layerStack.push({type, close:onClose});
    }
    history.replaceState({kaapiDepth:layerStack.length}, "");
  }

    const targetDepth = (e.state && typeof e.state.kaapiDepth === "number") ? e.state.kaapiDepth : 0;

  function fmtTime(ts){

    let h = d.getHours(), m = String(d.getMinutes()).padStart(2,"0");
    const ap = h>=12?"pm":"am"; h = h%12; if(h===0) h=12;

  /* ---- item photos: shrunk in the browser to a 120px square JPEG (~4-8 KB) and stored inside the item record ---- */
  function shrinkImage(file, px){
    return new Promise((resolve, reject)=>{
      const url = URL.createObjectURL(file);
      const img = new Image();
      img.onload = ()=>{
        try{
          const s = Math.min(img.width, img.height), sx = (img.width - s)/2, sy = (img.height - s)/2;
          const c = document.createElement("canvas"); c.width = c.height = px;
          const g = c.getContext("2d"); g.fillStyle = "#fff"; g.fillRect(0,0,px,px);
          g.drawImage(img, sx, sy, s, s, 0, 0, px, px);
          URL.revokeObjectURL(url);
          resolve(c.toDataURL("image/jpeg", 0.72));
        }catch(e){ reject(e); }
      };
      img.onerror = ()=>{ URL.revokeObjectURL(url); reject(new Error("bad image")); };
      img.src = url;
    });
  }

  async function checkSession(){

      if(lr.locked){
        if(Authz.isSignedIn()){ try{ await Auth.signOut(); }catch(_){ /* already gone */ } endSession(""); }
        Activation.lock(lr.message);
        return;
      }
    }
    if(!Authz.isSignedIn()) return;
    const r = await Auth.verify();
    if(r === "invalid"){
      await Auth.signOut();
      endSession("Your session expired or your access changed. Please sign in again.");
    }
  }

  // Discount is only ever applied at the payment step (percentage of subtotal).

  function computeDiscount(subtotal, rawPercent){

    if(percent > 100) percent = 100;

    return {percent, amount, total};

  /* ============ Indian GST ============

     round-half-up, and is IDENTICAL to public.gst_calc() in migration 0007 — the database
     recomputes the cashier's total with the same algorithm, so the two must never drift.
       exclusive: prices are before tax  -> tax is added on top
       inclusive: prices already contain tax -> tax is carved out of the price

  const GST_STATES = [["01","Jammu & Kashmir"],["02","Himachal Pradesh"],["03","Punjab"],["04","Chandigarh"],["05","Uttarakhand"],["06","Haryana"],["07","Delhi"],["08","Rajasthan"],["09","Uttar Pradesh"],["10","Bihar"],["11","Sikkim"],["12","Arunachal Pradesh"],["13","Nagaland"],["14","Manipur"],["15","Mizoram"],["16","Tripura"],["17","Meghalaya"],["18","Assam"],["19","West Bengal"],["20","Jharkhand"],["21","Odisha"],["22","Chhattisgarh"],["23","Madhya Pradesh"],["24","Gujarat"],["26","Dadra & Nagar Haveli and Daman & Diu"],["27","Maharashtra"],["29","Karnataka"],["30","Goa"],["31","Lakshadweep"],["32","Kerala"],["33","Tamil Nadu"],["34","Puducherry"],["35","Andaman & Nicobar Islands"],["36","Telangana"],["37","Andhra Pradesh"],["38","Ladakh"]];
  const GSTIN_RE = /^[0-9]{2}[A-Z]{5}[0-9]{4}[A-Z][1-9A-Z]Z[0-9A-Z]$/;
  function gstActiveConfig(){
    const g = state.config && state.config.settings && state.config.settings.gst;
    if(!g || !g.enabled) return null;
    return {enabled:true, mode: g.mode==="inclusive" ? "inclusive" : "exclusive", rate: Number(g.rate)||0,
            split: g.split==="igst" ? "igst" : "cgst_sgst", gstin: g.gstin||"", stateName: g.stateName||"", stateCode: g.stateCode||""};
  }
  // Editing an OLD bill keeps the GST setup it was billed under (not today's settings).
  function ebTaxCfg(order){
    const t = order && order.tax;
    if(!t) return null;
    return {enabled:true, mode:t.mode, rate:Number(t.rate)||0, split:t.split, gstin:t.gstin||"", stateName:t.stateName||"", stateCode:t.stateCode||""};
  }
  const gstRound = (a, b) => Math.floor((2*a + b) / (2*b));                 // integer divide, round half up
  const gstRateH = (r) => { const n = Number(r); return (isFinite(n) && n>=0) ? Math.min(10000, Math.round(n*100)) : null; };
  function gstLineRateH(itemId, cfg){
    const it = (state.config.items||[]).find(i=>i.id===itemId);
    const own = it && it.gstRate!==undefined && it.gstRate!==null && it.gstRate!=="" ? gstRateH(it.gstRate) : null;
    return own!==null ? own : (gstRateH(cfg.rate) || 0);
  }
  // Returns {subtotal, discount:{percent,amount}|null, total, tax|null}  (all rupee numbers, 2 dp)
  function priceOrder(items, rawPercent, discountOn, cfgOverride){
    const cfg = cfgOverride === undefined ? gstActiveConfig() : cfgOverride;
    const sub = items.reduce((s,l)=> s + Math.round(l.price*l.qty*100), 0);
    if(!cfg){                                                                  // no GST: exactly the original behaviour
      const subtotal = items.reduce((s,l)=> s + l.price*l.qty, 0);
      const disc = computeDiscount(subtotal, rawPercent);
      return {subtotal, discount: (discountOn && disc.amount>0) ? {percent:disc.percent, amount:disc.amount} : null,
              total: discountOn ? disc.total : subtotal, tax:null};
    }
    let percent = discountOn ? parseFloat(rawPercent) : 0;
    if(isNaN(percent) || percent<0) percent = 0; if(percent>100) percent = 100;
    const bp = Math.round(percent*100);
    const acc = new Map(); let netAll = 0;
    items.forEach(l=>{
      const lineP = Math.round(l.price*l.qty*100);
      const netP = gstRound(lineP*(10000-bp), 10000);
      netAll += netP;
      const rh = gstLineRateH(l.itemId, cfg);
      acc.set(rh, (acc.get(rh)||0) + netP);
    });
    const incl = cfg.mode==="inclusive", igst = cfg.split==="igst";
    const groups = []; let taxable=0, tax=0, cgst=0, sgst=0, igstP=0, total=0;
    [...acc.keys()].sort((a,b)=>a-b).forEach(rh=>{
      const net = acc.get(rh); let tx, t, gross;
      if(incl){ gross = net; tx = gstRound(gross*10000, 10000+rh); t = gross - tx; }
      else    { tx = net; t = gstRound(tx*rh, 10000); gross = tx + t; }
      const sg = igst ? 0 : Math.floor(t/2), cg = igst ? 0 : t - sg;
      groups.push({rate: rh/100, taxable: tx/100, cgst: cg/100, sgst: sg/100, igst: (igst?t:0)/100, tax: t/100, amount: gross/100});
      taxable+=tx; tax+=t; cgst+=cg; sgst+=sg; igstP+=(igst?t:0); total+=gross;
    });
    return {
      subtotal: sub/100,
      discount: (discountOn && sub-netAll>0) ? {percent, amount:(sub-netAll)/100} : null,
      total: total/100,
      tax: {rate: cfg.rate, mode: cfg.mode, split: cfg.split, gstin: cfg.gstin, stateName: cfg.stateName, stateCode: cfg.stateCode,
            taxable: taxable/100, cgst: cgst/100, sgst: sgst/100, igst: igstP/100, tax: tax/100, groups}
    };
  }
  // Tax lines for a bill / receipt / sale detail. [{label, amount, bold?}] — shared by every print format.
  function taxBillLines(order){
    const t = order.tax; if(!t) return [];
    const out = [];
    const multi = t.groups.length > 1;
    t.groups.forEach(g=>{
      const r = (g.rate % 1 === 0 ? g.rate : g.rate.toFixed(2).replace(/0+$/,"")) + "%";
      // exclusive + one rate + no discount: "Taxable value" would just repeat the Subtotal line
      if(t.mode==="inclusive" || multi || order.discount) out.push({label: `Taxable value${multi?" @"+r:""}`, amount: g.taxable});
      if(t.split==="igst") out.push({label: `IGST @${r}`, amount: g.igst});
      else { out.push({label: `CGST @${g.rate/2}%`, amount: g.cgst}); out.push({label: `SGST @${g.rate/2}%`, amount: g.sgst}); }
    });
    return out;
  }
  function categoryName(id){
    const c = state.config.categories.find(c=>c.id===id);
    return c ? c.name : "Uncategorized";
  }
  function itemsInCategory(catId){
    return state.config.items.filter(i => i.categoryId === catId);
  }

  /* ============ Business day (Open day / Close day) ============
     A manual session that brackets sales independent of calendar midnight —
     useful for a cafe open past midnight. At most one day is ever "open"
     (closedAt === null) at a time. Orders paid while a day is open get
     stamped with that day's id (see confirmPayment). Stored in config so it
     syncs across devices the same way settings/menu do. */
  function getOpenBusinessDay(){
    return (state.config.businessDays || []).find(d => !d.closedAt) || null;
  }
  // The database opens a business day automatically when the first sale of a day is saved
  // (see ensure_business_day() / orders_guard in supabase/migrations). Cashiers can't open,
  // close or re-date a day themselves — only an Admin can close or reopen one.
  const round2 = (n) => Math.round((Number(n)||0)*100)/100;
  // A day closed WITH a cash count corrects the cash drawer: the counted amount becomes the
  // drawer balance (shortage lowers it, excess raises it). It is derived from the saved counts,
  // not stored as a cashbook entry, so it never pollutes expense/income reports and it is
  // undone automatically when a closing is reverted. Used by cashbookBalances().
  function cashCountAdjustments(uptoTs){
    uptoTs = uptoTs===undefined ? Infinity : uptoTs;
    return (state.config.businessDays||[])
      .filter(d => d.closedAt && d.closedAt <= uptoTs && d.cashClose && typeof d.cashClose.variance==="number" && d.cashClose.variance !== 0)
      .sort((a,b)=>a.closedAt-b.closedAt);
  }
  // What the drawer SHOULD hold right now (earlier days' corrections are already inside it).
  function expectedDrawerCash(){ return round2(cashbookBalances().drawer); }
  function cashVerdict(variance){
    const v = round2(variance);
    if(Math.abs(v) < 0.005) return {key:"exact", icon:"✅", label:"Exact", sign:"", amount:0};
    if(v < 0) return {key:"short", icon:"❌", label:"Shortage", sign:"− ", amount:-v};
    return {key:"excess", icon:"⚠️", label:"Excess", sign:"+ ", amount:v};
  }
  function parseCounted(raw){
    const t = String(raw==null ? "" : raw).trim();
    if(t==="") return {empty:true, valid:true, value:null};
    const n = Number(t);
    return (isFinite(n) && n>=0) ? {empty:false, valid:true, value:round2(n)} : {empty:false, valid:false, value:null};
  }
  // cashCount (optional) = {counted, note}. expected / variance / status are computed HERE,
  // from the live data, never trusted from the UI.
  async function closeBusinessDay(cashCount){
    if(!need("businessday.manage")) return false;
    const day = getOpenBusinessDay();
    if(!day) return true;
    const now = Date.now();
    if(cashCount && cashCount.counted !== null && cashCount.counted !== undefined){
      const expected = expectedDrawerCash();
      const variance = round2(cashCount.counted - expected);
      const prof = (window.Auth && Auth.getProfile && Auth.getProfile()) || {};
      day.cashClose = {expected, counted: round2(cashCount.counted), variance, status: cashVerdict(variance).key,
        note: String(cashCount.note||"").slice(0,120), countedBy: prof.display_name || "", countedAt: now};
    } else {
      delete day.cashClose;
    }
    // Sales carry the SERVER clock; a phone clock running behind it must not close the day
    // "before" its own last sale (that would cut it out of the day's report range).
    const lastTs = Math.max(0, ...ordersForBusinessDay(day.id).map(o=>o.paidAt||0), ...cashbookEntriesForDay(day.id).map(e=>e.at||0));
    day.closedAt = Math.max(now, lastTs);
    day.updatedAt = now;
    const ok = await persistConfig();
    if(ok){
      // A sale from another device can land in this day between the last pull and the close.
      try{
        const before = ordersForBusinessDay(day.id).length;
        const fresh = await DL.loadOrders();
        const after = fresh.filter(o => o.status==="paid" && o.businessDayId===day.id).length;
        if(after !== before){
          state.orders = fresh; snapshotOrders(fresh);
          showToast("A sale arrived while closing — it is included in the day's sales but not in your cash count. Re-check the cash.");
        }
      }catch(_){ /* best effort */ }
      render();
    }
    return ok;
  }
  // Revert is only allowed on the most recently CLOSED day, and only while the day that
  // auto-opened after it (if any) still has zero sales on it — otherwise reopening would
  // mix two overlapping "days" together, or silently swallow real sales from the next one.
  function canRevertBusinessDay(day){
    if(!day || !day.closedAt) return false;
    const closedDays = (state.config.businessDays||[]).filter(d=>d.closedAt);
    const mostRecentClosed = closedDays.reduce((max,d)=> (!max||d.closedAt>max.closedAt)?d:max, null);
    if(!mostRecentClosed || mostRecentClosed.id !== day.id) return false;
    const openDay = getOpenBusinessDay();
    if(openDay && ordersForBusinessDay(openDay.id).length > 0) return false;
    return true;
  }
  async function revertBusinessDayClose(dayId){
    if(!need("businessday.manage")) return;
    const day = (state.config.businessDays||[]).find(d=>d.id===dayId);
    if(!canRevertBusinessDay(day)){ showToast("Can't revert — the next day already has sales"); return; }
    const openDay = getOpenBusinessDay();
    if(openDay && openDay.id !== day.id){
      // empty placeholder day that auto-opened right after the mistaken close — discard it.
      // Tombstoned (not just filtered out) so a merge against a cloud copy that still has it
      // can't quietly bring it back — see mergeConfig's deletedBusinessDayIds handling.
      state.config.businessDays = state.config.businessDays.filter(d=>d.id!==openDay.id);
      tombstone("deletedBusinessDayIds", openDay.id);
    }
    day.closedAt = null;
    delete day.cashClose;          // the count belonged to the close that was just undone
    day.updatedAt = Date.now();
    if(!(await persistConfig())) return;
    render();
    showToast("Day reopened");
  }
  function ordersForBusinessDay(dayId){
    return state.orders.filter(o => o.status==="paid" && o.businessDayId === dayId);
  }

  /* ============ Cashbook (Cash Drawer / Bank ledger) ============
     A simple running ledger for the two accounts a cafe actually handles day to
     day: cash sitting in the drawer, and money in the bank. Cash and UPI sales
     feed it automatically (cash sales -> drawer, UPI -> bank); on top of that the
     cashier logs daily expenses, other income, and drawer<->bank transfers.
     Stored in config (cashbook.entries) so it syncs the same way businessDays and
     menu/settings do — merged by id+updatedAt in mergeConfig, with a
     deletedCashbookEntryIds tombstone list for deletes (same pattern used
     everywhere else in config).
     Only sales paid on/after cashbook.openingSetAt count toward the running
     balance — that timestamp is stamped once (see init/seedConfig) so turning
     this feature on doesn't suddenly dump years of historical sales into the
     drawer balance. */
  function cashbookEntries(){ return (state.config.cashbook && state.config.cashbook.entries) || []; }
  function cashbookEntriesForDay(dayId){ return cashbookEntries().filter(e=>e.businessDayId===dayId); }
  // Net {drawer, bank} change a single entry makes.
  function cashbookEntryEffect(e){
    if(e.type==="expense") return e.account==="drawer" ? {drawer:-e.amount, bank:0} : {drawer:0, bank:-e.amount};
    if(e.type==="income") return e.account==="drawer" ? {drawer:e.amount, bank:0} : {drawer:0, bank:e.amount};
    if(e.type==="transfer") return e.from==="drawer" ? {drawer:-e.amount, bank:e.amount} : {drawer:e.amount, bank:-e.amount};
    // Supplier payments (created only by the Suppliers screen): money OUT of the account, but not an "expense".
    if(e.type==="supplier_payment") return e.account==="drawer" ? {drawer:-e.amount, bank:0} : {drawer:0, bank:-e.amount};
    if(e.type==="supplier_payment_reversal") return e.account==="drawer" ? {drawer:e.amount, bank:0} : {drawer:0, bank:e.amount};
    return {drawer:0, bank:0};
  }
  // Cash/UPI sales effect on the two accounts, for paid orders in [openingSetAt, uptoTs].
  function salesCashbookEffect(uptoTs){
    const since = state.config.cashbook.openingSetAt || 0;
    let drawer=0, bank=0;
    state.orders.forEach(o=>{
      if(o.status!=="paid" || o.paidAt < since || o.paidAt > uptoTs) return;
      const cashAmt = o.payment ? (o.payment.method==="cash" ? (o.payment.total||o.total) : (o.payment.cash||0)) : 0;
      const upiAmt = o.payment ? (o.payment.method==="upi" ? (o.payment.total||o.total) : (o.payment.upi||0)) : 0;
      drawer += cashAmt; bank += upiAmt;
    });
    return {drawer, bank};
  }
  // Running Drawer/Bank balance as of uptoTs (defaults to right now).
  function cashbookBalances(uptoTs){
    // Default = "everything up to now" with NO upper bound: paid sales carry the SERVER's clock,
    // and a device clock that lags it would otherwise hide the newest sales from the drawer.
    uptoTs = uptoTs===undefined ? Infinity : uptoTs;
    const cb = state.config.cashbook;
    let drawer = cb.drawerOpeningBalance||0, bank = cb.bankOpeningBalance||0;
    const sales = salesCashbookEffect(uptoTs);
    drawer += sales.drawer; bank += sales.bank;
    cashCountAdjustments(uptoTs).forEach(d=>{ drawer += d.cashClose.variance; });   // day-close shortage / excess
    cashbookEntries().forEach(e=>{
      if(e.at > uptoTs) return;
      const eff = cashbookEntryEffect(e);
      drawer += eff.drawer; bank += eff.bank;
    });
    return {drawer, bank};
  }
  async function addCashbookEntry(entry){
    if(!need("expenses.manage")) return null;
    const day = getOpenBusinessDay();
    const now = Date.now();
    const full = {id:uid(), at:now, updatedAt:now, businessDayId: day?day.id:null, note:"", ...entry};
    if(!state.config.cashbook.entries) state.config.cashbook.entries = [];
    state.config.cashbook.entries.push(full);
    return (await persistConfig()) ? full : null;
  }
  async function deleteCashbookEntry(id){
    if(!need("expenses.manage")) return false;
    state.config.cashbook.entries = cashbookEntries().filter(e=>e.id!==id);
    tombstone("deletedCashbookEntryIds", id);
    return persistConfig();
  }
  async function setCashbookOpeningBalances(drawer, bank){
    if(!need("expenses.manage")) return false;
    state.config.cashbook.drawerOpeningBalance = drawer;
    state.config.cashbook.bankOpeningBalance = bank;
    state.config.cashbook.updatedAt = Date.now();
    return persistConfig();
  }
  // Totals for one business day's worth of cashbook entries — used in the Close-day
  // summary and could be reused for a per-day breakdown elsewhere.
  function cashbookDaySummary(dayId){
    const entries = cashbookEntriesForDay(dayId);
    let drawerExpense=0, bankExpense=0, drawerIncome=0, bankIncome=0, drawerToBank=0, bankToDrawer=0, drawerSupplier=0, bankSupplier=0;
    entries.forEach(e=>{
      if(e.type==="expense"){ if(e.account==="drawer") drawerExpense+=e.amount; else bankExpense+=e.amount; }
      else if(e.type==="income"){ if(e.account==="drawer") drawerIncome+=e.amount; else bankIncome+=e.amount; }
      else if(e.type==="transfer"){ if(e.from==="drawer") drawerToBank+=e.amount; else bankToDrawer+=e.amount; }
      else if(e.type==="supplier_payment" || e.type==="supplier_payment_reversal"){ const k = e.type==="supplier_payment" ? 1 : -1; if(e.account==="drawer") drawerSupplier+=k*e.amount; else bankSupplier+=k*e.amount; }
    });
    return {entries, drawerExpense, bankExpense, drawerIncome, bankIncome, drawerToBank, bankToDrawer, drawerSupplier:round2(drawerSupplier), bankSupplier:round2(bankSupplier)};
  }

  /* Invoice numbers and "one open business day" are now guaranteed by the database (atomic
     counter + unique index), so the old client-side self-healing is no longer needed. */
  async function runSelfHeal(){ return false; }

  /* ============ Persistence ============
     Menu, tables, settings, business days, cashbook and every order live in real Postgres tables
     (see supabase/migrations). Each write goes through the signed-in user's session, so Row Level
     Security + triggers decide what is allowed: a cashier's attempt to change a price, void a
     sale or edit a completed bill is rejected by the DATABASE, whatever this file does.
     The in-memory shapes (state.config / state.orders) are unchanged; DataLayer works out which
     rows changed and writes only those. A rejected or failed write is rolled back on screen. */
  let ordersSnapshot = new Map();   // id -> stable(order) exactly as the database holds it
  let dbFlags = {hasSettingsRow:false, hasCashbookConfig:false};
  let ordersSyncFailed = false;
  let allOrderPushesQueued = Promise.resolve();
  let allConfigPushesQueued = Promise.resolve();
  const SERVER_ORDER_KEYS = ["invoiceNo","paidAt","businessDayId","subtotal","total"];

  function snapshotOrders(list){ ordersSnapshot = new Map(list.map(o => [o.id, DL.stable(o)])); }
  // Legacy hooks: deletions are plain row deletes now (see DataLayer.saveOrders).
  function markOrderDeleted(){}
  function persistDeletedOrderIds(){}

  function pushOrders(retryCount, strict){
    const run = allOrderPushesQueued.then(() => doPushOrders(retryCount, strict));
    allOrderPushesQueued = run.catch(() => {});
    return run;
  }

  async function doPushOrders(retryCount, strict){
    if(!supabaseClient || !Authz.isSignedIn()){
      if(!strict){ ordersSyncFailed = true; showToast("Not signed in — change not saved"); }
      return false;
    }
    pendingWriteCount++;
    localWriteVersion++;
    setSyncStatus("syncing");
    try{
      const toSave = state.orders.map(clone);                       // freeze what we are sending
      const sent = new Map(toSave.map(o => [o.id, DL.stable(o)]));
      const res = await DL.saveOrders(ordersSnapshot, toSave);
      res.deleted.forEach(id => ordersSnapshot.delete(id));
      let mergedNote = false;
      res.saved.forEach(r => {
        const key = r.replaceId || r.id;                             // replaceId: another device opened this table first
        const local = state.orders.find(x => x.id === key);
        const unchanged = !!local && DL.stable(local) === sent.get(key);
        const adopt = unchanged || r.merged || !!r.replaceId;        // a merge brings in the other device's items: always take it
        if(local){
          if(r.replaceId) local.id = r.id;
          if(adopt) Object.assign(local, r.data);                    // adopt server-assigned invoice no / paid time / day / merged items
          else SERVER_ORDER_KEYS.forEach(k => { if(r.data[k] !== undefined) local[k] = r.data[k]; });
          if((r.merged || r.replaceId) && local.status !== "paid") mergedNote = true;
        }
        ordersSnapshot.set(r.id, adopt ? DL.stable(local) : DL.stable(r.data));
      });
      if(mergedNote){ showToast("This table was also updated on another device - items merged"); if(!state.modal) render(); }
      ordersSyncFailed = false;
      setSyncStatus("synced");
      return true;
    }catch(e){
      console.error("orders save failed", e);
      handleDbError(e);
      setSyncStatus(navigator.onLine === false ? "offline" : "error");
      if(strict){ if(e && e.conflictMsg) showToast(e.conflictMsg); return false; }   // caller rolls back and reports
      ordersSyncFailed = true;
      if(e && e.denied){
        showToast((e.conflictMsg) || "Not permitted — that change was rejected");
        syncFromCloud().catch(() => {});                             // show what the database really holds
      } else if(!retryCount){
        setTimeout(() => pushOrders(1), 3000);
      } else {
        showToast("Couldn't reach the database — this change isn't saved. Please retry once you're back online.");
      }
      return false;
    } finally {
      pendingWriteCount--;
    }
  }

  // Typing in a note field fires on every keystroke — debounce the write slightly.
  let notePushTimer = null, notePushPending = false;
  function scheduleOrdersPush(){
    clearTimeout(notePushTimer);
    notePushPending = true;
    notePushTimer = setTimeout(() => { notePushPending = false; pushOrders(); }, 500);
  }

  function persistConfig(){
    const run = allConfigPushesQueued.then(() => doPersistConfig());
    allConfigPushesQueued = run.catch(() => {});
    return run;
  }
  async function doPersistConfig(){
    if(!supabaseClient || !Authz.isSignedIn() || !lastCloudConfig){ rollbackConfig(); return false; }
    pendingWriteCount++;
    localWriteVersion++;
    setSyncStatus("syncing");
    try{
      const next = clone(state.config);
      await DL.saveConfig(lastCloudConfig, next, dbFlags);          // throws on the first rejected write
      lastCloudConfig = clone(next);
      setSyncStatus("synced");
      return true;
    }catch(e){
      console.error("config save failed — rolled back", e);
      handleDbError(e);
      setSyncStatus(navigator.onLine === false ? "offline" : "error");
      rollbackConfig();
      if(e && e.denied) showToast("Not permitted — that change was rejected");
      else saveFailedToast();
      // some rows may already have been written before the failure: re-read the truth
      setTimeout(() => { syncFromCloud().catch(() => {}); }, 300);
      return false;
    } finally {
      pendingWriteCount--;
    }
  }
  function rollbackConfig(){
    if(lastCloudConfig) state.config = clone(lastCloudConfig);
    // Don't rebuild an open modal — it would wipe whatever the person just typed.
    if(appReady && !state.modal) render();
  }

  // A cashier sale needs the day to exist; the database function opens it if none is open.
  function adoptBusinessDay(day){
    const add = (cfg) => {
      if(!cfg.businessDays) cfg.businessDays = [];
      if(!cfg.businessDays.some(d => d.id === day.id)) cfg.businessDays.push({...day});
    };
    add(state.config); if(lastCloudConfig) add(lastCloudConfig);
  }

  /* ============ Init ============ */
  const LOADING_HTML = document.getElementById("loadingScreen").innerHTML;
  function showInitError(){
    initFailed = true;
    const msg = !supabaseClient ? "Database not configured"
      : (navigator.onLine === false ? "No internet" : "Can't reach the database");
    const el = document.getElementById("loadingScreen");
    el.style.display = "flex";
    el.innerHTML = `
      <div class="mark">📡</div>
      <div style="font-weight:700; font-size:16px;">${msg}</div>
      <div style="color:var(--text-dim); font-size:13px; max-width:280px; text-align:center;">The menu and sales load straight from Supabase, so the app can't open without a connection.</div>
      <button class="btn btn-amber" id="initRetryBtn" style="margin-top:8px;">Retry</button>`;
    document.getElementById("initRetryBtn").addEventListener("click", retryInit);
  }
  function retryInit(){
    const el = document.getElementById("loadingScreen");
    el.innerHTML = LOADING_HTML;
    initFailed = false;
    init();
  }
  async function init(){
    try{
      if(!supabaseClient) throw new Error("Supabase is not configured");
      const data = await DL.loadAll();            // every read is filtered by RLS for this user's role
      dbFlags = {hasSettingsRow: data.hasSettingsRow, hasCashbookConfig: data.hasCashbookConfig};
      state.config = data.config;
      lastCloudConfig = clone(data.config);
      state.orders = data.orders;
      snapshotOrders(data.orders);
      // Brand-new organization: an ADMIN gets the starter menu (the database rejects this for a cashier).
      if(Authz.isAdmin() && !data.hasSettingsRow && data.config.categories.length === 0 && data.config.items.length === 0 && data.config.tables.length === 0){
        state.config = seedConfig();
        if(!(await persistConfig())) throw new Error("Couldn't create the starter menu");
      }
    }catch(e){
      console.error("init: couldn't load from Supabase", e);
      handleDbError(e);
      showInitError();
      return;
    }
    initFailed = false;
    appReady = true;

    document.getElementById("loadingScreen").style.display = "none";
    document.getElementById("app").style.display = "flex";

    bindStaticEvents();
    syncHash();
    render();

    if(timerInterval) clearInterval(timerInterval);
    timerInterval = setInterval(updateLiveTimers, 1000);
    startOrdersAutoRefresh();
  }

  /* Orders (open tables + sales + reports) refresh by themselves every few seconds so devices don't drift apart.
     Menu, items, categories and tables are NOT auto-pulled — they only refresh on the manual sync button.
     The refresh is skipped while a dialog/sheet is open, a save is in flight, or the user is typing. */
  let ordersRefreshTimer = null;
  function startOrdersAutoRefresh(){
    if(ordersRefreshTimer) clearInterval(ordersRefreshTimer);
    ordersRefreshTimer = setInterval(() => {
      if(document.hidden || !appReady || !Authz.isSignedIn()) return;
      const el = document.activeElement, tag = el && el.tagName;
      if(tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT") return;
      syncFromCloud({ordersOnly:true}).catch(() => {});
    }, 8000);
  }

  /* ============ Cloud sync (manual pull, automatic push) ============
     Pulling another device's changes only happens when the person taps the sync button (and
     the Kitchen screen refreshes orders every few seconds). Pushing is automatic. */
  async function syncFromCloud(opts){
    if(!Authz.isSignedIn() || !appReady) return;
    if(document.hidden) return;
    if(layerStack.length > 0) return;
    if(pendingWriteCount > 0 || notePushPending) return; // a change is still saving — don't race it
    const versionAtStart = localWriteVersion;
    try{
      let cfg = null, orders;
      if(opts && opts.ordersOnly){
        orders = await DL.loadOrders();
      } else {
        const d = await DL.loadAll();
        cfg = d.config; orders = d.orders;
        dbFlags = {hasSettingsRow: d.hasSettingsRow, hasCashbookConfig: d.hasCashbookConfig};
      }
      setSyncStatus("synced");
      // Something changed locally while this fetch was in flight — drop it, the next sync is correct.
      if(localWriteVersion !== versionAtStart || pendingWriteCount > 0 || layerStack.length > 0) return;
      const configChanged = !!cfg && !sameData(cfg, state.config);
      const ordersChanged = !sameData(orders, state.orders);
      if(!configChanged && !ordersChanged) return;
      if(configChanged){ state.config = cfg; lastCloudConfig = clone(cfg); }
      if(ordersChanged){ state.orders = orders; snapshotOrders(orders); }
      render();
    }catch(e){
      console.error("sync failed", e);
      handleDbError(e);
      if(supabaseClient) setSyncStatus(navigator.onLine === false ? "offline" : "error");
      throw e;
    }
  }

  // Close-day needs the NEWEST sales / cashbook entries: pull-sync is paused while a dialog is
  // open, and another device (a cashier) may have sold since this phone last synced. Returns
  // false if a local save is in flight (then the on-screen data is already the freshest).
  async function pullLatestForClose(){
    if(pendingWriteCount > 0) return false;
    const v = localWriteVersion;
    const d = await DL.loadAll();
    if(localWriteVersion !== v || pendingWriteCount > 0) return false;
    state.config = d.config; lastCloudConfig = clone(d.config);
    state.orders = d.orders; snapshotOrders(d.orders);
    dbFlags = {hasSettingsRow: d.hasSettingsRow, hasCashbookConfig: d.hasCashbookConfig};
    return true;
  }

  function updateLiveTimers(){
    document.querySelectorAll("[data-elapsed-start]").forEach(el=>{
      const start = Number(el.getAttribute("data-elapsed-start"));
      el.textContent = fmtElapsed(start);
    });
    // Keep "Synced Xm ago" ticking without needing an actual sync to fire
    if((syncStatus === "idle" || syncStatus === "synced") && lastSyncedAt){
      const label = document.getElementById("syncLabel");
      if(label) label.textContent = "Synced " + fmtAgo(lastSyncedAt);
    }
  }

  /* ============ Render root ============ */
  // Header shows the app name (mycafe) with this customer's store name in smaller text underneath.
  function updateStoreName(){
    const el = document.getElementById("storeName");
    if(!el) return;
    const n = String((state.config && state.config.settings && state.config.settings.cafeName) || "").trim();
    const shown = n.toLowerCase() === "mycafe" ? "" : n;        // no "mycafe / mycafe" duplicate

  function render(){
    if(!Authz.isSignedIn() || !state.config) return;
    // Defense in depth: never render a screen the role may not open.
    if(!Authz.canAccessTab(state.tab)){
      if(state.tab !== Authz.defaultTab()) showToast("Access denied");
      state.tab = Authz.defaultTab();
      syncHash();
    }
    document.querySelectorAll(".navbtn").forEach(b=>{
      b.classList.toggle("active", b.dataset.tab === state.tab);
    });
    document.getElementById("tabName").textContent = tabLabel(state.tab);
    updateStoreName();

    const view = document.getElementById("view");
    const keepConfirmFocus = document.activeElement && document.activeElement.id === "backupConfirm";   // typing the restore confirmation
    if(state.tab === "tables") view.innerHTML = renderTablesTab();
    else if(state.tab === "menu") view.innerHTML = renderMenuTab();
    else if(state.tab === "reports") view.innerHTML = renderReportsTab();
    else if(state.tab === "bills") view.innerHTML = renderStaffReportsTab();
    else if(state.tab === "kot") view.innerHTML = renderKotTab();
    else if(state.tab === "cashbook") view.innerHTML = renderCashbookTab();
    else if(state.tab === "suppliers") view.innerHTML = window.SupplierUI ? window.SupplierUI.render() : "";
    else if(state.tab === "users") view.innerHTML = renderUsersTab();
    else if(state.tab === "backup") view.innerHTML = renderBackupTab();
    else if(state.tab === "audit") view.innerHTML = renderAuditTab();

    if(keepConfirmFocus){ const c = document.getElementById("backupConfirm"); if(c){ c.focus(); try{ c.setSelectionRange(c.value.length, c.value.length); }catch(_){} } }
    updateKotNavBadge();
    manageKotPolling();
    // A background refresh must never wipe what someone is typing in an open dialog:
    // keep the typed values (and the focused field) across the rebuild of the same dialog.
    const modalRef = window.__NOKEEP ? null : state.modal;
    const typed = {}; let focusId = null, caret = null;
    if(modalRef){
      document.querySelectorAll("#modalRoot input[id], #modalRoot textarea[id], #modalRoot select[id]").forEach(el=>{ typed[el.id] = el.value; });
      const ae = document.activeElement;
      if(ae && ae.id && typed.hasOwnProperty(ae.id)){ focusId = ae.id; try{ caret = ae.selectionStart; }catch(_){ caret = null; } }
    }
    renderModal();
    if(modalRef && state.modal === modalRef){
      Object.keys(typed).forEach(id=>{
        const el = document.getElementById(id);
        if(el && el.type !== "checkbox" && el.type !== "radio" && el.value !== typed[id] && (el.tagName === "SELECT" ? [...el.options].some(o=>o.value===typed[id]) : true)) el.value = typed[id];
      });
      if(focusId){ const el = document.getElementById(focusId); if(el){ el.focus(); if(caret!==null){ try{ el.setSelectionRange(caret, caret); }catch(_){ /* number inputs */ } } } }
    }
  }
